usiness with you! You are not stepping one foot outside—don't you dare move!'", "Notes": "The mother returns, intensifying the chaotic confrontation."}, {"Scene_ID": "afternoon_sugisakaya", "Scene_Title": "妹背山婦女庭訓：杉酒屋の段 (Sugi Sakaya no Dan)", "Line_No": 17, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>白絹<rt>しらぎぬ</rt></ruby>の<ruby>姫<rt>ひめ</rt></ruby>は<ruby>外<rt>そと</rt></ruby>へと<ruby>出で<rt>いで</rt></ruby><ruby>行く<rt>いく</rt></ruby>を、とめる<ruby>求馬<rt>もとめ</rt></ruby>に、またすがる<ruby>娘<rt>むすめ</rt></ruby>を、<ruby>押<rt>おう</rt></ruby><ruby>分け<rt>わけ</rt></ruby><ruby>母親<rt>ははおや</rt></ruby>は「<ruby>求馬<rt>もとめ</rt></ruby>やらじ」と<ruby>引<rt>ひき</rt></ruby><ruby>止め<rt>とめ</rt></ruby><ruby>繋ぐ<rt>つなぐ</rt></ruby><ruby>手<rt>て</rt></ruby>と<ruby>手<rt>て</rt></ruby>。", "Japanese_Plain": "白絹の姫は外へと出で行くを、とめる求馬に、またすがる娘を、押分け母親は「求馬やらじ」と引止め繋ぐ手と手。", "English": "Seeing the commotion, Princess Tachibana in her white silk veil slips out the door into the night. Motome breaks away to follow her, while Omiwa clings desperately to him, and the mother thrusts between them shouting 'I won't let Motome go!' grasping hand over hand.", "Notes": "The classic Bunraku physical entanglement (shigarami) of three people pulling in opposite directions."}, {"Scene_ID": "afternoon_sugisakaya", "Scene_Title": "妹背山婦女庭訓：杉酒屋の段 (Sugi Sakaya no Dan)", "Line_No": 18, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>子太郎<rt>ねたろう</rt></ruby><ruby>立<rt>りつ</rt></ruby><ruby>出で<rt>いで</rt></ruby><ruby>見廻<rt>みまわり</rt></ruby>して、『これ<ruby>幸<rt>さち</rt></ruby>ひ』と<ruby>母親<rt>ははおや</rt></ruby>の<ruby>帯<rt>おび</rt></ruby>にしっかりくくったる<ruby>縄先<rt>なわさき</rt></ruby>を、<ruby>桶<rt>おけ</rt></ruby>の<ruby>呑み<rt>のみ</rt></ruby><ruby>口<rt>くち</rt></ruby>にゆひ<ruby>付け<rt>つけ</rt></ruby><ruby>納戸<rt>なんど</rt></ruby>へ<ruby>逃げ<rt>にげ</rt></ruby>て<ruby>入る<rt>いる</rt></ruby>。", "Japanese_Plain": "子太郎立出で見廻して、『これ幸ひ』と母親の帯にしっかりくくったる縄先を、桶の呑み口にゆひ付け納戸へ逃げて入る。", "English": "Netarō steps out, sees his chance: 'What luck!' and tightly ties the end of a rope attached to his mother's obi sash to the spigot of the huge sake vat, then dashes into the pantry to hide!", "Notes": "Comic slapstick: Netarō ties the mother to the sake barrel spigot."}, {"Scene_ID": "afternoon_sugisakaya", "Scene_Title": "妹背山婦女庭訓：杉酒屋の段 (Sugi Sakaya no Dan)", "Line_No": 19, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>母親<rt>ははおや</rt></ruby>が『<ruby>遣ら<rt>やら</rt></ruby>じ』と<ruby>追へ<rt>おへ</rt></ruby>ば<ruby>繋ぎ<rt>つなぎ</rt></ruby><ruby>縄<rt>なわ</rt></ruby>、<ruby>力む<rt>りきむ</rt></ruby><ruby>拍手<rt>はくしゅ</rt></ruby>に<ruby>呑み<rt>のみ</rt></ruby><ruby>口<rt>くち</rt></ruby><ruby>抜け<rt>ぬけ</rt></ruby><ruby>酒<rt>さけ</rt></ruby>は<ruby>滝<rt>たき</rt></ruby><ruby>津<rt>つ</rt></ruby><ruby>瀬<rt>せ</rt></ruby>びっくり<ruby>敗亡<rt>はいぼう</rt></ruby>！<ruby>三人<rt>さんにん</rt></ruby><ruby>門<rt>もん</rt></ruby>へ<ruby>遅れ<rt>おくれ</rt></ruby>じと、<ruby>同じ<rt>おなじ</rt></ruby><ruby>思ひ<rt>おもひ</rt></ruby>を<ruby>跡<rt>あと</rt></ruby>やさき、<ruby>道<rt>みち</rt></ruby>を<ruby>慕う<rt>したう</rt></ruby>て<ruby>追う<rt>おう</rt></ruby>て<ruby>行く<rt>いく</rt></ruby>。", "Japanese_Plain": "母親が『遣らじ』と追へば繋ぎ縄、力む拍手に呑み口抜け酒は滝津瀬びっくり敗亡！三人門へ遅れじと、同じ思ひを跡やさき、道を慕うて追うて行く。", "English": "As the mother lunges forward yelling 'I won't let you go!', the taut rope jerks the spigot completely free—sake cascades out like a roaring waterfall in disastrous ruin! Refusing to be outdone, all three burst through the gate in headlong pursuit, driven by their intertwined destinies into the night!", "Notes": "Climax of Sugi Sakaya: sake flooding everywhere as the dramatic pursuit into Michiyuki begins."}, {"Scene_ID": "afternoon_michiyuki", "Scene_Title": "妹背山婦女庭訓：道行恋苧環 (Michiyuki Koi no Odamaki)", "Line_No": 1, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>岩戸<rt>いわと</rt></ruby><ruby>隠れ<rt>かくれ</rt></ruby>し<ruby>神様<rt>かみさま</rt></ruby>は、<ruby>誰<rt>だれ</rt></ruby>と<ruby>寝ね<rt>ねね</rt></ruby>して<ruby>常闇<rt>とこやみ</rt></ruby>の、<ruby>夜々<rt>よよ</rt></ruby><ruby>毎に<rt>ごとに</rt></ruby><ruby>通<rt>とおり</rt></ruby>ひてはまた<ruby>帰る<rt>かえる</rt></ruby>さの、<ruby>道<rt>みち</rt></ruby>もせ<ruby>気も<rt>きも</rt></ruby>せそれも<ruby>何故<rt>なぜ</rt></ruby><ruby>恋<rt>こい</rt></ruby><ruby>故に<rt>ゆえに</rt></ruby>やつるゝ<ruby>所<rt>ところ</rt></ruby><ruby>体<rt>からだ</rt></ruby><ruby>恥か<rt>はずか</rt></ruby>しと、おもかげ<ruby>隠す<rt>かくす</rt></ruby><ruby>薄衣<rt>うすぎぬ</rt></ruby>に<ruby>包め<rt>つつめ</rt></ruby>ど<ruby>香り<rt>かおり</rt></ruby><ruby>橘姫<rt>たちばなひめ</rt></ruby>。", "Japanese_Plain": "岩戸隠れし神様は、誰と寝ねして常闇の、夜々毎に通ひてはまた帰るさの、道もせ気もせそれも何故恋故にやつるゝ所体恥かしと、おもかげ隠す薄衣に包めど香り橘姫。", "English": "Like the sun goddess concealed within the Heavenly Rock Cave, with whom did she slumber in eternal night? Slipping forth night after night and returning before dawn, her spirit weighed down along the crowded road—all for the sake of love! Ashamed of her love-lorn, disheveled state, though she wraps herself in a thin veil to hide her features, the noble fragrance of Princess Tachibana cannot be concealed.", "Notes": "Opening of the celebrated travel dance (Michiyuki Koi no Odamaki). Wordplay referencing Amaterasu and the scent of Tachibana (wild orange)."}, {"Scene_ID": "afternoon_michiyuki", "Scene_Title": "妹背山婦女庭訓：道行恋苧環 (Michiyuki Koi no Odamaki)", "Line_No": 2, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>思は<rt>おもは</rt></ruby>ぬ<ruby>人<rt>にん</rt></ruby>を<ruby>思ひ<rt>おもひ</rt></ruby><ruby>侘び<rt>わび</rt></ruby>、<ruby>心<rt>こころ</rt></ruby>のたけを<ruby>口説け<rt>くどけ</rt></ruby>ども、つれなき<ruby>松<rt>まつ</rt></ruby>の<ruby>下<rt>した</rt></ruby><ruby>紅葉<rt>こうよう</rt></ruby>、<ruby>焦が<rt>こが</rt></ruby>れて<ruby>絶<rt>ぜつ</rt></ruby>へん<ruby>玉の緒<rt>たまのお</rt></ruby>も、<ruby>殿<rt>どの</rt></ruby><ruby>故な<rt>ゆえな</rt></ruby>らば<ruby>捨て<rt>すて</rt></ruby><ruby>草<rt>くさ</rt></ruby>も<ruby>暫し<rt>しばし</rt></ruby>は<ruby>憩<rt>けい</rt></ruby>ふ<ruby>芝村<rt>しばむら</rt></ruby>の、<ruby>釜<rt>かま</rt></ruby>が<ruby>口<rt>くち</rt></ruby>をも<ruby>出離<rt>しゅつり</rt></ruby>れて。", "Japanese_Plain": "思はぬ人を思ひ侘び、心のたけを口説けども、つれなき松の下紅葉、焦がれて絶へん玉の緒も、殿故ならば捨て草も暫しは憩ふ芝村の、釜が口をも出離れて。", "English": "Yearning for one beyond her station, pouring out the fullness of her heart, yet met with cold indifference like autumn leaves beneath an unbending pine! Though the jeweled cord of life may snap from burning passion, for the lord's sake no sacrifice is too great as she hastens past Kamagakuchi in the hamlet of Shiba.", "Notes": "Expressing Princess Tachibana's torment: loving Motome despite the political hostility between their rival clans."}, {"Scene_ID": "afternoon_michiyuki", "Scene_Title": "妹背山婦女庭訓：道行恋苧環 (Michiyuki Koi no Odamaki)", "Line_No": 3, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>歩む<rt>あゆむ</rt></ruby>に<ruby>暗き<rt>くらき</rt></ruby>くれ<ruby>竹<rt>たけ</rt></ruby>の<ruby>茂れ<rt>しげれ</rt></ruby>る<ruby>中<rt>なか</rt></ruby>をちらちらと<ruby>見<rt>けん</rt></ruby>へつ<ruby>隠れ<rt>かくれ</rt></ruby>つ、<ruby>帰る<rt>かえる</rt></ruby>さの<ruby>跡<rt>あと</rt></ruby>を<ruby>求馬<rt>もとめ</rt></ruby>が<ruby>慕ひ<rt>したひ</rt></ruby><ruby>来て<rt>きて</rt></ruby>、<ruby>互<rt>ご</rt></ruby>にはたと<ruby>行き<rt>いき</rt></ruby><ruby>合ひ<rt>あひ</rt></ruby>の、<ruby>星<rt>ほし</rt></ruby>の<ruby>光<rt>ひかり</rt></ruby>に<ruby>顔<rt>かお</rt></ruby>と<ruby>顔<rt>かお</rt></ruby>。", "Japanese_Plain": "歩むに暗きくれ竹の茂れる中をちらちらと見へつ隠れつ、帰るさの跡を求馬が慕ひ来て、互にはたと行き合ひの、星の光に顔と顔。", "English": "Flickering in and out of view amid the dense shadows of black bamboo, Motome follows close upon her retreating trail. Suddenly they encounter one another face to face beneath the glimmer of the stars.", "Notes": "Motome intercepts Princess Tachibana in the night."}, {"Scene_ID": "afternoon_michiyuki", "Scene_Title": "妹背山婦女庭訓：道行恋苧環 (Michiyuki Koi no Odamaki)", "Line_No": 4, "Speaker": "橘姫 (Princess Tachibana)", "Japanese_Ruby": "「ヤア<ruby>恋人<rt>こいびと</rt></ruby>か<ruby>何故<rt>なぜ</rt></ruby>に、こヽこまで<ruby>跡<rt>あと</rt></ruby>を<ruby>追ひ<rt>おひ</rt></ruby><ruby>鳥<rt>とり</rt></ruby>は、もしやねぐらの<ruby>契り<rt>ちぎり</rt></ruby>をも<ruby>叶<rt>かのう</rt></ruby>へてやろとのお<ruby>心<rt>こころ</rt></ruby>か」", "Japanese_Plain": "「ヤア恋人か何故に、こヽまで跡を追ひ鳥は、もしやねぐらの契りをも叶へてやろとのお心か」", "English": "'Ah, my beloved! Why have you flown like a bird tracking my trail so far? Can it be that you intend to grant our vow of love within my secret roost tonight?'", "Notes": "Tachibana's lyrical, poetic verse to Motome."}, {"Scene_ID": "afternoon_michiyuki", "Scene_Title": "妹背山婦女庭訓：道行恋苧環 (Michiyuki Koi no Odamaki)", "Line_No": 5, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>胸<rt>むね</rt></ruby>にはいへど<ruby>詞<rt>し</rt></ruby>には、おもはゆぶりの<ruby>袖<rt>そで</rt></ruby><ruby>几帳<rt>きちょう</rt></ruby>。「<ruby>求馬<rt>もとめ</rt></ruby><ruby>殿<rt>どの</rt></ruby>、<ruby>人目<rt>ひとめ</rt></ruby><ruby>忍ぶ<rt>しのぶ</rt></ruby><ruby>仮の<rt>かりの</rt></ruby><ruby>宿<rt>やど</rt></ruby>、なぜ<ruby>跡<rt>あと</rt></ruby>を<ruby>追う<rt>おう</rt></ruby>て<ruby>来ら<rt>こら</rt></ruby>れた」と<ruby>問へ<rt>とへ</rt></ruby>ば、<ruby>求馬<rt>もとめ</rt></ruby>はただ<ruby>微笑み<rt>ほほえみ</rt></ruby>てその<ruby>手<rt>て</rt></ruby>を<ruby>握り<rt>にぎり</rt></ruby><ruby>締む<rt>しむ</rt></ruby>るのみ。", "Japanese_Plain": "胸にはいへど詞には、おもはゆぶりの袖几帳。「求馬殿、人目忍ぶ仮の宿、なぜ跡を追うて来られた」と問へば、求馬はただ微笑みてその手を握り締むるのみ。", "English": "Though her heart yearns to say so, her words hide modestly behind the screen of her sleeve: 'Master Motome, we meet only in secrecy at fleeting shelters—why have you pursued my steps so far?' In answer, Motome merely smiles and gently presses her hands.", "Notes": "Sode-kichō (袖几帳): raising a kimono sleeve as a portable modesty screen."}, {"Scene_ID": "afternoon_michiyuki", "Scene_Title": "妹背山婦女庭訓：道行恋苧環 (Michiyuki Koi no Odamaki)", "Line_No": 6, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "こなたに<ruby>追ひ<rt>おひ</rt></ruby>すがる<ruby>お三輪<rt>おみわ</rt></ruby>、<ruby>二人<rt>ふたり</rt></ruby>の<ruby>睦言<rt>むつごと</rt></ruby>を<ruby>物陰<rt>ものかげ</rt></ruby>より<ruby>見出し<rt>みだし</rt></ruby>、<ruby>胸<rt>むね</rt></ruby>を<ruby>掻き<rt>かき</rt></ruby><ruby>裂か<rt>さか</rt></ruby>るる<ruby>悋気<rt>りんき</rt></ruby>の<ruby>炎<rt>ほのお</rt></ruby>。「あれ<ruby>見や<rt>みや</rt></ruby>、あの<ruby>女<rt>おんな</rt></ruby>の<ruby>手<rt>て</rt></ruby>を<ruby>取つ<rt>とつ</rt></ruby>て……<ruby>求馬<rt>もとめ</rt></ruby><ruby>様<rt>さま</rt></ruby>、あのお<ruby>方<rt>ほう</rt></ruby>に<ruby>心<rt>こころ</rt></ruby><ruby>奪<rt>だつ</rt></ruby>はれたか！」", "Japanese_Plain": "こなたに追ひすがるお三輪、二人の睦言を物陰より見出し、胸を掻き裂かるる悋気の炎。「あれ見や、あの女の手を取つて……求馬様、あのお方に心奪はれたか！」", "English": "Rushing up behind them, Omiwa spots the two whispering intimate sweet nothings from behind the shadows, flames of jealousy tearing at her breast: 'Look at that! Taking that woman's hand... Master Motome, has your heart truly been stolen by her?!'", "Notes": "Omiwa witnesses the tender intimacy between Motome and Tachibana."}, {"Scene_ID": "afternoon_michiyuki", "Scene_Title": "妹背山婦女庭訓：道行恋苧環 (Michiyuki Koi no Odamaki)", "Line_No": 7, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>恋<rt>こい</rt></ruby>のしがらみ<ruby>蔦<rt>つた</rt></ruby>かづら、<ruby>付き<rt>つき</rt></ruby><ruby>纏は<rt>まつは</rt></ruby>れてくる／＼／＼、<ruby>廻る<rt>まわる</rt></ruby>や<ruby>三つ<rt>みっつ</rt></ruby>の<ruby>小車<rt>おぐるま</rt></ruby>の、<ruby>花よ<rt>はなよ</rt></ruby>り<ruby>白む<rt>しらむ</rt></ruby><ruby>横雲<rt>よこぐも</rt></ruby>のたなびき<ruby>渡り<rt>わたり</rt></ruby>あり／＼と、<ruby>三笠<rt>みかさ</rt></ruby>の<ruby>山<rt>やま</rt></ruby>も<ruby>程近く<rt>ほどちかく</rt></ruby>。", "Japanese_Plain": "恋のしがらみ蔦かづら、付き纏はれてくる／＼／＼、廻るや三つの小車の、花より白む横雲のたなびき渡りあり／＼と、三笠の山も程近く。", "English": "Entangled in the vines of love, tightly bound, whirling round and round like three linked cartwheels! Trailing white like horizontal clouds drifting across the dawn, with the slopes of Mount Mikasa drawing ever nearer.", "Notes": "The famous choreography of three figures spinning in unison (Mitsu no Oguruma)."}, {"Scene_ID": "afternoon_michiyuki", "Scene_Title": "妹背山婦女庭訓：道行恋苧環 (Michiyuki Koi no Odamaki)", "Line_No": 8, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>鳴る<rt>なる</rt></ruby><ruby>鐘<rt>かね</rt></ruby>の<ruby>音<rt>おと</rt></ruby>に<ruby>驚く<rt>おどろく</rt></ruby><ruby>姫<rt>ひめ</rt></ruby>『<ruby>帰る<rt>かえる</rt></ruby><ruby>所<rt>ところ</rt></ruby>は<ruby>何処<rt>どこ</rt></ruby>ぞ』と、<ruby>求馬<rt>もとめ</rt></ruby>が<ruby>気転<rt>きてん</rt></ruby><ruby>振り袖<rt>ふりそで</rt></ruby>のはしに<ruby>縫<rt>ほう</rt></ruby>ふてふ<ruby>取り<rt>とり</rt></ruby><ruby>交は<rt>かは</rt></ruby>す。", "Japanese_Plain": "鳴る鐘の音に驚く姫『帰る所は何処ぞ』と、求馬が気転振り袖のはしに縫ふてふ取り交はす。", "English": "Startled by the solemn chime of a temple bell, the princess turns to flee. Anxious to discover where she dwells, Motome quickly uses his wit to pin a needle threaded with white silk to the hem of her fluttering sleeve.", "Notes": "Motome attaches the white thread to track Princess Tachibana to Iruka's palace."}, {"Scene_ID": "afternoon_michiyuki", "Scene_Title": "妹背山婦女庭訓：道行恋苧環 (Michiyuki Koi no Odamaki)", "Line_No": 9, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>縁<rt>へり</rt></ruby>の<ruby>苧環<rt>おだまき</rt></ruby>いとしさの、あまりて<ruby>三輪<rt>みわ</rt></ruby>も<ruby>悋気<rt>りんき</rt></ruby>の<ruby>針<rt>はり</rt></ruby>、<ruby>男<rt>おとこ</rt></ruby>の<ruby>裾<rt>すそ</rt></ruby>に<ruby>付く<rt>つく</rt></ruby>るとも<ruby>知らず<rt>しらず</rt></ruby><ruby>印<rt>いん</rt></ruby>の<ruby>糸筋<rt>いとすじ</rt></ruby>を、<ruby>慕ひ<rt>したひ</rt></ruby><ruby>慕ふ<rt>したふ</rt></ruby>て<ruby>追ひ<rt>おひ</rt></ruby>ゆく。", "Japanese_Plain": "縁の苧環いとしさの、あまりて三輪も悋気の針、男の裾に付くるとも知らず印の糸筋を、慕ひ慕ふて追ひゆく。", "English": "Driven by the desperate longing of love's spool, Omiwa too takes a needle threaded with crimson thread of jealousy and pins it secretly to Motome's coat hem. Unaware of the guiding mark trailing behind him, Motome follows the white thread, while Omiwa pursues the red thread through the dark hills!", "Notes": "Climax of Michiyuki Koi no Odamaki: the red thread (Omiwa) tracking the white thread (Motome to Tachibana)."}, {"Scene_ID": "afternoon_fukashichi", "Scene_Title": "妹背山婦女庭訓：鱶七使者の段 (Fukashichi Shisha no Dan)", "Line_No": 1, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>栄<rt>さかえ</rt></ruby>ゆる<ruby>花<rt>はな</rt></ruby>も<ruby>時<rt>とき</rt></ruby>しあればすがり<ruby>嵐<rt>あらし</rt></ruby>のあるぞとは、いさ<ruby>白雲<rt>はくうん</rt></ruby>の<ruby>高御座<rt>たかみくら</rt></ruby>。<ruby>新たに<rt>あらたに</rt></ruby><ruby>造る<rt>つくる</rt></ruby><ruby>玉殿<rt>ぎょくでん</rt></ruby>はかの<ruby>唐<rt>とう</rt></ruby>くにの<ruby>阿房殿<rt>あほうでん</rt></ruby>。ここに<ruby>移し<rt>うつし</rt></ruby>て<ruby>三笠山<rt>みかさやま</rt></ruby>。<ruby>月<rt>がつ</rt></ruby>も<ruby>入鹿<rt>いるか</rt></ruby>が<ruby>威光<rt>いこう</rt></ruby>には<ruby>覆は<rt>おおは</rt></ruby>れますぞ<ruby>是非<rt>ぜひ</rt></ruby>なけれ。", "Japanese_Plain": "栄ゆる花も時しあればすがり嵐のあるぞとは、いさ白雲の高御座。新たに造る玉殿はかの唐くにの阿房殿。ここに移して三笠山。月も入鹿が威光には覆はれますぞ是非なけれ。", "English": "Though blossoms flourish in their season, they know not when the raging tempest shall strike—yet heedless high upon the throne amid white clouds sits the tyrant. This newly erected palace rivals the legendary Epang Palace of ancient China, transported here to Mount Mikasa; even the moon itself is eclipsed by Iruka's terrifying power.", "Notes": "Opening of Fukashichi Shisha no Dan. The opulence of the palace highlights tyrant Soga no Iruka's hubris."}, {"Scene_ID": "afternoon_fukashichi", "Scene_Title": "妹背山婦女庭訓：鱶七使者の段 (Fukashichi Shisha no Dan)", "Line_No": 2, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>腋<rt>わき</rt></ruby><ruby>門<rt>もん</rt></ruby>の<ruby>方<rt>ほう</rt></ruby>より<ruby>宮越玄蕃<rt>みやこしげんば</rt></ruby>、<ruby>荒巻弥藤次<rt>あらまきやとうじ</rt></ruby>。<ruby>御前<rt>おまえ</rt></ruby>よきまま<ruby>高<rt>たか</rt></ruby>う<ruby>吹く<rt>ふく</rt></ruby>、<ruby>帆<rt>ほ</rt></ruby>かけ<ruby>烏帽子<rt>えぼし</rt></ruby>も<ruby>十分<rt>じゅうぶん</rt></ruby>に、のけぞり<ruby>返り<rt>かえり</rt></ruby><ruby>入り<rt>いり</rt></ruby><ruby>来た<rt>きた</rt></ruby>り。", "Japanese_Plain": "腋門の方より宮越玄蕃、荒巻弥藤次。御前よきまま高う吹く、帆かけ烏帽子も十分に、のけぞり返り入り来たり。", "English": "Through the side gate swagger vassals Miyakoshi Genba and Aramaki Yatōji. Bathed in the tyrant's favor, their court caps puffed high with insolence, they lean back arrogantly as they enter.", "Notes": "Genba and Yatōji represent the corrupt, cowardly samurai retainers serving the tyrant."}, {"Scene_ID": "afternoon_fukashichi", "Scene_Title": "妹背山婦女庭訓：鱶七使者の段 (Fukashichi Shisha no Dan)", "Line_No": 3, "Speaker": "宮越玄蕃 (Genba)", "Japanese_Ruby": "「イヤなに<ruby>玄蕃<rt>げんば</rt></ruby><ruby>殿<rt>どの</rt></ruby>、このたび<ruby>新たに<rt>あらたに</rt></ruby><ruby>築か<rt>きづか</rt></ruby>れたるこの<ruby>山<rt>やま</rt></ruby><ruby>御殿<rt>ごてん</rt></ruby>。<ruby>朝日<rt>あさひ</rt></ruby>に<ruby>輝く<rt>かがやく</rt></ruby>ところは<ruby>吉野<rt>よしの</rt></ruby><ruby>龍田<rt>たつた</rt></ruby>の<ruby>花紅葉<rt>はなもみじ</rt></ruby>。<ruby>一度<rt>いちど</rt></ruby>に<ruby>見る<rt>みる</rt></ruby>とも<ruby>及び<rt>および</rt></ruby>ますまい」", "Japanese_Plain": "「イヤなに玄蕃殿、このたび新たに築かれたるこの山御殿。朝日に輝くところは吉野龍田の花紅葉。一度に見るとも及びますまい」", "English": "'Well now, Brother Genba! Look upon this mountaintop palace newly built! Shining in the morning sun, neither the cherry blossoms of Yoshino nor the autumn maples of Tatsuta can compare in splendour!'", "Notes": "Vassals boasting of the palace's extravagance."}, {"Scene_ID": "afternoon_fukashichi", "Scene_Title": "妹背山婦女庭訓：鱶七使者の段 (Fukashichi Shisha no Dan)", "Line_No": 4, "Speaker": "荒巻弥藤次 (Yatōji)", "Japanese_Ruby": "「ナニサ、<ruby>瑪瑙<rt>めのう</rt></ruby>のうつばり、<ruby>珊瑚<rt>さんご</rt></ruby>の<ruby>柱<rt>はしら</rt></ruby>、<ruby>水晶<rt>すいしょう</rt></ruby>の<ruby>御簾<rt>みす</rt></ruby>、<ruby>瑠璃<rt>るり</rt></ruby>の<ruby>障子<rt>しょうじ</rt></ruby>。<ruby>飛石<rt>とびいし</rt></ruby>は<ruby>琥珀<rt>こはく</rt></ruby>、<ruby>砂<rt>すな</rt></ruby>は<ruby>金銀<rt>きんぎん</rt></ruby>、<ruby>若草<rt>わかくさ</rt></ruby><ruby>山<rt>やま</rt></ruby>も<ruby>手に<rt>てに</rt></ruby>とるやうな<ruby>天下<rt>てんか</rt></ruby>の<ruby>威勢<rt>いせい</rt></ruby>ぢゃ」", "Japanese_Plain": "「ナニサ、瑪瑙のうつばり、珊瑚の柱、水晶の御簾、瑠璃の障子。飛石は琥珀、砂は金銀、若草山も手にとるやうな天下の威勢ぢゃ」", "English": "'Indeed! Beams of agate, pillars of coral, blinds of crystal, sliding screens of lapis lazuli! Amber stepping stones, gold and silver gravel—the supreme might of the realm holds even Mount Wakakusa in the palm of its hand!'", "Notes": "Describing the mythic luxury built on the suffering of the realm."}, {"Scene_ID": "afternoon_fukashichi", "Scene_Title": "妹背山婦女庭訓：鱶七使者の段 (Fukashichi Shisha no Dan)", "Line_No": 5, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "そこへ<ruby>現れ<rt>あらわれ</rt></ruby><ruby>出で<rt>いで</rt></ruby>たるは、<ruby>鎌足<rt>かまたり</rt></ruby><ruby>公<rt>こう</rt></ruby>の<ruby>使者<rt>ししゃ</rt></ruby>、<ruby>漁師<rt>りょうし</rt></ruby><ruby>鱶七<rt>ふかしち</rt></ruby>。<ruby>粗末<rt>そまつ</rt></ruby>な<ruby>木綿<rt>もめん</rt></ruby>の<ruby>羽織<rt>はおり</rt></ruby>に<ruby>素足<rt>すあし</rt></ruby>、<ruby>太き<rt>ふとき</rt></ruby><ruby>腕<rt>うで</rt></ruby>を<ruby>組み<rt>くみ</rt></ruby>、のしのしと<ruby>歩み<rt>あゆみ</rt></ruby><ruby>寄る<rt>よる</rt></ruby>。", "Japanese_Plain": "そこへ現れ出でたるは、鎌足公の使者、漁師鱶七。粗末な木綿の羽織に素足、太き腕を組み、のしのしと歩み寄る。", "English": "Stepping boldly forward into the hall comes Fukashichi the fisherman, emissary of Lord Fujiwara no Kamatari. Clad in coarse cotton, barefoot, massive arms folded across his broad chest, he strides forward with thunderous confidence.", "Notes": "Fukashichi's entrance: rustic, powerful, and utterly unimpressed by royal pomp."}, {"Scene_ID": "afternoon_fukashichi", "Scene_Title": "妹背山婦女庭訓：鱶七使者の段 (Fukashichi Shisha no Dan)", "Line_No": 6, "Speaker": "宮越玄蕃 (Genba)", "Japanese_Ruby": "「ヤイ<ruby>鱶七<rt>ふかしち</rt></ruby>！<ruby>卑しき<rt>いやしき</rt></ruby><ruby>漁師<rt>りょうし</rt></ruby><ruby>風情<rt>ふぜい</rt></ruby>が<ruby>鎌足<rt>かまたり</rt></ruby><ruby>公<rt>こう</rt></ruby>の<ruby>使者<rt>ししゃ</rt></ruby>と<ruby>称し<rt>しょうし</rt></ruby>、<ruby>畏れ多く<rt>おそれおーく</rt></ruby>も<ruby>我が<rt>わが</rt></ruby><ruby>君<rt>くん</rt></ruby>の<ruby>御前<rt>おまえ</rt></ruby>にまかり<ruby>出づ<rt>いづ</rt></ruby>るとは<ruby>無礼<rt>ぶれい</rt></ruby><ruby>千万<rt>せんまん</rt></ruby>！まずは<ruby>額<rt>ひたい</rt></ruby>を<ruby>畳<rt>たたみ</rt></ruby>に<ruby>擦り<rt>すり</rt></ruby><ruby>付け<rt>つけ</rt></ruby>、<ruby>君<rt>くん</rt></ruby>の<ruby>威光<rt>いこう</rt></ruby>を<ruby>拝<rt>はい</rt></ruby>せ！」", "Japanese_Plain": "「ヤイ鱶七！卑しき漁師風情が鎌足公の使者と称し、畏れ多くも我が君の御前にまかり出づるとは無礼千万！まずは額を畳に擦り付け、君の威光を拝せ！」", "English": "'Hey there, Fukashichi! A lowly peasant fisherman claiming to be Lord Kamatari's envoy—to dare swagger into our lord's exalted presence is insolence beyond measure! Bow your forehead to the floor mats and pay homage to our master's imperial majesty!'", "Notes": "The retainers attempt to intimidate Fukashichi."}, {"Scene_ID": "afternoon_fukashichi", "Scene_Title": "妹背山婦女庭訓：鱶七使者の段 (Fukashichi Shisha no Dan)", "Line_No": 7, "Speaker": "鱶七 (Fukashichi)", "Japanese_Ruby": "「ハハハハ！<ruby>額<rt>ひたい</rt></ruby>を<ruby>擦れ<rt>すれ</rt></ruby>とは<ruby>臍<rt>へそ</rt></ruby>が<ruby>茶<rt>ちゃ</rt></ruby>を<ruby>沸か<rt>わか</rt></ruby>すわい！<ruby>大魚<rt>おおうお</rt></ruby>や<ruby>海<rt>うみ</rt></ruby><ruby>坊主<rt>ぼうず</rt></ruby>の<ruby>荒波<rt>あらなみ</rt></ruby>を<ruby>見慣れ<rt>みなれ</rt></ruby>たこの<ruby>鱶七<rt>ふかしち</rt></ruby>、<ruby>入鹿<rt>いるか</rt></ruby><ruby>公<rt>こう</rt></ruby>の<ruby>威光<rt>いこう</rt></ruby>ばかりで<ruby>腰<rt>こし</rt></ruby>が<ruby>抜け<rt>ぬけ</rt></ruby>ると<ruby>思ひ<rt>おもひ</rt></ruby>なさるな！」", "Japanese_Plain": "「ハハハハ！額を擦れとは臍が茶を沸かすわい！大魚や海坊主の荒波を見慣れたこの鱶七、入鹿公の威光ばかりで腰が抜けると思ひなさるな！」", "English": "'Bwahahaha! Bow and scrape? My navel boils tea at such folly! This Fukashichi is accustomed to giant sea monsters and tempestuous ocean waves—did you think a bit of Iruka's bluster would make my knees buckle?!'", "Notes": "Fukashichi roars with contempt at their posturing."}, {"Scene_ID": "afternoon_fukashichi", "Scene_Title": "妹背山婦女庭訓：鱶七使者の段 (Fukashichi Shisha no Dan)", "Line_No": 8, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>腹立ち<rt>はらだち</rt></ruby><ruby>紛れ<rt>まぎれ</rt></ruby>に<ruby>玄蕃<rt>げんば</rt></ruby><ruby>弥藤次<rt>やとうじ</rt></ruby>、<ruby>大盃<rt>おおさかずき</rt></ruby>に<ruby>満々<rt>まんまん</rt></ruby>となみなみと<ruby>注ぎ<rt>そそぎ</rt></ruby>たるは、<ruby>一滴<rt>いってき</rt></ruby>にて<ruby>五臓<rt>ごぞう</rt></ruby><ruby>六腑<rt>ろっぷ</rt></ruby>を<ruby>溶か<rt>とか</rt></ruby>す<ruby>猛毒<rt>もうどく</rt></ruby>の<ruby>酒<rt>さけ</rt></ruby>。", "Japanese_Plain": "腹立ち紛れに玄蕃弥藤次、大盃に満々となみなみと注ぎたるは、一滴にて五臓六腑を溶かす猛毒の酒。", "English": "Choking with fury, Genba and Yatōji prepare a giant lacquer cup, filling it to the brim with lethal poisoned sake capable of melting the five internal organs with a single drop.", "Notes": "The poison test: attempting to murder the insolent envoy."}, {"Scene_ID": "afternoon_fukashichi", "Scene_Title": "妹背山婦女庭訓：鱶七使者の段 (Fukashichi Shisha no Dan)", "Line_No": 9, "Speaker": "宮越玄蕃 (Genba)", "Japanese_Ruby": "「これ<ruby>鱶七<rt>ふかしち</rt></ruby>、<ruby>我が<rt>わが</rt></ruby><ruby>君<rt>くん</rt></ruby>より<ruby>下さ<rt>くださ</rt></ruby>れし<ruby>至極<rt>しごく</rt></ruby>の<ruby>美酒<rt>びしゅ</rt></ruby>！これを<ruby>一息<rt>ひといき</rt></ruby>に<ruby>飲み干し<rt>のみほし</rt></ruby>て<ruby>見せ<rt>みせ</rt></ruby>よ！」", "Japanese_Plain": "「これ鱶七、我が君より下されし至極の美酒！これを一息に飲み干して見せよ！」", "English": "'Here, Fukashichi! An exquisite draught of divine sake bestowed by our sovereign! Drain this cup dry in a single draught if you dare!'", "Notes": "Genba challenges him to drink the deadly brew."}, {"Scene_ID": "afternoon_fukashichi", "Scene_Title": "妹背山婦女庭訓：鱶七使者の段 (Fukashichi Shisha no Dan)", "Line_No": 10, "Speaker": "鱶七 (Fukashichi)", "Japanese_Ruby": "「おう、<ruby>酒<rt>さけ</rt></ruby>とあらば<ruby>三日<rt>みっか</rt></ruby><ruby>飲ま<rt>のま</rt></ruby>ねば<ruby>口<rt>くち</rt></ruby>が<ruby>干<rt>かん</rt></ruby>からびる<ruby>鱶七<rt>ふかしち</rt></ruby>よ！<ruby>毒<rt>どく</rt></ruby>と<ruby>知ら<rt>しら</rt></ruby>ぬ<ruby>阿呆<rt>あほ</rt></ruby>ぢゃなし、<ruby>毒<rt>どく</rt></ruby>と<ruby>知り<rt>しり</rt></ruby>つゝ<ruby>飲み干す<rt>のみほす</rt></ruby>こそ<ruby>真<rt>まこと</rt></ruby>の<ruby>剛胆<rt>ごうたん</rt></ruby>！」", "Japanese_Plain": "「おう、酒とあらば三日飲まねば口が干からびる鱶七よ！毒と知らぬ阿呆ぢゃなし、毒と知りつゝ飲み干すこそ真の剛胆！」", "English": "'Ha! When it comes to drink, if Fukashichi goes three days without a drop my throat parches! I am no fool who cannot smell poison—yet drinking it down knowingly is the mark of true warrior grit!'", "Notes": "Fukashichi sees through their trick and accepts the deadly challenge."}, {"Scene_ID": "afternoon_fukashichi", "Scene_Title": "妹背山婦女庭訓：鱶七使者の段 (Fukashichi Shisha no Dan)", "Line_No": 11, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>大盃<rt>おおさかずき</rt></ruby>を<ruby>両手<rt>りょうて</rt></ruby>にぐつと<ruby>捧げ<rt>ささげ</rt></ruby><ruby>持ち<rt>もち</rt></ruby>、<ruby>喉<rt>のど</rt></ruby><ruby>鳴ら<rt>なら</rt></ruby>して<ruby>一息<rt>ひといき</rt></ruby>に<ruby>呷<rt>こう</rt></ruby>り<ruby>干し<rt>ほし</rt></ruby>、<ruby>盃<rt>はい</rt></ruby>を<ruby>庭<rt>にわ</rt></ruby>へからりと<ruby>投出<rt>とうしゅつ</rt></ruby>し、<ruby>豪快<rt>ごうかい</rt></ruby>に<ruby>髭<rt>ひげ</rt></ruby>を<ruby>撫づ<rt>なづ</rt></ruby>る。", "Japanese_Plain": "大盃を両手にぐつと捧げ持ち、喉鳴らして一息に呷り干し、盃を庭へからりと投出し、豪快に髭を撫づる。", "English": "Grasping the giant bowl firmly with both hands, he gulps it down in a single breath without pausing for air; then flinging the empty cup clattering into the courtyard, he strokes his bristling beard with a roaring laugh.", "Notes": "Heroic Bunraku mie pose: Fukashichi drinks the poison unhurt through his inner spiritual power."}, {"Scene_ID": "afternoon_fukashichi", "Scene_Title": "妹背山婦女庭訓：鱶七使者の段 (Fukashichi Shisha no Dan)", "Line_No": 12, "Speaker": "鱶七 (Fukashichi)", "Japanese_Ruby": "「ハハハ！<ruby>甘露<rt>かんろ</rt></ruby>／＼！<ruby>腹<rt>はら</rt></ruby>の<ruby>薬<rt>くすり</rt></ruby>にちやうどよいわい！サア<ruby>玄蕃<rt>げんば</rt></ruby><ruby>殿<rt>どの</rt></ruby>、<ruby>次<rt>つぎ</rt></ruby>は<ruby>入鹿<rt>いるか</rt></ruby><ruby>公<rt>こう</rt></ruby>の<ruby>首<rt>くび</rt></ruby>でも<ruby>肴<rt>さかな</rt></ruby>にして<ruby>飲ま<rt>のま</rt></ruby>うかい！」", "Japanese_Plain": "「ハハハ！甘露／＼！腹の薬にちやうどよいわい！サア玄蕃殿、次は入鹿公の首でも肴にして飲まうかい！」", "English": "'Bwahaha! Sweet nectar indeed! A splendid digestive medicine for my stomach! Now then, Brother Genba, shall we drink our next cup with Iruka's severed head as a drinking snack?!'", "Notes": "Audacious defiance terrifying the tyrant's court."}, {"Scene_ID": "afternoon_fukashichi", "Scene_Title": "妹背山婦女庭訓：鱶七使者の段 (Fukashichi Shisha no Dan)", "Line_No": 13, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "その<ruby>剛胆<rt>ごうたん</rt></ruby><ruby>無双<rt>むそう</rt></ruby>の<ruby>気迫<rt>きはく</rt></ruby>に<ruby>呑ま<rt>のま</rt></ruby>れ、<ruby>腰<rt>こし</rt></ruby>を<ruby>抜か<rt>ぬか</rt></ruby>して<ruby>震へ<rt>ふるへ</rt></ruby><ruby>上が<rt>あが</rt></ruby>る<ruby>侍<rt>さむらい</rt></ruby>どもを<ruby>後に<rt>のちに</rt></ruby>、<ruby>鱶七<rt>ふかしち</rt></ruby>は<ruby>悠々<rt>ゆうゆう</rt></ruby>と<ruby>奥殿<rt>おくでん</rt></ruby>へと<ruby>歩み<rt>あゆみ</rt></ruby><ruby>入る<rt>いる</rt></ruby>。", "Japanese_Plain": "その剛胆無双の気迫に呑まれ、腰を抜かして震へ上がる侍どもを後に、鱶七は悠々と奥殿へと歩み入る。", "English": "Overwhelmed by his peerless bravery and commanding aura, the samurai retainers collapse trembling in sheer terror, as Fukashichi strides leisurely into the inner palace.", "Notes": "Closing of Fukashichi Shisha no Dan, setting the stage for the dramatic finale in the Golden Pavilion."}, {"Scene_ID": "afternoon_kinden", "Scene_Title": "妹背山婦女庭訓：金殿の段 (Kinden no Dan)", "Line_No": 1, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>紅<rt>くれない</rt></ruby>の<ruby>糸筋<rt>いとすじ</rt></ruby>をたどりて、<ruby>三笠山<rt>みかさやま</rt></ruby>の<ruby>奥深く<rt>おくふかく</rt></ruby>、<ruby>黄金<rt>おうごん</rt></ruby><ruby>輝く<rt>かがやく</rt></ruby><ruby>王<rt>おう</rt></ruby><ruby>殿<rt>どの</rt></ruby>の<ruby>門前<rt>もんぜん</rt></ruby>に<ruby>辿り<rt>たどり</rt></ruby><ruby>着き<rt>つき</rt></ruby>たる<ruby>お三輪<rt>おみわ</rt></ruby>。<ruby>息<rt>いき</rt></ruby>せき<ruby>切つ<rt>きつ</rt></ruby>て<ruby>奥<rt>おく</rt></ruby>を<ruby>窺<rt>き</rt></ruby>ふ。", "Japanese_Plain": "紅の糸筋をたどりて、三笠山の奥深く、黄金輝く王殿の門前に辿り着きたるお三輪。息せき切つて奥を窺ふ。", "English": "Following the trail of crimson thread deep into the heart of Mount Mikasa, Omiwa arrives before the gates of the glittering Golden Pavilion. Gasping for breath, she peers into the palace depths.", "Notes": "Opening of Kinden no Dan (The Golden Pavilion), the tragic climax of Act IV."}, {"Scene_ID": "afternoon_kinden", "Scene_Title": "妹背山婦女庭訓：金殿の段 (Kinden no Dan)", "Line_No": 2, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>宮中<rt>きゅうちゅう</rt></ruby>の<ruby>官女<rt>かんじょ</rt></ruby>たち、<ruby>華や<rt>はなや</rt></ruby>かなる<ruby>衣<rt>ころも</rt></ruby><ruby>擦れ<rt>すれ</rt></ruby>の<ruby>音<rt>おと</rt></ruby>とともに<ruby>現れ<rt>あらわれ</rt></ruby><ruby>出で<rt>いで</rt></ruby>て、<ruby>鄙び<rt>ひなび</rt></ruby>たる<ruby>町娘<rt>まちむすめ</rt></ruby>を<ruby>見咎め<rt>みとがめ</rt></ruby>、「ヤアこれ、いづくの<ruby>賤しき<rt>いやしき</rt></ruby><ruby>女<rt>おんな</rt></ruby>が<ruby>禁裏<rt>きんり</rt></ruby>の<ruby>御殿<rt>ごてん</rt></ruby>に<ruby>忍び<rt>しのび</rt></ruby><ruby>入り<rt>いり</rt></ruby>たるぞ！」と<ruby>取り<rt>とり</rt></ruby><ruby>囲む<rt>かこむ</rt></ruby>。", "Japanese_Plain": "宮中の官女たち、華やかなる衣擦れの音とともに現れ出でて、鄙びたる町娘を見咎め、「ヤアこれ、いづくの賤しき女が禁裏の御殿に忍び入りたるぞ！」と取り囲む。", "English": "Palace court maidens appear amid the rustle of splendid silks. Spotting the rustic town girl, they encircle her in scorn: 'Halt there! What lowly peasant wench dares trespass into the imperial sanctum?!'", "Notes": "The haughty court ladies (kanjo) confront Omiwa."}, {"Scene_ID": "afternoon_kinden", "Scene_Title": "妹背山婦女庭訓：金殿の段 (Kinden no Dan)", "Line_No": 3, "Speaker": "お三輪 (Omiwa)", "Japanese_Ruby": "「<ruby>申し<rt>もうし</rt></ruby><ruby>皆様<rt>みなさま</rt></ruby>、<ruby>私<rt>わたし</rt></ruby>は<ruby>三輪<rt>みわ</rt></ruby>の<ruby>里<rt>さと</rt></ruby>の<ruby>酒屋<rt>さかや</rt></ruby>の<ruby>娘<rt>むすめ</rt></ruby>。この<ruby>赤き<rt>あかき</rt></ruby><ruby>糸<rt>いと</rt></ruby>を<ruby>慕う<rt>したう</rt></ruby>て、<ruby>求馬<rt>もとめ</rt></ruby><ruby>様<rt>さま</rt></ruby>といふお<ruby>方<rt>ほう</rt></ruby>に<ruby>逢<rt>ほう</rt></ruby>ひたさに<ruby>参り<rt>まいり</rt></ruby>ました。どうか<ruby>一度<rt>いちど</rt></ruby>、ただ<ruby>一度<rt>いちど</rt></ruby><ruby>逢<rt>ほう</rt></ruby>はせて<ruby>下さ<rt>くださ</rt></ruby>んせ！」", "Japanese_Plain": "「申し皆様、私は三輪の里の酒屋の娘。この赤き糸を慕うて、求馬様といふお方に逢ひたさに参りました。どうか一度、ただ一度逢はせて下さんせ！」", "English": "'Noble ladies, I beg you to hear me! I am the daughter of the sake shop in Miwa. Following this crimson thread, I have come only longing to see Master Motome. Please, I beseech you, grant me just one glimpse of him!'", "Notes": "Omiwa's humble, desperate plea."}, {"Scene_ID": "afternoon_kinden", "Scene_Title": "妹背山婦女庭訓：金殿の段 (Kinden no Dan)", "Line_No": 4, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>官女<rt>かんじょ</rt></ruby>らは<ruby>嘲笑<rt>ちょうしょう</rt></ruby>ひ、「<ruby>求馬<rt>もとめ</rt></ruby>とは<ruby>何者<rt>なにもの</rt></ruby>ぞ。かかる<ruby>汚ら<rt>よごら</rt></ruby>はしき<ruby>町娘<rt>まちむすめ</rt></ruby>、ただでは<ruby>通さ<rt>とうさ</rt></ruby>じ」と、<ruby>額<rt>ひたい</rt></ruby>に<ruby>墨<rt>すみ</rt></ruby>を<ruby>塗り<rt>ぬり</rt></ruby>、<ruby>烏帽子<rt>えぼし</rt></ruby>を<ruby>被せ<rt>かぶせ</rt></ruby>、<ruby>嬲り<rt>なぶり</rt></ruby><ruby>者<rt>もの</rt></ruby>にして<ruby>足蹴<rt>あしげ</rt></ruby>にす。", "Japanese_Plain": "官女らは嘲笑ひ、「求馬とは何者ぞ。かかる汚らはしき町娘、ただでは通さじ」と、額に墨を塗り、烏帽子を被せ、嬲り者にして足蹴にす。", "English": "The court maidens burst into derisive laughter: 'Who is this Motome? Such a filthy peasant shall not pass unpunished!' Smearing black soot across her forehead and forcing a fool's cap upon her head, they torment and kick her without mercy.", "Notes": "The famous cruel hazing of Omiwa (官女のいじめ), designed to evoke audience sympathy."}, {"Scene_ID": "afternoon_kinden", "Scene_Title": "妹背山婦女庭訓：金殿の段 (Kinden no Dan)", "Line_No": 5, "Speaker": "お三輪 (Omiwa)", "Japanese_Ruby": "「いかなる<ruby>恥<rt>はじ</rt></ruby>をも<ruby>耐へ<rt>たへ</rt></ruby><ruby>忍び<rt>しのび</rt></ruby>ます。<ruby>求馬<rt>もとめ</rt></ruby><ruby>様<rt>さま</rt></ruby>、<ruby>求馬<rt>もとめ</rt></ruby><ruby>様<rt>さま</rt></ruby>さへ<ruby>無事<rt>ぶじ</rt></ruby>でおいでなさるなら……」と、<ruby>涙<rt>なみだ</rt></ruby>に<ruby>塗れ<rt>ぬれ</rt></ruby>つゝ<ruby>耐へ<rt>たへ</rt></ruby><ruby>難き<rt>がたき</rt></ruby><ruby>辱<rt>じょく</rt></ruby>めに<ruby>身を<rt>みを</rt></ruby><ruby>屈む<rt>かがむ</rt></ruby>。", "Japanese_Plain": "「いかなる恥をも耐へ忍びます。求馬様、求馬様さへ無事でおいでなさるなら……」と、涙に塗れつゝ耐へ難き辱めに身を屈む。", "English": "'I will endure any shame, any torment—so long as my Motome is safe and well...' weeping bitter tears as she bows her body beneath their cruel abuse.", "Notes": "Omiwa's selfless endurance of humiliation for the sake of love."}, {"Scene_ID": "afternoon_kinden", "Scene_Title": "妹背山婦女庭訓：金殿の段 (Kinden no Dan)", "Line_No": 6, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>折<rt>おり</rt></ruby>から<ruby>奥殿<rt>おくでん</rt></ruby>より、<ruby>雅や<rt>みやびや</rt></ruby>かなる<ruby>笛<rt>ふえ</rt></ruby><ruby>太鼓<rt>たいこ</rt></ruby>、<ruby>高砂<rt>たかさご</rt></ruby>の<ruby>祝言<rt>しゅうげん</rt></ruby>の<ruby>調べ<rt>しらべ</rt></ruby>、<ruby>賑々しく<rt>にぎにぎしく</rt></ruby><ruby>響き<rt>ひびき</rt></ruby><ruby>渡る<rt>わたる</rt></ruby>。", "Japanese_Plain": "折から奥殿より、雅やかなる笛太鼓、高砂の祝言の調べ、賑々しく響き渡る。", "English": "Just at that moment, from the inner sanctum of the palace, the elegant music of flutes and drums begins to play—the joyful, sacred melody of a grand wedding celebration echoing through the halls.", "Notes": "The wedding music of Takasago heralds Motome's nuptials to Princess Tachibana."}, {"Scene_ID": "afternoon_kinden", "Scene_Title": "妹背山婦女庭訓：金殿の段 (Kinden no Dan)", "Line_No": 7, "Speaker": "官女 (Court Maiden)", "Japanese_Ruby": "「ホホホ、これ<ruby>田舎娘<rt>いなかむすめ</rt></ruby>、<ruby>聞こ<rt>きこ</rt></ruby>えるか！<ruby>奥殿<rt>おくでん</rt></ruby>にては<ruby>我が<rt>わが</rt></ruby><ruby>君<rt>くん</rt></ruby>の<ruby>妹<rt>いもうと</rt></ruby><ruby>君<rt>くん</rt></ruby>・<ruby>橘姫<rt>たちばなひめ</rt></ruby><ruby>様<rt>さま</rt></ruby>と、<ruby>求馬<rt>もとめ</rt></ruby><ruby>様<rt>さま</rt></ruby>とのめでたき<ruby>祝言<rt>しゅうげん</rt></ruby>の<ruby>盃<rt>はい</rt></ruby>が<ruby>交わ<rt>まじわ</rt></ruby>されておるのぢゃ！お<ruby>前<rt>まえ</rt></ruby>のやうな<ruby>賤<rt>せん</rt></ruby><ruby>女<rt>おんな</rt></ruby>など、<ruby>端<rt>はじ</rt></ruby>から<ruby>相手<rt>あいて</rt></ruby>にされてはおらぬわい！」", "Japanese_Plain": "「ホホホ、これ田舎娘、聞こえるか！奥殿にては我が君の妹君・橘姫様と、求馬様とのめでたき祝言の盃が交わされておるのぢゃ！お前のやうな賤女など、端から相手にされてはおらぬわい！」", "English": "'Hahaha! Listen well, country wench! Within the inner chambers, our lord's sister Princess Tachibana and your precious Motome are even now exchanging wedding cups of eternal union! A wretched thing like you was never more than a passing amusement!'", "Notes": "The shattering revelation that drives Omiwa mad."}, {"Scene_ID": "afternoon_kinden", "Scene_Title": "妹背山婦女庭訓：金殿の段 (Kinden no Dan)", "Line_No": 8, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "その<ruby>言葉<rt>ことば</rt></ruby>を<ruby>聞く<rt>きく</rt></ruby>より、<ruby>お三輪<rt>おみわ</rt></ruby>の<ruby>胸<rt>むね</rt></ruby>に<ruby>逆巻く<rt>さかまく</rt></ruby><ruby>嫉妬<rt>しっと</rt></ruby>の<ruby>毒気<rt>どくけ</rt></ruby>、<ruby>血潮<rt>ちしお</rt></ruby><ruby>沸き<rt>わき</rt></ruby><ruby>立ち<rt>たち</rt></ruby>、<ruby>結ひ<rt>ゆひ</rt></ruby>たる<ruby>黒髪<rt>くろかみ</rt></ruby>ハラリと<ruby>解け<rt>とけ</rt></ruby>、<ruby>目角<rt>めかど</rt></ruby><ruby>釣り<rt>つり</rt></ruby><ruby>上が<rt>あが</rt></ruby>りて<ruby>形相<rt>ぎょうそう</rt></ruby><ruby>一変<rt>いっぺん</rt></ruby>す。", "Japanese_Plain": "その言葉を聞くより、お三輪の胸に逆巻く嫉妬の毒気、血潮沸き立ち、結ひたる黒髪ハラリと解け、目角釣り上がりて形相一変す。", "English": "The moment those words strike her ears, venomous jealousy surges violently through Omiwa's chest; her blood boils, her tied black hair bursts undone falling wildly across her shoulders, her eyes flash with madness, and her gentle features twist into terrifying fury!", "Notes": "The iconic transformation into the spirit of jealousy (hannya-katsura / wild hair)."}, {"Scene_ID": "afternoon_kinden", "Scene_Title": "妹背山婦女庭訓：金殿の段 (Kinden no Dan)", "Line_No": 9, "Speaker": "お三輪 (Omiwa)", "Japanese_Ruby": "「ヤア<ruby>口惜し<rt>くちおし</rt></ruby>の<ruby>求馬<rt>もとめ</rt></ruby><ruby>様<rt>さま</rt></ruby>！<ruby>私<rt>わたし</rt></ruby>の<ruby>心<rt>こころ</rt></ruby>を<ruby>玩び<rt>もてあそび</rt></ruby>、あの<ruby>女<rt>おんな</rt></ruby>と<ruby>祝言<rt>しゅうげん</rt></ruby>を！<ruby>許さ<rt>ゆるさ</rt></ruby>ぬ、<ruby>決して<rt>けっして</rt></ruby><ruby>許さ<rt>ゆるさ</rt></ruby>ぬ！<ruby>奥殿<rt>おくでん</rt></ruby>へ<ruby>押し<rt>おし</rt></ruby><ruby>通り<rt>とうり</rt></ruby>、<ruby>二人<rt>ふたり</rt></ruby>を<ruby>八つ<rt>やつ</rt></ruby><ruby>裂き<rt>さき</rt></ruby>にせで<ruby>措<rt>そ</rt></ruby>くべきか！」", "Japanese_Plain": "「ヤア口惜しの求馬様！私の心を玩び、あの女と祝言を！許さぬ、決して許さぬ！奥殿へ押し通り、二人を八つ裂きにせで措くべきか！」", "English": "'Ah, bitter treachery, Master Motome! Toying with my devoted love only to wed that noble woman! I will never forgive you—never! I shall storm the inner chambers and tear the two of you to shreds with my bare hands!'", "Notes": "Omiwa's furious, tragic frenzy."}, {"Scene_ID": "afternoon_kinden", "Scene_Title": "妹背山婦女庭訓：金殿の段 (Kinden no Dan)", "Line_No": 10, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>狂乱<rt>きょうらん</rt></ruby>して<ruby>奥<rt>おく</rt></ruby>へと<ruby>駆け<rt>かけ</rt></ruby><ruby>入ら<rt>いら</rt></ruby>んとするところへ、<ruby>物陰<rt>ものかげ</rt></ruby>より<ruby>躍り<rt>おどり</rt></ruby><ruby>出で<rt>いで</rt></ruby>たる<ruby>鱶七<rt>ふかしち</rt></ruby>、<ruby>白刃<rt>はくじん</rt></ruby><ruby>一閃<rt>いっせん</rt></ruby>、<ruby>お三輪<rt>おみわ</rt></ruby>の<ruby>胸元<rt>むなもと</rt></ruby><ruby>深く<rt>ふかく</rt></ruby><ruby>深々<rt>しんしん</rt></ruby>と<ruby>刺し<rt>さし</rt></ruby><ruby>貫く<rt>つらぬく</rt></ruby>！", "Japanese_Plain": "狂乱して奥へと駆け入らんとするところへ、物陰より躍り出でたる鱶七、白刃一閃、お三輪の胸元深く深々と刺し貫く！", "English": "As she rushes in mad fury toward the inner palace, Fukashichi leaps forth from the shadows—a flash of cold steel, plunging a dagger deep into Omiwa's tender breast!", "Notes": "The shocking climax: Fukashichi strikes down the innocent heroine."}, {"Scene_ID": "afternoon_kinden", "Scene_Title": "妹背山婦女庭訓：金殿の段 (Kinden no Dan)", "Line_No": 11, "Speaker": "お三輪 (Omiwa)", "Japanese_Ruby": "「アヽア<ruby>情け<rt>なさけ</rt></ruby>なや……なぜ<ruby>私<rt>わたし</rt></ruby>を<ruby>殺す<rt>ころす</rt></ruby>……<ruby>求馬<rt>もとめ</rt></ruby><ruby>様<rt>さま</rt></ruby>……<ruby>逢<rt>ほう</rt></ruby>ひたかつた……」と<ruby>血煙<rt>ちけむり</rt></ruby>に<ruby>倒れ<rt>たおれ</rt></ruby><ruby>伏す<rt>ふす</rt></ruby>。", "Japanese_Plain": "「アヽ情けなや……なぜ私を殺す……求馬様……逢ひたかつた……」と血煙に倒れ伏す。", "English": "'Ah, merciless cruelty... why must you take my life?... Motome... my beloved... I only wanted to see you once more...' collapsing upon the floor amid a spray of crimson blood.", "Notes": "Omiwa's dying lament."}, {"Scene_ID": "afternoon_kinden", "Scene_Title": "妹背山婦女庭訓：金殿の段 (Kinden no Dan)", "Line_No": 12, "Speaker": "鱶七 (Fukashichi)", "Japanese_Ruby": "「これ<ruby>お三輪<rt>おみわ</rt></ruby>、<ruby>恨む<rt>うらむ</rt></ruby>なよ！<ruby>我が<rt>わが</rt></ruby><ruby>名<rt>めい</rt></ruby>は<ruby>金輪<rt>かなわ</rt></ruby><ruby>五郎<rt>ごろう</rt></ruby><ruby>今国<rt>いまくに</rt></ruby>、<ruby>鎌足<rt>かまたり</rt></ruby><ruby>公<rt>こう</rt></ruby>の<ruby>忠臣<rt>ちゅうしん</rt></ruby>ぢゃ！そして<ruby>其<rt>その</rt></ruby><ruby>方が<rt>ほうが</rt></ruby><ruby>恋<rt>こい</rt></ruby>ひ<ruby>慕ふ<rt>したふ</rt></ruby><ruby>求馬<rt>もとめ</rt></ruby><ruby>殿<rt>どの</rt></ruby>こそ、<ruby>天下<rt>てんか</rt></ruby>を<ruby>救ふ<rt>すくふ</rt></ruby><ruby>藤原<rt>ふじわら</rt></ruby><ruby>淡海<rt>たんかい</rt></ruby><ruby>公<rt>こう</rt></ruby>その<ruby>人<rt>にん</rt></ruby>ぢゃ！」", "Japanese_Plain": "「これお三輪、恨むなよ！我が名は金輪五郎今国、鎌足公の忠臣ぢゃ！そして其方が恋ひ慕ふ求馬殿こそ、天下を救ふ藤原淡海公その人ぢゃ！」", "English": "'Weep not, Omiwa, and hold no hatred! My true name is Kanawa Gorō Imakuni, loyal retainer of Lord Kamatari! And the Motome whom you adored with your whole soul is none other than Prince Fujiwara no Tankei, destiny's champion who shall liberate the realm!'", "Notes": "Fukashichi reveals his and Motome's true royal identities."}, {"Scene_ID": "afternoon_kinden", "Scene_Title": "妹背山婦女庭訓：金殿の段 (Kinden no Dan)", "Line_No": 13, "Speaker": "鱶七 (Fukashichi)", "Japanese_Ruby": "「<ruby>逆賊<rt>ぎゃくぞく</rt></ruby><ruby>入鹿<rt>いるか</rt></ruby>は<ruby>妖術<rt>ようじゅつ</rt></ruby>を<ruby>備へ<rt>そなへ</rt></ruby>、<ruby>並み<rt>なみ</rt></ruby>の<ruby>太刀<rt>たち</rt></ruby>では<ruby>首<rt>くび</rt></ruby>を<ruby>討て<rt>うて</rt></ruby>ぬ。<ruby>神代<rt>かみしろ</rt></ruby>の<ruby>秘儀<rt>ひぎ</rt></ruby>によれば、<ruby>黒鹿<rt>くろしか</rt></ruby>の<ruby>角<rt>かく</rt></ruby>の<ruby>笛<rt>ふえ</rt></ruby>と、<ruby>一途<rt>いちず</rt></ruby>に<ruby>恋<rt>こい</rt></ruby>ひ<ruby>焦が<rt>こが</rt></ruby>れし<ruby>女<rt>おんな</rt></ruby>の<ruby>嫉妬<rt>しっと</rt></ruby>の<ruby>生血<rt>いきち</rt></ruby>を<ruby>交へ<rt>かへ</rt></ruby>てこそ、<ruby>入鹿<rt>いるか</rt></ruby>の<ruby>魔力<rt>まりょく</rt></ruby>を<ruby>破る<rt>やぶる</rt></ruby><ruby>唯一<rt>ゆいいつ</rt></ruby>の<ruby>神薬<rt>しんやく</rt></ruby>となるのぢゃ！」", "Japanese_Plain": "「逆賊入鹿は妖術を備へ、並みの太刀では首を討てぬ。神代の秘儀によれば、黒鹿の角の笛と、一途に恋ひ焦がれし女の嫉妬の生血を交へてこそ、入鹿の魔力を破る唯一の神薬となるのぢゃ！」", "English": "'The rebel tyrant Iruka possesses supernatural demonic protection that no ordinary blade can pierce. By ancient oracle, only when a flute carved from the horn of a sacred black deer is washed in the living blood of a maiden consumed by innocent jealousy, can the tyrant's demonic armor be destroyed!'", "Notes": "Explaining the esoteric prophecy: Omiwa's sacrifice is the sacred key to vanquishing the tyrant."}, {"Scene_ID": "afternoon_kinden", "Scene_Title": "妹背山婦女庭訓：金殿の段 (Kinden no Dan)", "Line_No": 14, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "その<ruby>言葉<rt>ことば</rt></ruby>を<ruby>聞く<rt>きく</rt></ruby>や、<ruby>お三輪<rt>おみわ</rt></ruby>の<ruby>顔<rt>かお</rt></ruby>に<ruby>浮か<rt>うか</rt></ruby>ぶ<ruby>喜色<rt>きしょく</rt></ruby>、<ruby>恨み<rt>うらみ</rt></ruby>の<ruby>心は<rt>こころは</rt></ruby><ruby>忽<rt>こつ</rt></ruby>ちに<ruby>消え<rt>きえ</rt></ruby><ruby>失せ<rt>うせ</rt></ruby>、<ruby>愛し<rt>いとし</rt></ruby>き<ruby>人<rt>にん</rt></ruby>の<ruby>大望<rt>たいぼう</rt></ruby>を<ruby>救ふ<rt>すくふ</rt></ruby><ruby>礎<rt>いしずえ</rt></ruby>となりしを<ruby>悦び<rt>よろこび</rt></ruby>、<ruby>両手<rt>りょうて</rt></ruby>を<ruby>合は<rt>あは</rt></ruby>せて<ruby>拝み<rt>おがみ</rt></ruby><ruby>奉る<rt>まつる</rt></ruby>。", "Japanese_Plain": "その言葉を聞くや、お三輪の顔に浮かぶ喜色、恨みの心は忽ちに消え失せ、愛しき人の大望を救ふ礎となりしを悦び、両手を合はせて拝み奉る。", "English": "Hearing those words, an expression of celestial joy dawns upon Omiwa's face. All bitterness vanishes in an instant; knowing that her life's blood shall serve as the foundation for her beloved's glorious triumph, she presses her palms together in devout prayer.", "Notes": "Omiwa's spiritual redemption and transcendent love."}, {"Scene_ID": "afternoon_kinden", "Scene_Title": "妹背山婦女庭訓：金殿の段 (Kinden no Dan)", "Line_No": 15, "Speaker": "お三輪 (Omiwa)", "Japanese_Ruby": "「アヽア<ruby>嬉しい<rt>うれしい</rt></ruby>や……<ruby>私<rt>わたし</rt></ruby>の<ruby>命<rt>いのち</rt></ruby>が<ruby>求馬<rt>もとめ</rt></ruby><ruby>様の<rt>ようの</rt></ruby><ruby>御用<rt>ごよう</rt></ruby>に<ruby>立つ<rt>たつ</rt></ruby>なら、<ruby>惜し<rt>おし</rt></ruby>うはござりませぬ……<ruby>求馬<rt>もとめ</rt></ruby><ruby>様<rt>さま</rt></ruby>、<ruby>天下<rt>てんか</rt></ruby>をお<ruby>取り<rt>とり</rt></ruby><ruby>下さ<rt>くださ</rt></ruby>れ……」", "Japanese_Plain": "「アヽ嬉しいや……私の命が求馬様の御用に立つなら、惜しうはござりませぬ……求馬様、天下をお取り下され……」", "English": "'Ah, what boundless joy!... If my humble life can serve my beloved Motome, I have not a single regret in death... Motome, triumph and restore peace to the realm...'", "Notes": "Omiwa's final words, sealing her status as one of Bunraku's most beloved heroines."}, {"Scene_ID": "afternoon_kinden", "Scene_Title": "妹背山婦女庭訓：金殿の段 (Kinden no Dan)", "Line_No": 16, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>思ひ<rt>おもひ</rt></ruby>の<ruby>人<rt>にん</rt></ruby>の<ruby>面影<rt>おもかげ</rt></ruby>を<ruby>胸<rt>むね</rt></ruby>に<ruby>抱き<rt>だき</rt></ruby>、<ruby>静か<rt>しずか</rt></ruby>に<ruby>息<rt>いき</rt></ruby>を<ruby>引き取る<rt>ひきとる</rt></ruby><ruby>お三輪<rt>おみわ</rt></ruby>の<ruby>健気<rt>けなげ</rt></ruby>さ、<ruby>義理<rt>ぎり</rt></ruby>と<ruby>愛<rt>あい</rt></ruby>の<ruby>尊き<rt>とーとき</rt></ruby><ruby>犠牲<rt>ぎせい</rt></ruby>、<ruby>見る<rt>みる</rt></ruby><ruby>人<rt>にん</rt></ruby><ruby>涙<rt>なみだ</rt></ruby>に<ruby>暮れ<rt>くれ</rt></ruby>ぬはなかりける。", "Japanese_Plain": "思ひの人の面影を胸に抱き、静かに息を引き取るお三輪の健気さ、義理と愛の尊き犠牲、見る人涙に暮れぬはなかりける。", "English": "Cradling the vision of her beloved in her heart, Omiwa breathes her last with noble serenity. At the sublime sacrifice of her pure devotion and steadfast love, not a single soul in the theater can hold back their streaming tears.", "Notes": "Grand tragic finale of Imoseyama Onna Teikin Act IV."}];

    let activeScene = localStorage.getItem("bunraku_scene") || "morning_yaoya";
    let activeLineIndex = parseInt(localStorage.getItem("bunraku_line_" + activeScene)) || 0;
    let fontSizes = ["0.95rem", "1.05rem", "1.18rem"];
    let currentFontIdx = 0;

    const scriptListEl = document.getElementById("scriptList");
    const sceneSelectEl = document.getElementById("sceneSelect");
    const partBadgeEl = document.getElementById("partBadge");
    const rubyToggleEl = document.getElementById("rubyToggle");
    const fontToggleEl = document.getElementById("fontToggle");
    const themeToggleEl = document.getElementById("themeToggle");
    const prevBtnEl = document.getElementById("prevBtn");
    const nextBtnEl = document.getElementById("nextBtn");
    const followerCounterEl = document.getElementById("followerCounter");
    const progressStatusEl = document.getElementById("progressStatus");

    function getFilteredData() {
      return RAW_DATA.filter(item => item.Scene_ID === activeScene);
    }

    function renderScene() {
      const items = getFilteredData();
      sceneSelectEl.value = activeScene;

      // Update badge
      if (activeScene.startsWith("morning")) {
        partBadgeEl.textContent = "PART 1 MORNING";
      } else {
        partBadgeEl.textContent = "PART 2 AFTERNOON";
      }

      if (activeLineIndex >= items.length) {
        activeLineIndex = 0;
      }

      scriptListEl.innerHTML = "";

      items.forEach((item, idx) => {
        const row = document.createElement("div");
        row.className = "script-row" + (idx === activeLineIndex ? " active" : "");
        row.dataset.index = idx;

        const isNarrator = item.Speaker.includes("太夫") || item.Speaker.includes("Narrator");
        const speakerClass = isNarrator ? "narrator" : "character";

        let noteHtml = "";
        if (item.Notes && item.Notes.trim().length > 0) {
          noteHtml = `
            <div class="footnote-pill">
              <span class="note-icon">💡</span>
              <span><strong>Context:</strong> ${item.Notes}</span>
            </div>
          `;
        }

        row.innerHTML = `
          <div class="row-meta">
            <span class="speaker-badge ${speakerClass}">${item.Speaker}</span>
            <span class="line-number">#${item.Line_No}</span>
          </div>
          <div class="col-jp">
            ${item.Japanese_Ruby}
          </div>
          <div class="col-en">
            <div>${item.English}</div>
            ${noteHtml}
          </div>
        `;

        row.addEventListener("click", () => {
          setActiveLine(idx, true);
        });

        scriptListEl.appendChild(row);
      });

      updateFollowerStatus();
      scrollToActive(false);
    }

    function setActiveLine(idx, smooth = true) {
      const items = getFilteredData();
      if (idx < 0 || idx >= items.length) return;

      activeLineIndex = idx;
      localStorage.setItem("bunraku_line_" + activeScene, activeLineIndex);

      const rows = scriptListEl.querySelectorAll(".script-row");
      rows.forEach((r, i) => {
        r.classList.toggle("active", i === activeLineIndex);
      });

      updateFollowerStatus();
      scrollToActive(smooth);
    }

    function updateFollowerStatus() {
      const items = getFilteredData();
      const current = activeLineIndex + 1;
      const total = items.length;
      followerCounterEl.textContent = `${current} / ${total}`;
      progressStatusEl.textContent = `Scene Line ${current} of ${total}`;
    }

    function scrollToActive(smooth = true) {
      const activeEl = scriptListEl.querySelector(".script-row.active");
      if (activeEl) {
        activeEl.scrollIntoView({
          behavior: smooth ? "smooth" : "auto",
          block: "center"
        });
      }
    }

    // Keyboard Shortcuts for Theater Follower
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown" || (e.key === " " && !e.shiftKey)) {
        e.preventDefault();
        setActiveLine(activeLineIndex + 1);
      } else if (e.key === "ArrowUp" || (e.key === " " && e.shiftKey)) {
        e.preventDefault();
        setActiveLine(activeLineIndex - 1);
      }
    });

    // Control Handlers
    nextBtnEl.addEventListener("click", () => setActiveLine(activeLineIndex + 1));
    prevBtnEl.addEventListener("click", () => setActiveLine(activeLineIndex - 1));

    sceneSelectEl.addEventListener("change", (e) => {
      activeScene = e.target.value;
      localStorage.setItem("bunraku_scene", activeScene);
      activeLineIndex = parseInt(localStorage.getItem("bunraku_line_" + activeScene)) || 0;
      renderScene();
    });

    // Ruby Furigana Toggle
    rubyToggleEl.addEventListener("click", () => {
      document.body.classList.toggle("hide-ruby");
      const isHidden = document.body.classList.contains("hide-ruby");
      rubyToggleEl.classList.toggle("active", !isHidden);
      rubyToggleEl.innerHTML = isHidden ? "<span>振仮名</span> OFF" : "<span>振仮名</span> ON";
    });

    // Font Scale Toggle
    fontToggleEl.addEventListener("click", () => {
      currentFontIdx = (currentFontIdx + 1) % fontSizes.length;
      document.documentElement.style.setProperty("--font-scale", fontSizes[currentFontIdx]);
      fontToggleEl.innerHTML = `<span>A+</span> ${currentFontIdx + 1}`;
    });

    // Theme Toggle
    themeToggleEl.addEventListener("click", () => {
      document.body.classList.toggle("light-mode");
      const isLight = document.body.classList.contains("light-mode");
      themeToggleEl.innerHTML = isLight ? "<span>☀️</span>" : "<span>🌙</span>";
      document.getElementById("theaterModeLabel").textContent = isLight 
        ? "Day Mode: Standard Contrast" 
        : "Theater Mode: Dim / Anti-Glare Active";
    });

    // Initial render
    renderScene();
  </script>
</body>
