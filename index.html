<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>文楽 同伴リーダー | Bunraku Bilingual Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+JP:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d11;
      --bg-surface: #13171f;
      --bg-active: rgba(212, 175, 55, 0.12);
      --border: #232a38;
      --border-active: #d4af37;
      --text-main: #e2e8f0;
      --text-muted: #8e9bb0;
      --text-japanese: #f8fafc;
      --text-english: #cbd5e1;
      --accent: #d4af37;
      --accent-glow: rgba(212, 175, 55, 0.35);
      --badge-narrator-bg: rgba(99, 102, 241, 0.2);
      --badge-narrator-text: #a5b4fc;
      --badge-character-bg: rgba(245, 158, 11, 0.2);
      --badge-character-text: #fcd34d;
      --badge-stage-bg: rgba(14, 165, 233, 0.18);
      --badge-stage-text: #7dd3fc;
      --note-bg: rgba(16, 185, 129, 0.15);
      --note-text: #6ee7b7;
      --font-scale: 1rem;
      --ruby-display: block;
    }

    body.light-mode {
      --bg: #f8fafc;
      --bg-surface: #ffffff;
      --bg-active: rgba(180, 83, 9, 0.1);
      --border: #e2e8f0;
      --border-active: #b45309;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --text-japanese: #0f172a;
      --text-english: #334155;
      --accent: #b45309;
      --accent-glow: rgba(180, 83, 9, 0.25);
      --badge-narrator-bg: #e0e7ff;
      --badge-narrator-text: #3730a3;
      --badge-character-bg: #fef3c7;
      --badge-character-text: #92400e;
      --badge-stage-bg: #e0f2fe;
      --badge-stage-text: #0369a1;
      --note-bg: #ecfdf5;
      --note-text: #065f46;
    }

    body.hide-ruby rt {
      display: none !important;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: "Plus Jakarta Sans", sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header & Navigation Bar */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      padding: 0.65rem 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .brand-logo {
      font-family: "Cinzel", serif;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.05em;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .badge-performance {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      background: rgba(212, 175, 55, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    select.scene-select {
      background: var(--bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.45rem 0.75rem;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }
    select.scene-select:focus {
      border-color: var(--accent);
    }

    .btn-toggle {
      background: var(--bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.45rem 0.65rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s;
    }
    .btn-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn-toggle.active {
      background: var(--accent);
      color: #0b0d11;
      border-color: var(--accent);
    }

    /* Theater Status & Quick Help Banner */
    .theater-banner {
      background: linear-gradient(90deg, #171c26 0%, #1e2533 100%);
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .theater-banner .indicator {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: #10b981;
    }
    .theater-banner .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    /* Main Dual-Column Container */
    main {
      flex: 1;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      padding: 1.25rem 1rem 6rem;
    }

    .column-header-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      padding-bottom: 0.75rem;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .script-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    /* Individual Bilingual Row */
    .script-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      padding: 1rem 1.15rem;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
    }

    .script-row:hover {
      border-color: rgba(212, 175, 55, 0.4);
      background: rgba(19, 23, 31, 0.9);
    }

    .script-row.active {
      border-color: var(--border-active);
      background: var(--bg-active);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .script-row.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--accent);
      border-top-left-radius: 8px;
      border-bottom-left-radius: 8px;
    }

    /* Metadata & Speaker Badges */
    .row-meta {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.35rem;
      font-size: 0.75rem;
    }

    .speaker-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.02em;
    }
    .speaker-badge.narrator {
      background: var(--badge-narrator-bg);
      color: var(--badge-narrator-text);
      border-left: 2px solid #818cf8;
    }
    .speaker-badge.character {
      background: var(--badge-character-bg);
      color: var(--badge-character-text);
      border-left: 2px solid #f59e0b;
    }
    .speaker-badge.stage {
      background: var(--badge-stage-bg);
      color: var(--badge-stage-text);
      border-left: 2px solid #38bdf8;
    }

    .line-number {
      color: var(--text-muted);
      font-family: monospace;
      font-size: 0.75rem;
    }

    /* Japanese Content Column */
    .col-jp {
      font-family: "Noto Serif JP", serif;
      font-size: calc(var(--font-scale) * 1.12);
      line-height: 2.1;
      color: var(--text-japanese);
      letter-spacing: 0.04em;
    }

    ruby {
      ruby-position: over;
    }

    rt {
      font-size: 0.58em;
      color: var(--accent);
      font-weight: 400;
      font-family: "Noto Serif JP", serif;
      letter-spacing: 0;
      transform: translateY(-0.1em);
    }

    /* English Content Column */
    .col-en {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: var(--font-scale);
      line-height: 1.7;
      color: var(--text-english);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Footnotes & Cultural Badges */
    .footnote-pill {
      margin-top: 0.65rem;
      display: inline-flex;
      align-items: flex-start;
      gap: 0.4rem;
      font-size: 0.78rem;
      background: var(--note-bg);
      color: var(--note-text);
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      border: 1px solid rgba(16, 185, 129, 0.25);
      line-height: 1.45;
    }
    .footnote-pill .note-icon {
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    /* Floating Navigation Controls for Theater One-Handed Use */
    .floating-follower {
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(19, 23, 31, 0.95);
      border: 1px solid var(--accent);
      padding: 0.45rem 0.65rem;
      border-radius: 999px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.7);
      backdrop-filter: blur(16px);
    }

    .follower-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s;
    }
    .follower-btn:hover {
      background: var(--accent);
      color: #0b0d11;
    }

    .follower-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      padding: 0 0.4rem;
      min-width: 65px;
      text-align: center;
      user-select: none;
    }

    /* Responsive Mobile Mode */
    @media (max-width: 768px) {
      .column-header-grid {
        display: none;
      }
      .script-row {
        grid-template-columns: 1fr;
        gap: 0.85rem;
        padding: 0.85rem 1rem;
      }
      .col-jp {
        border-bottom: 1px dashed var(--border);
        padding-bottom: 0.65rem;
      }
      .floating-follower {
        bottom: 1rem;
        right: 1rem;
      }
    }

    /* English Audio Narration Styles */
    .btn-toggle.audio-active {
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .follower-btn.play-btn {
      color: var(--accent);
      font-size: 1.05rem;
    }
    .follower-btn.play-btn.playing {
      background: var(--accent);
      color: #0b0d11;
      box-shadow: 0 0 14px var(--accent-glow);
    }
    .col-en-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.35rem;
    }
    .line-audio-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.2s ease;
      opacity: 0.75;
    }
    .script-row:hover .line-audio-btn,
    .script-row.active .line-audio-btn {
      opacity: 1;
      border-color: var(--border);
      background: rgba(255, 255, 255, 0.04);
    }
    .line-audio-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(212, 175, 55, 0.12);
    }
    .script-row.speaking {
      border-color: #38bdf8 !important;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.35) !important;
    }
    .script-row.speaking .line-audio-btn {
      color: #38bdf8;
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      opacity: 1;
      animation: audioPulse 1.4s infinite ease-in-out;
    }
    @keyframes audioPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.12); opacity: 0.85; }
    }
    .theater-etiquette-note {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
  </style>
</head>
<body>

  <!-- Top Navigation & Controls Header -->
  <header>
    <div class="brand-group">
      <div class="brand-logo" id="brandLogo">
        <span>文楽</span> BUNRAKU
      </div>
      <span class="badge-performance" id="partBadge">PART 1 MORNING</span>
    </div>

    <div class="controls-group">
      <!-- Performance / Date Selector -->
      <select id="performanceSelect" class="scene-select" title="Select Performance Date / Program">
      </select>

      <!-- Scene Selector -->
      <select id="sceneSelect" class="scene-select" title="Select Scene">
      </select>

      <!-- Furigana Toggle -->
      <button id="rubyToggle" class="btn-toggle active" title="Toggle Furigana Readings">
        <span>振仮名</span> ON
      </button>

      <!-- Font Size Toggle -->
      <button id="fontToggle" class="btn-toggle" title="Adjust text scale">
        <span>A+</span>
      </button>

      <!-- Light/Dark Toggle -->
      <button id="themeToggle" class="btn-toggle" title="Toggle AMOLED Dark / Light">
        <span>🌙</span>
      </button>

      <!-- English Audio Speed Toggle -->
      <button id="speedToggle" class="btn-toggle" title="English Reading Speed (0.8x, 1.0x, 1.2x)">
        <span>🔊</span> 1.0x
      </button>
    </div>
  </header>

  <!-- Theater Status Indicator -->
  <div class="theater-banner">
    <div class="indicator">
      <div class="dot"></div>
      <span id="theaterModeLabel">Theater Mode: Dim / Anti-Glare Active</span>
    </div>
    <div class="theater-etiquette-note" title="Please wear earphones when listening to audio in theater">
      <span>🎧</span> Earphones recommended
    </div>
    <div id="progressStatus">Line 1 of 15</div>
  </div>

  <!-- Main Dual-Column Content -->
  <main>
    <div class="column-header-grid">
      <div id="colJpHeader">日本語 (Jōruri Chanting & Dialogue)</div>
      <div>English Translation & Context</div>
    </div>

    <div class="script-list" id="scriptList">
      <!-- Rendered dynamically via JS -->
    </div>
  </main>

  <!-- Floating One-Handed Follower Controls -->
  <div class="floating-follower">
    <button class="follower-btn" id="prevBtn" title="Previous Line (↑ or Shift+Space)">▲</button>
    <button class="follower-btn play-btn" id="playPauseBtn" title="Play / Pause English Audio (P)">▶</button>
    <div class="follower-label" id="followerCounter">1 / 15</div>
    <button class="follower-btn" id="nextBtn" title="Next Line (↓ or Space)">▼</button>
  </div>

  <script src="data/performances.js"></script>
  <script>
    window.PERFORMANCE_DATA = window.PERFORMANCE_DATA || {};

    // State Management
    const performances = window.PERFORMANCES || [];
    let activePerformanceId = localStorage.getItem("bunraku_performance") || (performances[0] ? performances[0].id : "");
    if (!performances.find(p => p.id === activePerformanceId) && performances[0]) {
      activePerformanceId = performances[0].id;
    }

    let activeScene = "";
    let activeLineIndex = 0;
    const fontSizes = ["1rem", "1.15rem", "1.3rem", "0.88rem"];
    let currentFontIdx = 0;

    // Audio Companion State (Web Speech API)
    const synth = window.speechSynthesis;
    let isContinuousPlaying = false;
    let currentSpeakingIndex = -1;
    let pauseTimer = null;
    const speechSpeeds = [1.0, 1.2, 0.8];
    const speechSpeedLabels = ["1.0x", "1.2x", "0.8x"];
    let currentSpeedIdx = 0;
    let preferredVoice = null;

    // DOM Elements
    const brandLogoEl = document.getElementById("brandLogo");
    const colJpHeaderEl = document.getElementById("colJpHeader");
    const performanceSelectEl = document.getElementById("performanceSelect");
    const scriptListEl = document.getElementById("scriptList");
    const sceneSelectEl = document.getElementById("sceneSelect");
    const partBadgeEl = document.getElementById("partBadge");
    const followerCounterEl = document.getElementById("followerCounter");
    const progressStatusEl = document.getElementById("progressStatus");
    const rubyToggleEl = document.getElementById("rubyToggle");
    const fontToggleEl = document.getElementById("fontToggle");
    const themeToggleEl = document.getElementById("themeToggle");
    const speedToggleEl = document.getElementById("speedToggle");
    const playPauseBtnEl = document.getElementById("playPauseBtn");
    const prevBtnEl = document.getElementById("prevBtn");
    const nextBtnEl = document.getElementById("nextBtn");

    function getActivePerformance() {
      return performances.find(p => p.id === activePerformanceId) || performances[0];
    }

    function getAllScenesForPerformance(perf) {
      if (!perf || !perf.parts) return [];
      return perf.parts.flatMap(part => part.scenes.map(s => ({ ...s, partBadge: part.badge })));
    }

    function populatePerformanceSelect() {
      performanceSelectEl.innerHTML = "";
      performances.forEach(perf => {
        const opt = document.createElement("option");
        opt.value = perf.id;
        opt.textContent = perf.label;
        performanceSelectEl.appendChild(opt);
      });
      performanceSelectEl.value = activePerformanceId;
    }

    function populateSceneSelect() {
      const perf = getActivePerformance();
      sceneSelectEl.innerHTML = "";
      if (!perf) return;

      perf.parts.forEach(part => {
        const group = document.createElement("optgroup");
        group.label = part.label;
        part.scenes.forEach(scene => {
          const opt = document.createElement("option");
          opt.value = scene.id;
          opt.textContent = scene.title;
          group.appendChild(opt);
        });
        sceneSelectEl.appendChild(group);
      });

      const allScenes = getAllScenesForPerformance(perf);
      const savedScene = localStorage.getItem("bunraku_scene_" + perf.id);
      if (savedScene && allScenes.some(s => s.id === savedScene)) {
        activeScene = savedScene;
      } else if (allScenes.length > 0) {
        activeScene = allScenes[0].id;
      }
      sceneSelectEl.value = activeScene;
      activeLineIndex = parseInt(localStorage.getItem("bunraku_line_" + activeScene)) || 0;
    }

    function updateGenreBranding() {
      const perf = getActivePerformance();
      if (!perf) return;
      if (perf.genre === "kabuki") {
        brandLogoEl.innerHTML = "<span>歌舞伎</span> KABUKI";
        colJpHeaderEl.textContent = "日本語 (Dialogue & Gidayū / Nagauta)";
      } else {
        brandLogoEl.innerHTML = "<span>文楽</span> BUNRAKU";
        colJpHeaderEl.textContent = "日本語 (Jōruri Chanting & Dialogue)";
      }
    }

    function loadPerformanceData(perfId, callback) {
      if (window.PERFORMANCE_DATA[perfId]) {
        callback();
        return;
      }
      const perf = performances.find(p => p.id === perfId);
      if (!perf) return;
      scriptListEl.innerHTML = `<div style="padding:2rem;text-align:center;color:var(--text-muted);">Loading ${perf.label}...</div>`;
      const script = document.createElement("script");
      script.src = perf.dataFile;
      script.onload = () => callback();
      script.onerror = () => {
        scriptListEl.innerHTML = `<div style="padding:2rem;text-align:center;color:#ef4444;">Failed to load script data (${perf.dataFile}).</div>`;
      };
      document.body.appendChild(script);
    }

    function initVoices() {
      if (!synth) return;
      const voices = synth.getVoices();
      preferredVoice = voices.find(v => v.lang.startsWith("en") && (
        v.name.includes("Natural") || 
        v.name.includes("Google") || 
        v.name.includes("Premium") || 
        v.name.includes("Enhanced") || 
        v.name.includes("Samantha") || 
        v.name.includes("Daniel") || 
        v.name.includes("Arthur")
      )) ||
      voices.find(v => v.lang.startsWith("en-US") || v.lang.startsWith("en-GB")) ||
      voices.find(v => v.lang.startsWith("en")) ||
      null;
    }

    if (synth) {
      if (typeof synth.onvoiceschanged !== "undefined") {
        synth.onvoiceschanged = initVoices;
      }
      initVoices();
    }

    function cleanEnglishForSpeech(text) {
      if (!text) return "";
      return text.replace(/^['"“‘]+|['"”’]+$/g, "").replace(/\(.*?\)/g, "").trim();
    }

    function getFilteredData() {
      const data = window.PERFORMANCE_DATA[activePerformanceId] || [];
      return data.filter(item => item.Scene_ID === activeScene);
    }

    function updatePlayPauseButton() {
      if (!playPauseBtnEl) return;
      if (isContinuousPlaying) {
        playPauseBtnEl.textContent = "⏸";
        playPauseBtnEl.classList.add("playing");
        playPauseBtnEl.title = "Pause Narration (P)";
        if (speedToggleEl) speedToggleEl.classList.add("audio-active");
      } else {
        playPauseBtnEl.textContent = "▶";
        playPauseBtnEl.classList.remove("playing");
        playPauseBtnEl.title = "Play English Narration (P)";
        if (speedToggleEl) speedToggleEl.classList.remove("audio-active");
      }
    }

    function updateSpeakingRowStyles() {
      const rows = scriptListEl.querySelectorAll(".script-row");
      rows.forEach((r, i) => {
        const isSpeaking = (i === currentSpeakingIndex);
        r.classList.toggle("speaking", isSpeaking);
        const icon = r.querySelector(".line-audio-btn .audio-icon");
        if (icon) {
          icon.textContent = isSpeaking ? "🔊" : "🔈";
        }
      });
    }

    function stopAudio() {
      if (pauseTimer) {
        clearTimeout(pauseTimer);
        pauseTimer = null;
      }
      isContinuousPlaying = false;
      currentSpeakingIndex = -1;
      if (synth) {
        synth.cancel();
      }
      updatePlayPauseButton();
      updateSpeakingRowStyles();
    }

    function speakLine(idx, continuous = false) {
      if (!synth) {
        alert("Web Speech API is not supported in this browser.");
        return;
      }
      if (pauseTimer) {
        clearTimeout(pauseTimer);
        pauseTimer = null;
      }

      synth.cancel();

      const items = getFilteredData();
      if (idx < 0 || idx >= items.length) {
        stopAudio();
        return;
      }

      currentSpeakingIndex = idx;
      updateSpeakingRowStyles();

      const textToSpeak = cleanEnglishForSpeech(items[idx].English);
      if (!textToSpeak) {
        if (continuous) advanceNextContinuous(idx);
        return;
      }

      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      if (preferredVoice) utterance.voice = preferredVoice;
      utterance.rate = speechSpeeds[currentSpeedIdx];
      utterance.pitch = 1.0;
      utterance.lang = preferredVoice ? preferredVoice.lang : "en-US";

      utterance.onend = () => {
        currentSpeakingIndex = -1;
        updateSpeakingRowStyles();
        if (continuous && isContinuousPlaying) {
          advanceNextContinuous(idx);
        }
      };

      utterance.onerror = () => {
        currentSpeakingIndex = -1;
        updateSpeakingRowStyles();
        if (continuous && isContinuousPlaying) {
          advanceNextContinuous(idx);
        }
      };

      synth.speak(utterance);
    }

    function advanceNextContinuous(idx) {
      const items = getFilteredData();
      if (idx + 1 < items.length) {
        pauseTimer = setTimeout(() => {
          if (!isContinuousPlaying) return;
          setActiveLine(idx + 1, true);
          speakLine(idx + 1, true);
        }, 750);
      } else {
        stopAudio();
      }
    }

    function toggleContinuousPlay() {
      if (isContinuousPlaying) {
        stopAudio();
      } else {
        isContinuousPlaying = true;
        updatePlayPauseButton();
        speakLine(activeLineIndex, true);
      }
    }

    function handleLineAudioClick(idx) {
      if (currentSpeakingIndex === idx && (synth && synth.speaking)) {
        stopAudio();
        return;
      }
      stopAudio();
      setActiveLine(idx, true);
      speakLine(idx, false);
    }

    function getSpeakerClass(speaker) {
      if (!speaker) return "character";
      if (speaker.includes("太夫") || speaker.includes("Narrator") || speaker.includes("義太夫") || speaker.includes("長唄") || speaker.includes("清元")) {
        return "narrator";
      }
      if (speaker.includes("舞台") || speaker.includes("ト書き") || speaker.includes("下座") || speaker.includes("Stage") || speaker.includes("Music")) {
        return "stage";
      }
      return "character";
    }

    function renderScene() {
      const perf = getActivePerformance();
      const allScenes = getAllScenesForPerformance(perf);
      const sceneMeta = allScenes.find(s => s.id === activeScene);
      const items = getFilteredData();
      sceneSelectEl.value = activeScene;

      if (sceneMeta && sceneMeta.partBadge) {
        partBadgeEl.textContent = sceneMeta.partBadge;
      }

      if (activeLineIndex >= items.length) {
        activeLineIndex = 0;
      }

      scriptListEl.innerHTML = "";

      items.forEach((item, idx) => {
        const row = document.createElement("div");
        row.className = "script-row" + (idx === activeLineIndex ? " active" : "");
        row.dataset.index = idx;

        const speakerClass = getSpeakerClass(item.Speaker);

        let noteHtml = "";
        if (item.Notes && item.Notes.trim().length > 0) {
          noteHtml = `
            <div class="footnote-pill">
              <span class="note-icon">💡</span>
              <span><strong>Context:</strong> ${item.Notes}</span>
            </div>
          `;
        }

        row.innerHTML = `
          <div class="row-meta">
            <span class="speaker-badge ${speakerClass}">${item.Speaker}</span>
            <span class="line-number">#${item.Line_No}</span>
          </div>
          <div class="col-jp">
            ${item.Japanese_Ruby}
          </div>
          <div class="col-en">
            <div class="col-en-header">
              <span style="font-size:0.72rem; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:0.06em;">English Translation</span>
              <button class="line-audio-btn" data-index="${idx}" title="Listen to line in English">
                <span class="audio-icon">🔈</span> Read
              </button>
            </div>
            <div>${item.English}</div>
            ${noteHtml}
          </div>
        `;

        const audioBtn = row.querySelector(".line-audio-btn");
        audioBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          handleLineAudioClick(idx);
        });

        row.addEventListener("click", () => {
          setActiveLine(idx, true);
        });

        scriptListEl.appendChild(row);
      });

      updateFollowerStatus();
      updateSpeakingRowStyles();
      scrollToActive(false);
    }

    function setActiveLine(idx, smooth = true) {
      const items = getFilteredData();
      if (idx < 0 || idx >= items.length) return;

      activeLineIndex = idx;
      localStorage.setItem("bunraku_line_" + activeScene, activeLineIndex);

      const rows = scriptListEl.querySelectorAll(".script-row");
      rows.forEach((r, i) => {
        r.classList.toggle("active", i === activeLineIndex);
      });

      updateFollowerStatus();
      scrollToActive(smooth);
    }

    function updateFollowerStatus() {
      const items = getFilteredData();
      const current = items.length > 0 ? activeLineIndex + 1 : 0;
      const total = items.length;
      followerCounterEl.textContent = `${current} / ${total}`;
      progressStatusEl.textContent = `Scene Line ${current} of ${total}`;
    }

    function scrollToActive(smooth = true) {
      const activeEl = scriptListEl.querySelector(".script-row.active");
      if (activeEl) {
        activeEl.scrollIntoView({
          behavior: smooth ? "smooth" : "auto",
          block: "center"
        });
      }
    }

    // Keyboard Shortcuts for Theater Follower & Audio
    window.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA") return;
      if (e.key === "p" || e.key === "P" || e.key === "k" || e.key === "K") {
        e.preventDefault();
        toggleContinuousPlay();
      } else if (e.key === "ArrowDown" || (e.key === " " && !e.shiftKey)) {
        e.preventDefault();
        const nextIdx = activeLineIndex + 1;
        const items = getFilteredData();
        if (nextIdx < items.length) {
          setActiveLine(nextIdx);
          if (isContinuousPlaying) {
            speakLine(nextIdx, true);
          }
        }
      } else if (e.key === "ArrowUp" || (e.key === " " && e.shiftKey)) {
        e.preventDefault();
        const prevIdx = activeLineIndex - 1;
        if (prevIdx >= 0) {
          setActiveLine(prevIdx);
          if (isContinuousPlaying) {
            speakLine(prevIdx, true);
          }
        }
      }
    });

    // Control Handlers
    nextBtnEl.addEventListener("click", () => {
      const nextIdx = activeLineIndex + 1;
      const items = getFilteredData();
      if (nextIdx < items.length) {
        setActiveLine(nextIdx);
        if (isContinuousPlaying) {
          speakLine(nextIdx, true);
        }
      }
    });

    prevBtnEl.addEventListener("click", () => {
      const prevIdx = activeLineIndex - 1;
      if (prevIdx >= 0) {
        setActiveLine(prevIdx);
        if (isContinuousPlaying) {
          speakLine(prevIdx, true);
        }
      }
    });

    playPauseBtnEl.addEventListener("click", () => {
      toggleContinuousPlay();
    });

    speedToggleEl.addEventListener("click", () => {
      currentSpeedIdx = (currentSpeedIdx + 1) % speechSpeeds.length;
      speedToggleEl.innerHTML = `<span>🔊</span> ${speechSpeedLabels[currentSpeedIdx]}`;
      if (currentSpeakingIndex >= 0 && synth && synth.speaking) {
        speakLine(currentSpeakingIndex, isContinuousPlaying);
      }
    });

    performanceSelectEl.addEventListener("change", (e) => {
      stopAudio();
      activePerformanceId = e.target.value;
      localStorage.setItem("bunraku_performance", activePerformanceId);
      updateGenreBranding();
      populateSceneSelect();
      loadPerformanceData(activePerformanceId, () => {
        renderScene();
      });
    });

    sceneSelectEl.addEventListener("change", (e) => {
      stopAudio();
      activeScene = e.target.value;
      localStorage.setItem("bunraku_scene_" + activePerformanceId, activeScene);
      activeLineIndex = parseInt(localStorage.getItem("bunraku_line_" + activeScene)) || 0;
      renderScene();
    });

    // Ruby Furigana Toggle
    rubyToggleEl.addEventListener("click", () => {
      document.body.classList.toggle("hide-ruby");
      const isHidden = document.body.classList.contains("hide-ruby");
      rubyToggleEl.classList.toggle("active", !isHidden);
      rubyToggleEl.innerHTML = isHidden ? "<span>振仮名</span> OFF" : "<span>振仮名</span> ON";
    });

    // Font Scale Toggle
    fontToggleEl.addEventListener("click", () => {
      currentFontIdx = (currentFontIdx + 1) % fontSizes.length;
      document.documentElement.style.setProperty("--font-scale", fontSizes[currentFontIdx]);
      fontToggleEl.innerHTML = `<span>A+</span> ${currentFontIdx + 1}`;
    });

    // Theme Toggle
    themeToggleEl.addEventListener("click", () => {
      document.body.classList.toggle("light-mode");
      const isLight = document.body.classList.contains("light-mode");
      themeToggleEl.innerHTML = isLight ? "<span>☀️</span>" : "<span>🌙</span>";
      document.getElementById("theaterModeLabel").textContent = isLight 
        ? "Day Mode: Standard Contrast" 
        : "Theater Mode: Dim / Anti-Glare Active";
    });

    // Initial boot
    populatePerformanceSelect();
    updateGenreBranding();
    populateSceneSelect();
    loadPerformanceData(activePerformanceId, () => {
      renderScene();
    });
  </script>
</body>
</html>
