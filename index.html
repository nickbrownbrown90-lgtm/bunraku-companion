<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>文楽 同伴リーダー | Bunraku Bilingual Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+JP:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d11;
      --bg-surface: #13171f;
      --bg-active: rgba(212, 175, 55, 0.12);
      --border: #232a38;
      --border-active: #d4af37;
      --text-main: #e2e8f0;
      --text-muted: #8e9bb0;
      --text-japanese: #f8fafc;
      --text-english: #cbd5e1;
      --accent: #d4af37;
      --accent-glow: rgba(212, 175, 55, 0.35);
      --badge-narrator-bg: rgba(99, 102, 241, 0.2);
      --badge-narrator-text: #a5b4fc;
      --badge-character-bg: rgba(245, 158, 11, 0.2);
      --badge-character-text: #fcd34d;
      --note-bg: rgba(16, 185, 129, 0.15);
      --note-text: #6ee7b7;
      --font-scale: 1rem;
      --ruby-display: block;
    }

    body.light-mode {
      --bg: #f8fafc;
      --bg-surface: #ffffff;
      --bg-active: rgba(180, 83, 9, 0.1);
      --border: #e2e8f0;
      --border-active: #b45309;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --text-japanese: #0f172a;
      --text-english: #334155;
      --accent: #b45309;
      --accent-glow: rgba(180, 83, 9, 0.25);
      --badge-narrator-bg: #e0e7ff;
      --badge-narrator-text: #3730a3;
      --badge-character-bg: #fef3c7;
      --badge-character-text: #92400e;
      --note-bg: #ecfdf5;
      --note-text: #065f46;
    }

    body.hide-ruby rt {
      display: none !important;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: "Plus Jakarta Sans", sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header & Navigation Bar */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      padding: 0.65rem 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .brand-logo {
      font-family: "Cinzel", serif;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.05em;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .badge-performance {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      background: rgba(212, 175, 55, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    select.scene-select {
      background: var(--bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.45rem 0.75rem;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }
    select.scene-select:focus {
      border-color: var(--accent);
    }

    .btn-toggle {
      background: var(--bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.45rem 0.65rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s;
    }
    .btn-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn-toggle.active {
      background: var(--accent);
      color: #0b0d11;
      border-color: var(--accent);
    }

    /* Theater Status & Quick Help Banner */
    .theater-banner {
      background: linear-gradient(90deg, #171c26 0%, #1e2533 100%);
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .theater-banner .indicator {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: #10b981;
    }
    .theater-banner .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    /* Main Dual-Column Container */
    main {
      flex: 1;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      padding: 1.25rem 1rem 6rem;
    }

    .column-header-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      padding-bottom: 0.75rem;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .script-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    /* Individual Bilingual Row */
    .script-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      padding: 1rem 1.15rem;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
    }

    .script-row:hover {
      border-color: rgba(212, 175, 55, 0.4);
      background: rgba(19, 23, 31, 0.9);
    }

    .script-row.active {
      border-color: var(--border-active);
      background: var(--bg-active);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .script-row.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--accent);
      border-top-left-radius: 8px;
      border-bottom-left-radius: 8px;
    }

    /* Metadata & Speaker Badges */
    .row-meta {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.35rem;
      font-size: 0.75rem;
    }

    .speaker-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.02em;
    }
    .speaker-badge.narrator {
      background: var(--badge-narrator-bg);
      color: var(--badge-narrator-text);
      border-left: 2px solid #818cf8;
    }
    .speaker-badge.character {
      background: var(--badge-character-bg);
      color: var(--badge-character-text);
      border-left: 2px solid #f59e0b;
    }

    .line-number {
      color: var(--text-muted);
      font-family: monospace;
      font-size: 0.75rem;
    }

    /* Japanese Content Column */
    .col-jp {
      font-family: "Noto Serif JP", serif;
      font-size: calc(var(--font-scale) * 1.12);
      line-height: 2.1;
      color: var(--text-japanese);
      letter-spacing: 0.04em;
    }

    ruby {
      ruby-position: over;
    }

    rt {
      font-size: 0.58em;
      color: var(--accent);
      font-weight: 400;
      font-family: "Noto Serif JP", serif;
      letter-spacing: 0;
      transform: translateY(-0.1em);
    }

    /* English Content Column */
    .col-en {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: var(--font-scale);
      line-height: 1.7;
      color: var(--text-english);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Footnotes & Cultural Badges */
    .footnote-pill {
      margin-top: 0.65rem;
      display: inline-flex;
      align-items: flex-start;
      gap: 0.4rem;
      font-size: 0.78rem;
      background: var(--note-bg);
      color: var(--note-text);
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      border: 1px solid rgba(16, 185, 129, 0.25);
      line-height: 1.45;
    }
    .footnote-pill .note-icon {
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    /* Floating Navigation Controls for Theater One-Handed Use */
    .floating-follower {
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(19, 23, 31, 0.95);
      border: 1px solid var(--accent);
      padding: 0.45rem 0.65rem;
      border-radius: 999px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.7);
      backdrop-filter: blur(16px);
    }

    .follower-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s;
    }
    .follower-btn:hover {
      background: var(--accent);
      color: #0b0d11;
    }

    .follower-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      padding: 0 0.4rem;
      min-width: 65px;
      text-align: center;
      user-select: none;
    }

    /* Responsive Mobile Mode */
    @media (max-width: 768px) {
      .column-header-grid {
        display: none;
      }
      .script-row {
        grid-template-columns: 1fr;
        gap: 0.85rem;
        padding: 0.85rem 1rem;
      }
      .col-jp {
        border-bottom: 1px dashed var(--border);
        padding-bottom: 0.65rem;
      }
      .floating-follower {
        bottom: 1rem;
        right: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation & Controls Header -->
  <header>
    <div class="brand-group">
      <div class="brand-logo">
        <span>文楽</span> BUNRAKU
      </div>
      <span class="badge-performance" id="partBadge">PART 1 MORNING</span>
    </div>

    <div class="controls-group">
      <!-- Scene Selector -->
      <select id="sceneSelect" class="scene-select">
        <optgroup label="第1部 Morning (心中宵庚申)">
          <option value="morning_uedamura">上田村の段 (Ueda Village)</option>
          <option value="morning_yaoya">八百屋の段 (Greengrocer Shop)</option>
          <option value="morning_michiyuki">道行思ひの短夜 (Travel Passage)</option>
        </optgroup>
        <optgroup label="第2部 Afternoon (妹背山婦女庭訓)">
          <option value="afternoon_sugisakaya">杉酒屋の段 (Sugi Sake Shop)</option>
          <option value="afternoon_michiyuki">道行恋苧環 (Spool of Love)</option>
          <option value="afternoon_fukashichi">鱶七使者の段 (Fukashichi Envoy)</option>
          <option value="afternoon_kinden">金殿の段 (The Golden Pavilion)</option>
        </optgroup>
      </select>

      <!-- Furigana Toggle -->
      <button id="rubyToggle" class="btn-toggle active" title="Toggle Furigana Readings">
        <span>振仮名</span> ON
      </button>

      <!-- Font Size Toggle -->
      <button id="fontToggle" class="btn-toggle" title="Adjust text scale">
        <span>A+</span>
      </button>

      <!-- Light/Dark Toggle -->
      <button id="themeToggle" class="btn-toggle" title="Toggle AMOLED Dark / Light">
        <span>🌙</span>
      </button>
    </div>
  </header>

  <!-- Theater Status Indicator -->
  <div class="theater-banner">
    <div class="indicator">
      <div class="dot"></div>
      <span id="theaterModeLabel">Theater Mode: Dim / Anti-Glare Active</span>
    </div>
    <div id="progressStatus">Line 1 of 15</div>
  </div>

  <!-- Main Dual-Column Content -->
  <main>
    <div class="column-header-grid">
      <div>日本語 (Jōruri Chanting & Dialogue)</div>
      <div>English Translation & Context</div>
    </div>

    <div class="script-list" id="scriptList">
      <!-- Rendered dynamically via JS -->
    </div>
  </main>

  <!-- Floating One-Handed Follower Controls -->
  <div class="floating-follower">
    <button class="follower-btn" id="prevBtn" title="Previous Line (↑ or Shift+Space)">▲</button>
    <div class="follower-label" id="followerCounter">1 / 15</div>
    <button class="follower-btn" id="nextBtn" title="Next Line (↓ or Space)">▼</button>
  </div>

    const RAW_DATA = [{"Scene_ID": "morning_uedamura", "Scene_Title": "心中宵庚申：上田村の段 (Uedamura no Dan)", "Line_No": 1, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "『<ruby>五月雨<rt>さみだれ</rt></ruby>ほど<ruby>恋慕<rt>れんぼ</rt></ruby>はれて、<ruby>今<rt>いま</rt></ruby>は<ruby>秋田<rt>あきた</rt></ruby>の<ruby>落し<rt>おとし</rt></ruby><ruby>水<rt>みず</rt></ruby>。<ruby>軒<rt>けん</rt></ruby>の<ruby>玉水<rt>たまみず</rt></ruby>とくとくござれ、しげくござれば<ruby>名<rt>めい</rt></ruby>の<ruby>立つ<rt>たつ</rt></ruby>に』", "Japanese_Plain": "『五月雨ほど恋慕はれて、今は秋田の落し水。軒の玉水とくとくござれ、しげくござれば名の立つに』", "English": "'As longingly desired as the early summer rains, now draining away like runoff from autumn paddies. Come quickly, raindrops dripping from the eaves—for if you linger too often, rumor will surely spread.'", "Notes": "Opening lyrical song (kouta) drawing upon agricultural imagery of Yamashiro Province to set the rustic tone."}, {"Scene_ID": "morning_uedamura", "Scene_Title": "心中宵庚申：上田村の段 (Uedamura no Dan)", "Line_No": 2, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>玉水<rt>たまみず</rt></ruby><ruby>近き<rt>ちかき</rt></ruby><ruby>山城<rt>やましろ</rt></ruby>の、<ruby>村<rt>むら</rt></ruby>は<ruby>上田<rt>うえだ</rt></ruby>に<ruby>家<rt>いえ</rt></ruby><ruby>富み<rt>とみ</rt></ruby>て、<ruby>庄屋<rt>しょうや</rt></ruby>に<ruby>並ぶ<rt>ならぶ</rt></ruby><ruby>萱<rt>かや</rt></ruby><ruby>屋根<rt>やね</rt></ruby>も、<ruby>内温<rt>ないおん</rt></ruby>かに<ruby>下女<rt>しもおなご</rt></ruby><ruby>並ん<rt>ならん</rt></ruby>で<ruby>紡ぐ<rt>つむぐ</rt></ruby><ruby>綿<rt>めん</rt></ruby><ruby>車<rt>くるま</rt></ruby>。", "Japanese_Plain": "玉水近き山城の、村は上田に家富みて、庄屋に並ぶ萱屋根も、内温かに下女並んで紡ぐ綿車。", "English": "Near Tamamizu in Yamashiro Province, in the village of Ueda, stands a prosperous homestead. Its thatched roof rivaling that of the village headman, inside all is warm comfort, where maidservants sit side-by-side spinning at their cotton wheels.", "Notes": "Setting the scene at the affluent farmstead of Shimada Heiemon, Ochiyo's birth family."}, {"Scene_ID": "morning_uedamura", "Scene_Title": "心中宵庚申：上田村の段 (Uedamura no Dan)", "Line_No": 3, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>庭<rt>にわ</rt></ruby>に<ruby>五つ<rt>いつつ</rt></ruby>のたなつ<ruby>物<rt>もの</rt></ruby>、<ruby>積む<rt>つむ</rt></ruby><ruby>蓬莱<rt>ほうらい</rt></ruby>の<ruby>島田<rt>しまだ</rt></ruby><ruby>氏<rt>し</rt></ruby>、<ruby>平右衛門<rt>へいえもん</rt></ruby>といふ<ruby>大<rt>だい</rt></ruby><ruby>百姓<rt>ひゃくしょう</rt></ruby>、<ruby>妻<rt>つま</rt></ruby>は<ruby>去年<rt>きょねん</rt></ruby>の<ruby>秋霧<rt>あきぎり</rt></ruby>と<ruby>消え<rt>きえ</rt></ruby>ても<ruby>残る<rt>のこる</rt></ruby><ruby>娘<rt>むすめ</rt></ruby><ruby>二人<rt>ふたり</rt></ruby>。", "Japanese_Plain": "庭に五つのたなつ物、積む蓬莱の島田氏、平右衛門といふ大百姓、妻は去年の秋霧と消えても残る娘二人。", "English": "In the courtyard the five sacred grains are piled high like Mount Hōrai. The wealthy farmer Shimada Heiemon lost his wife like autumn mist the previous year, leaving behind two daughters.", "Notes": "Heiemon's daughters are Okaru (the elder) and Ochiyo (the younger)."}, {"Scene_ID": "morning_uedamura", "Scene_Title": "心中宵庚申：上田村の段 (Uedamura no Dan)", "Line_No": 4, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>総領<rt>そうりょう</rt></ruby>かるに<ruby>入婿<rt>いりむこ</rt></ruby>を<ruby>鳥飼<rt>とりかい</rt></ruby>より<ruby>呼び<rt>よび</rt></ruby><ruby>迎へ<rt>むかへ</rt></ruby>、<ruby>妹<rt>いもうと</rt></ruby><ruby>千代<rt>ちよ</rt></ruby>も<ruby>大坂<rt>おおさか</rt></ruby>にれつきとしたる<ruby>婿取<rt>むことり</rt></ruby>つて、<ruby>田畑<rt>たはた</rt></ruby>の<ruby>世話<rt>せわ</rt></ruby>を<ruby>焼き<rt>やき</rt></ruby><ruby>止め<rt>とめ</rt></ruby>ば、<ruby>万事<rt>ばんじ</rt></ruby><ruby>限り<rt>かぎり</rt></ruby>の<ruby>俄病<rt>にわかやまい</rt></ruby>。", "Japanese_Plain": "総領かるに入婿を鳥飼より呼び迎へ、妹千代も大坂にれつきとしたる婿取つて、田畑の世話を焼き止めば、万事限りの俄病。", "English": "For the elder, Okaru, an adopted husband was welcomed from Torigai; while the younger, Ochiyo, was wedded in Osaka to a respectable merchant husband. Having labored untiringly tending the fields, Heiemon was suddenly struck down by severe illness.", "Notes": "Heiemon's sudden illness triggers the daughters' return and brings the family together."}, {"Scene_ID": "morning_uedamura", "Scene_Title": "心中宵庚申：上田村の段 (Uedamura no Dan)", "Line_No": 5, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>姉<rt>あね</rt></ruby>の<ruby>おかる<rt>おかる</rt></ruby>は<ruby>傍<rt>ぼう</rt></ruby><ruby>離れ<rt>はなれ</rt></ruby>ず、<ruby>台所<rt>だいどころ</rt></ruby>には<ruby>女子<rt>じょし</rt></ruby>ども「なんと<ruby>今朝<rt>けさ</rt></ruby>から<ruby>仕事<rt>しごと</rt></ruby>の<ruby>捗<rt>ちょく</rt></ruby>も<ruby>行た<rt>いった</rt></ruby>ではないか。ちと<ruby>休ま<rt>やすま</rt></ruby>う。お<ruby>竹<rt>たけ</rt></ruby>、お<ruby>鍋<rt>なべ</rt></ruby>」と<ruby>呼び<rt>よび</rt></ruby><ruby>連れ<rt>つれ</rt></ruby>て<ruby>思ひ<rt>おもひ</rt></ruby><ruby>思ひ<rt>おもひ</rt></ruby>に<ruby>立<rt>りつ</rt></ruby><ruby>出づ<rt>いづ</rt></ruby>る。", "Japanese_Plain": "姉のおかるは傍離れず、台所には女子ども「なんと今朝から仕事の捗も行たではないか。ちと休まう。お竹、お鍋」と呼び連れて思ひ思ひに立出づる。", "English": "Elder sister Okaru stays constantly by her father's bedside, while in the kitchen the servant girls say, 'My, haven't we made great progress since this morning! Let's take a little rest, Otake, Onabe,' calling out as each steps outside.", "Notes": "Establishing the quiet domestic atmosphere before Hanbei's arrival."}, {"Scene_ID": "morning_uedamura", "Scene_Title": "心中宵庚申：上田村の段 (Uedamura no Dan)", "Line_No": 6, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>折<rt>おり</rt></ruby>から<ruby>門口<rt>かどぐち</rt></ruby>に<ruby>菅笠<rt>すげがさ</rt></ruby><ruby>脱ぎ<rt>ぬぎ</rt></ruby>て、「<ruby>頼み<rt>たのみ</rt></ruby><ruby>入る<rt>いる</rt></ruby>」と<ruby>内<rt>ない</rt></ruby>の<ruby>様子<rt>ようす</rt></ruby>を<ruby>窺<rt>き</rt></ruby>ふ。「ヤア<ruby>半兵衛<rt>はんべえ</rt></ruby><ruby>殿<rt>どの</rt></ruby>、<ruby>大坂<rt>おおさか</rt></ruby>から<ruby>急ぎ<rt>いそぎ</rt></ruby>の<ruby>飛脚<rt>ひきゃく</rt></ruby>、<ruby>親仁<rt>おやじ</rt></ruby><ruby>様の<rt>ようの</rt></ruby><ruby>俄<rt>が</rt></ruby><ruby>養生<rt>ようじょう</rt></ruby>、<ruby>早<rt>そう</rt></ruby><ruby>飛脚<rt>ひきゃく</rt></ruby>でお<ruby>知らせ<rt>しらせ</rt></ruby><ruby>申し<rt>もうし</rt></ruby>たれば、やがて<ruby>来て<rt>きて</rt></ruby><ruby>下さ<rt>くださ</rt></ruby>るであらうと、<ruby>首<rt>くび</rt></ruby>を<ruby>伸し<rt>のし</rt></ruby>て<ruby>待つ<rt>まつ</rt></ruby>て<ruby>居た<rt>いた</rt></ruby>」", "Japanese_Plain": "折から門口に菅笠脱ぎて、「頼み入る」と内の様子を窺ふ。「ヤア半兵衛殿、大坂から急ぎの飛脚、親仁様の俄養生、早飛脚でお知らせ申したれば、やがて来て下さるであらうと、首を伸して待つて居た」", "English": "Just then, at the gate, a man takes off his sedge woven hat: 'Pardon me!' peeking inside. 'Oh, Master Hanbei! When father fell ill, we sent an express runner to Osaka, and have been craning our necks waiting, trusting you would hurry here!'", "Notes": "Arrival of Hanbei, Ochiyo's devoted husband, who has hurried on foot from Osaka."}, {"Scene_ID": "morning_uedamura", "Scene_Title": "心中宵庚申：上田村の段 (Uedamura no Dan)", "Line_No": 7, "Speaker": "半兵衛 (Hanbei)", "Japanese_Ruby": "「<ruby>飛脚<rt>ひきゃく</rt></ruby>の<ruby>頼り<rt>たより</rt></ruby>を<ruby>聞く<rt>きく</rt></ruby>よりも、<ruby>気遣<rt>きづかい</rt></ruby>はしさに<ruby>馳せ<rt>はせ</rt></ruby><ruby>参じ<rt>さんじ</rt></ruby>た。<ruby>親父<rt>おやじ</rt></ruby><ruby>殿<rt>どの</rt></ruby>の<ruby>御<rt>お</rt></ruby><ruby>病気<rt>びょうき</rt></ruby>はその<ruby>後<rt>のち</rt></ruby>いかがでござる」", "Japanese_Plain": "「飛脚の頼りを聞くよりも、気遣はしさに馳せ参じた。親父殿の御病気はその後いかがでござる」", "English": "'The very moment I heard the messenger's words, overcome with worry, I raced here without pausing. How has father's condition fared since then?'", "Notes": "Hanbei demonstrates genuine filial respect and loyalty toward his father-in-law."}, {"Scene_ID": "morning_uedamura", "Scene_Title": "心中宵庚申：上田村の段 (Uedamura no Dan)", "Line_No": 8, "Speaker": "おかる (Okaru)", "Japanese_Ruby": "「<ruby>薬<rt>くすり</rt></ruby>の<ruby>功<rt>こう</rt></ruby>もあつて、ちと<ruby>心地<rt>ここち</rt></ruby>もよろしうござる。<ruby>千代<rt>ちよ</rt></ruby>も<ruby>心配<rt>しんぱい</rt></ruby>して<ruby>居ら<rt>いら</rt></ruby>うに、なぜ<ruby>連れ<rt>つれ</rt></ruby>てござらぬぞ」", "Japanese_Plain": "「薬の功もあつて、ちと心地もよろしうござる。千代も心配して居らうに、なぜ連れてござらぬぞ」", "English": "'Thanks to the medicine, he feels slightly better. But Ochiyo must have been so worried—why did you not bring her along with you?'", "Notes": "Okaru wonders why her younger sister Ochiyo did not accompany Hanbei."}, {"Scene_ID": "morning_uedamura", "Scene_Title": "心中宵庚申：上田村の段 (Uedamura no Dan)", "Line_No": 9, "Speaker": "半兵衛 (Hanbei)", "Japanese_Ruby": "「イヤ、<ruby>千代<rt>ちよ</rt></ruby>は……<ruby>千代<rt>ちよ</rt></ruby>は<ruby>内儀<rt>つま</rt></ruby>の<ruby>差し<rt>さし</rt></ruby><ruby>支へ<rt>かへ</rt></ruby>あつて、<ruby>共に<rt>ともに</rt></ruby><ruby>参る<rt>まいる</rt></ruby>こと<ruby>叶<rt>かのう</rt></ruby>はず、<ruby>私一人<rt>わたしひとり</rt></ruby><ruby>急ぎ<rt>いそぎ</rt></ruby><ruby>下つ<rt>くだつ</rt></ruby>た」", "Japanese_Plain": "「イヤ、千代は……千代は内儀の差し支へあつて、共に参ること叶はず、私一人急ぎ下つた」", "English": "'Well, Ochiyo... Ochiyo was detained by business for my mother, making it impossible for her to accompany me, so I hurried down alone.'", "Notes": "Hanbei covers up the painful truth: his cruel stepmother has already thrown Ochiyo out of the house."}, {"Scene_ID": "morning_uedamura", "Scene_Title": "心中宵庚申：上田村の段 (Uedamura no Dan)", "Line_No": 10, "Speaker": "平右衛門 (Heiemon)", "Japanese_Ruby": "「ヲヽヲ<ruby>半兵衛<rt>はんべえ</rt></ruby>か。<ruby>遠い<rt>とおい</rt></ruby><ruby>所<rt>ところ</rt></ruby>をよう<ruby>来て<rt>きて</rt></ruby>くれた。<ruby>千代<rt>ちよ</rt></ruby>はどうしたぞ。なぜ<ruby>顔<rt>かお</rt></ruby>を<ruby>見せ<rt>みせ</rt></ruby>ぬ」", "Japanese_Plain": "「ヲヽ半兵衛か。遠い所をよう来てくれた。千代はどうしたぞ。なぜ顔を見せぬ」", "English": "'Oh, is that Hanbei? Thank you for coming all this long way. But what of Ochiyo? Why does she not show her face to me?'", "Notes": "The ailing father longs to see his younger daughter Ochiyo."}, {"Scene_ID": "morning_uedamura", "Scene_Title": "心中宵庚申：上田村の段 (Uedamura no Dan)", "Line_No": 11, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>枕元<rt>まくらもと</rt></ruby>の<ruby>父<rt>ちち</rt></ruby>の<ruby>言葉<rt>ことば</rt></ruby>に<ruby>胸<rt>むね</rt></ruby><ruby>塞が<rt>ふさが</rt></ruby>り、<ruby>言<rt>げん</rt></ruby><ruby>出し<rt>だし</rt></ruby>かねて<ruby>俯<rt>ふ</rt></ruby><ruby>向く<rt>むく</rt></ruby><ruby>半兵衛<rt>はんべえ</rt></ruby>。<ruby>実は<rt>じつは</rt></ruby><ruby>姑<rt>しゅうとめ</rt></ruby>の<ruby>苛酷<rt>かこく</rt></ruby>に<ruby>耐へ<rt>たへ</rt></ruby>かね、<ruby>お千代<rt>おちよ</rt></ruby>はひと<ruby>足先<rt>あしさき</rt></ruby>にこの<ruby>在所<rt>ざいしょ</rt></ruby>へ<ruby>戻り<rt>もどり</rt></ruby><ruby>居り<rt>いり</rt></ruby>しを、<ruby>父<rt>ちち</rt></ruby>に<ruby>隠し<rt>かくし</rt></ruby>て<ruby>姉<rt>あね</rt></ruby>の<ruby>家<rt>いえ</rt></ruby>に<ruby>匿<rt>とく</rt></ruby>はれてありける。", "Japanese_Plain": "枕元の父の言葉に胸塞がり、言出しかねて俯向く半兵衛。実は姑の苛酷に耐へかね、お千代はひと足先にこの在所へ戻り居りしを、父に隠して姉の家に匿はれてありける。", "English": "At the father's bedside words, Hanbei's chest chokes up with tears; unable to speak, he looks down. In truth, unable to bear the stepmother's cruelty, Ochiyo had arrived in the village earlier, hidden away at her sister's house so as not to grieve her dying father.", "Notes": "The painful reality: Ochiyo is already hiding nearby to protect her father from shock."}, {"Scene_ID": "morning_uedamura", "Scene_Title": "心中宵庚申：上田村の段 (Uedamura no Dan)", "Line_No": 12, "Speaker": "お千代 (Ochiyo)", "Japanese_Ruby": "「<ruby>父様<rt>とうさま</rt></ruby>、<ruby>お千代<rt>おちよ</rt></ruby>はこゝにおります！<ruby>不孝<rt>ふこう</rt></ruby>の<ruby>重な<rt>おもな</rt></ruby>る<ruby>娘<rt>むすめ</rt></ruby>をお<ruby>許し<rt>ゆるし</rt></ruby><ruby>下さ<rt>くださ</rt></ruby>れ！」と<ruby>障子<rt>しょうじ</rt></ruby>の<ruby>蔭<rt>いん</rt></ruby>より<ruby>忍び<rt>しのび</rt></ruby><ruby>寄り<rt>より</rt></ruby>、<ruby>父<rt>ちち</rt></ruby>の<ruby>手<rt>て</rt></ruby>を<ruby>取つ<rt>とつ</rt></ruby>て<ruby>涙<rt>なみだ</rt></ruby>に<ruby>沈む<rt>しずむ</rt></ruby>。", "Japanese_Plain": "「父様、お千代はこゝにおります！不孝の重なる娘をお許し下され！」と障子の蔭より忍び寄り、父の手を取つて涙に沈む。", "English": "'Father, your Ochiyo is right here! Please forgive your unfilial daughter!' slipping out from behind the sliding screen, taking her father's trembling hands and dissolving into tears.", "Notes": "Ochiyo can no longer hide and reveals herself to her father."}, {"Scene_ID": "morning_uedamura", "Scene_Title": "心中宵庚申：上田村の段 (Uedamura no Dan)", "Line_No": 13, "Speaker": "平右衛門 (Heiemon)", "Japanese_Ruby": "「ヤア<ruby>千代<rt>ちよ</rt></ruby>、そこに<ruby>居つ<rt>いつ</rt></ruby>たか。それならなぜ<ruby>隠れ<rt>かくれ</rt></ruby>て<ruby>居た<rt>いた</rt></ruby>。<ruby>半兵衛<rt>はんべえ</rt></ruby>と<ruby>夫婦<rt>ふうふ</rt></ruby><ruby>仲<rt>なか</rt></ruby>が<ruby>悪<rt>あく</rt></ruby>うなつたのか、それとも<ruby>姑<rt>しゅうとめ</rt></ruby><ruby>御<rt>お</rt></ruby>に<ruby>去<rt>きょ</rt></ruby>なされたか」", "Japanese_Plain": "「ヤア千代、そこに居つたか。それならなぜ隠れて居た。半兵衛と夫婦仲が悪うなつたのか、それとも姑御に去なされたか」", "English": "'Ah, Ochiyo, you were here all along? Then why were you hiding? Have things soured between you and Hanbei, or has your mother-in-law driven you out?'", "Notes": "Heiemon immediately discerns the family trouble."}, {"Scene_ID": "morning_uedamura", "Scene_Title": "心中宵庚申：上田村の段 (Uedamura no Dan)", "Line_No": 14, "Speaker": "半兵衛 (Hanbei)", "Japanese_Ruby": "「<ruby>親父<rt>おやじ</rt></ruby><ruby>殿<rt>どの</rt></ruby>、<ruby>決して<rt>けっして</rt></ruby><ruby>千代<rt>ちよ</rt></ruby>を<ruby>嫌ふ<rt>きらふ</rt></ruby>て<ruby>去<rt>きょ</rt></ruby>なしたのではござらぬ。<ruby>武士<rt>ぶし</rt></ruby>の<ruby>家<rt>いえ</rt></ruby>に<ruby>生まれ<rt>うまれ</rt></ruby>ながら<ruby>養子<rt>ようし</rt></ruby>に<ruby>入り<rt>いり</rt></ruby>、<ruby>母<rt>はは</rt></ruby>の<ruby>無体<rt>むたい</rt></ruby>を<ruby>忍び<rt>しのび</rt></ruby>つゝも、<ruby>千代<rt>ちよ</rt></ruby>への<ruby>愛想<rt>あいそう</rt></ruby><ruby>尽か<rt>ことごとか</rt></ruby>しは<ruby>露<rt>つゆ</rt></ruby>ばかりもござらぬ！」", "Japanese_Plain": "「親父殿、決して千代を嫌ふて去なしたのではござらぬ。武士の家に生まれながら養子に入り、母の無体を忍びつゝも、千代への愛想尽かしは露ばかりもござらぬ！」", "English": "'Father, never would I cast Ochiyo aside out of dislike! Though born of samurai blood, I entered an adoptive merchant house; despite enduring my stepmother's unreasonableness, not a shred of my devotion to Ochiyo has ever waned!'", "Notes": "Hanbei passionately affirms his unbreakable love for Ochiyo."}, {"Scene_ID": "morning_uedamura", "Scene_Title": "心中宵庚申：上田村の段 (Uedamura no Dan)", "Line_No": 15, "Speaker": "平右衛門 (Heiemon)", "Japanese_Ruby": "「<ruby>半兵衛<rt>はんべえ</rt></ruby><ruby>殿<rt>どの</rt></ruby>、その<ruby>言葉<rt>ことば</rt></ruby>を<ruby>聞い<rt>きい</rt></ruby>て<ruby>安堵<rt>あんど</rt></ruby>した。<ruby>千代<rt>ちよ</rt></ruby>よ、<ruby>夫婦<rt>ふうふ</rt></ruby>の<ruby>情愛<rt>じょうあい</rt></ruby>さえ<ruby>固け<rt>かたけ</rt></ruby>れば、いかなる<ruby>憂き世<rt>うきよ</rt></ruby>の<ruby>難儀<rt>なんぎ</rt></ruby>も<ruby>恐る<rt>おそる</rt></ruby>ゝに<ruby>足ら<rt>たら</rt></ruby>ん」", "Japanese_Plain": "「半兵衛殿、その言葉を聞いて安堵した。千代よ、夫婦の情愛さえ固ければ、いかなる憂き世の難儀も恐るゝに足らん」", "English": "'Master Hanbei, hearing those words brings great comfort to my soul. Ochiyo, so long as the love between husband and wife remains steadfast, no hardship of this fleeting world need be feared.'", "Notes": "Heiemon blesses their devotion, knowing their bond is pure."}, {"Scene_ID": "morning_uedamura", "Scene_Title": "心中宵庚申：上田村の段 (Uedamura no Dan)", "Line_No": 16, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>去り<rt>さり</rt></ruby><ruby>難き<rt>がたき</rt></ruby><ruby>別れ<rt>わかれ</rt></ruby>の<ruby>刻限<rt>こくげん</rt></ruby><ruby>迫り<rt>せまり</rt></ruby>、「<ruby>大坂<rt>おおさか</rt></ruby>へ<ruby>戻ら<rt>もどら</rt></ruby>ば<ruby>母<rt>はは</rt></ruby>の<ruby>腹立ち<rt>はらだち</rt></ruby>いかばかりか」と<ruby>案ず<rt>あんず</rt></ruby>る<ruby>二人<rt>ふたり</rt></ruby>に、<ruby>老父<rt>ろうふ</rt></ruby>は<ruby>決<rt>けつ</rt></ruby><ruby>然<rt>ぜん</rt></ruby>と<ruby>言<rt>げん</rt></ruby>ひ<ruby>放つ<rt>ほうっつ</rt></ruby>。", "Japanese_Plain": "去り難き別れの刻限迫り、「大坂へ戻らば母の腹立ちいかばかりか」と案ずる二人に、老父は決然と言ひ放つ。", "English": "The hour of departure presses near. As the couple worries how furious the stepmother will be once they return to Osaka, the elderly father speaks with solemn resolve.", "Notes": "The turning point leading to the dramatic ritual of the wedding fire."}, {"Scene_ID": "morning_uedamura", "Scene_Title": "心中宵庚申：上田村の段 (Uedamura no Dan)", "Line_No": 17, "Speaker": "平右衛門 (Heiemon)", "Japanese_Ruby": "「<ruby>姉<rt>あね</rt></ruby>ナウ、<ruby>重ね<rt>おもね</rt></ruby>て<ruby>戻ら<rt>もどら</rt></ruby>ぬため、<ruby>祝<rt>しゅく</rt></ruby>ふて<ruby>内<rt>ない</rt></ruby>で<ruby>門火<rt>かどび</rt></ruby><ruby>焚け<rt>たけ</rt></ruby>！」", "Japanese_Plain": "「姉ナウ、重ねて戻らぬため、祝ふて内で門火焚け！」", "English": "'Elder sister Okaru! So that she may never return here divorced, celebrate her marriage and kindle the wedding gate-fire within our yard!'", "Notes": "Kadobi (gate-fire): a wedding custom where fire is lit so a bride never returns home. But it also evokes the fire lit when sending away a corpse for cremation."}, {"Scene_ID": "morning_uedamura", "Scene_Title": "心中宵庚申：上田村の段 (Uedamura no Dan)", "Line_No": 18, "Speaker": "おかる (Okaru)", "Japanese_Ruby": "「エヽエ<ruby>忌々しい<rt>いまいましい</rt></ruby>とは<ruby>思へ<rt>おもへ</rt></ruby>ども、<ruby>親<rt>おや</rt></ruby>に<ruby>従ふ<rt>したがふ</rt></ruby><ruby>焚火<rt>たきび</rt></ruby>の<ruby>煙<rt>けむり</rt></ruby>。めでたうこゝから<ruby>焚き<rt>たき</rt></ruby>ます」と、<ruby>庭<rt>にわ</rt></ruby>に<ruby>焦る<rt>あせる</rt></ruby>ゝ<ruby>下<rt>した</rt></ruby><ruby>燃え<rt>もえ</rt></ruby>の<ruby>煙<rt>けむり</rt></ruby>。", "Japanese_Plain": "「エヽ忌々しいとは思へども、親に従ふ焚火の煙。めでたうこゝから焚きます」と、庭に焦るゝ下燃えの煙。", "English": "'Though it feels so ill-omened to burn fire in daytime, I obey our father's command. For good fortune, I light it here!' and the smoldering smoke begins to rise in the courtyard.", "Notes": "Okaru reluctantly lights the straw fire, weeping at the dark omen."}, {"Scene_ID": "morning_uedamura", "Scene_Title": "心中宵庚申：上田村の段 (Uedamura no Dan)", "Line_No": 19, "Speaker": "平右衛門 (Heiemon)", "Japanese_Ruby": "「<ruby>灰<rt>はい</rt></ruby>になつても、<ruby>帰る<rt>かえる</rt></ruby>な！」", "Japanese_Plain": "「灰になつても、帰るな！」", "English": "'Even if you turn to ash, never return home!'", "Notes": "The iconic, heart-rending climax of Uedamura: Heiemon urges his daughter to die as Hanbei's true wife rather than live as a disgraced, cast-off divorcee."}, {"Scene_ID": "morning_uedamura", "Scene_Title": "心中宵庚申：上田村の段 (Uedamura no Dan)", "Line_No": 20, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "その<ruby>一言<rt>ひとこと</rt></ruby>をこの<ruby>世の<rt>よの</rt></ruby><ruby>名残<rt>なごり</rt></ruby>、<ruby>留まる<rt>とまる</rt></ruby><ruby>名残<rt>なごり</rt></ruby>、<ruby>行く<rt>いく</rt></ruby><ruby>名残<rt>なごり</rt></ruby>、<ruby>長き<rt>ながき</rt></ruby><ruby>名残<rt>なごり</rt></ruby>と、<ruby>涙<rt>なみだ</rt></ruby>の<ruby>袖<rt>そで</rt></ruby>を<ruby>絞り<rt>しぼり</rt></ruby>つゝ、<ruby>二人<rt>ふたり</rt></ruby>は<ruby>大坂<rt>おおさか</rt></ruby>の<ruby>修羅<rt>しゅら</rt></ruby>の<ruby>家<rt>いえ</rt></ruby>へと<ruby>急ぎ<rt>いそぎ</rt></ruby><ruby>帰る<rt>かえる</rt></ruby><ruby>道<rt>みち</rt></ruby>すがら。", "Japanese_Plain": "その一言をこの世の名残、留まる名残、行く名残、長き名残と、涙の袖を絞りつゝ、二人は大坂の修羅の家へと急ぎ帰る道すがら。", "English": "That single utterance becomes their final farewell in this world—farewell to those who stay, farewell to those who go, an everlasting farewell. Wringing out their tear-soaked sleeves, the couple hastens back toward the ordeal awaiting them in Osaka.", "Notes": "Closing lines of Uedamura no Dan, leading directly into Yaoya no Dan."}, {"Scene_ID": "morning_yaoya", "Scene_Title": "心中宵庚申：八百屋の段 (Yaoya no Dan)", "Line_No": 1, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>夏<rt>なつ</rt></ruby>も<ruby>来て<rt>きて</rt></ruby>、<ruby>青物<rt>あおもの</rt></ruby><ruby>見世<rt>みせ</rt></ruby>に<ruby>水乾く<rt>みずかわく</rt></ruby>、<ruby>筵<rt>むしろ</rt></ruby><ruby>庇<rt>ひさし</rt></ruby>に<ruby>避<rt>よ</rt></ruby>けられし、<ruby>日影<rt>ひかげ</rt></ruby>の<ruby>千代<rt>ちよ</rt></ruby>が<ruby>舅<rt>しゅうと</rt></ruby>の<ruby>家<rt>いえ</rt></ruby>は<ruby>新靱<rt>しんうつぼ</rt></ruby>、<ruby>油掛町<rt>あぶらかけちょう</rt></ruby><ruby>八百屋<rt>やおや</rt></ruby><ruby>伊右衛門<rt>いえもん</rt></ruby>。", "Japanese_Plain": "夏も来て、青物見世に水乾く、筵庇に避（よ）けられし、日影の千代が舅の家は新靱、油掛町八百屋伊右衛門。", "English": "Summer arrives, and water quickly parches on the fresh vegetable display beneath the straw eaves. In the shade resides the father-in-law of Ochiyo: the greengrocer Iemon of Aburakake-chō in Shin-Utsubo.", "Notes": "Opening of Yaoya no Dan. Wordplay on 'Chiyo' (wife's name) and 'hikage' (living in shadow / unfavored)."}, {"Scene_ID": "morning_yaoya", "Scene_Title": "心中宵庚申：八百屋の段 (Yaoya no Dan)", "Line_No": 2, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>浄土<rt>じょうど</rt></ruby><ruby>宗<rt>しゅう</rt></ruby>の<ruby>願ひ<rt>ねがひ</rt></ruby><ruby>手<rt>て</rt></ruby>、<ruby>了<rt>りょう</rt></ruby><ruby>海<rt>うみ</rt></ruby><ruby>坊<rt>ぼう</rt></ruby>の<ruby>談義<rt>だんぎ</rt></ruby>に<ruby>打込み<rt>うちこみ</rt></ruby>、<ruby>開帳<rt>かいちょう</rt></ruby><ruby>回向<rt>えこう</rt></ruby>の<ruby>世話<rt>せわ</rt></ruby>やき<ruby>仲間<rt>なかま</rt></ruby>、<ruby>見世<rt>みせ</rt></ruby>は<ruby>半兵衛<rt>はんべえ</rt></ruby>に<ruby>打<rt>だ</rt></ruby><ruby>任せ<rt>まかせ</rt></ruby>、<ruby>大坂<rt>おおさか</rt></ruby><ruby>中の<rt>なかの</rt></ruby><ruby>寺<rt>てら</rt></ruby><ruby>狂<rt>きょう</rt></ruby>。", "Japanese_Plain": "浄土宗の願ひ手、了海坊の談義に打込み、開帳回向の世話やき仲間、見世は半兵衛に打任せ、大坂中の寺狂。", "English": "Iemon has completely immersed himself in Buddhist sermons by priest Ryōkaibō of the Pure Land sect, bustling about arranging memorial services and unveiling ceremonies, leaving the shop entirely to Hanbei while he runs madly from temple to temple across Osaka.", "Notes": "Adoptive father Iemon has neglected the family business for temple affairs, leaving the household under his abrasive wife's thumb."}, {"Scene_ID": "morning_yaoya", "Scene_Title": "心中宵庚申：八百屋の段 (Yaoya no Dan)", "Line_No": 3, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>女房<rt>にょうぼう</rt></ruby>は<ruby>内外<rt>ないがい</rt></ruby>の<ruby>世話<rt>せわ</rt></ruby>に<ruby>五つ<rt>いつつ</rt></ruby>も<ruby>年老<rt>としより</rt></ruby>けて、<ruby>朝<rt>あさ</rt></ruby>から<ruby>晩<rt>ばん</rt></ruby>まで<ruby>気は<rt>きは</rt></ruby><ruby>苛立て<rt>いらだて</rt></ruby>。", "Japanese_Plain": "女房は内外の世話に五つも年老けて、朝から晩まで気は苛立て。", "English": "His wife, worn down five years by the burdens of managing inside and out, remains on edge and furiously irritable from morning till night.", "Notes": "Characterizing the ill-tempered stepmother (姑) whose antagonism drives the tragedy."}, {"Scene_ID": "morning_yaoya", "Scene_Title": "心中宵庚申：八百屋の段 (Yaoya no Dan)", "Line_No": 4, "Speaker": "継母 (Stepmother)", "Japanese_Ruby": "「この<ruby>半兵衛<rt>はんべえ</rt></ruby>は<ruby>蔵<rt>くら</rt></ruby>にべら／＼<ruby>何<rt>なに</rt></ruby>してゐやる。<ruby>見世<rt>みせ</rt></ruby>の<ruby>売物<rt>うりもの</rt></ruby>が<ruby>萎び<rt>しなび</rt></ruby>る。ヤイ<ruby>松<rt>まつ</rt></ruby>め、きり／＼と<ruby>水<rt>みず</rt></ruby><ruby>打ち<rt>うち</rt></ruby>をろ。コリヤさんよ、<ruby>洗濯<rt>のりかい</rt></ruby><ruby>物<rt>もの</rt></ruby>が<ruby>干上が<rt>ひあが</rt></ruby>ろがな」", "Japanese_Plain": "「この半兵衛は蔵にべら／＼何してゐやる。見世の売物が萎びる。ヤイ松め、きり／＼と水打ちをろ。コリヤさんよ、洗濯（のりかい）物が干上がろがな」", "English": "'What on earth is that Hanbei idling about in the storehouse for? The goods in the stall are withering! Hey Matsu, sprinkle water briskly! And you, the laundry will dry out in the sun!'", "Notes": "Authentic dialogue from the yukahon libretto; the stepmother constantly barks orders."}, {"Scene_ID": "morning_yaoya", "Scene_Title": "心中宵庚申：八百屋の段 (Yaoya no Dan)", "Line_No": 5, "Speaker": "継母 (Stepmother)", "Japanese_Ruby": "「<ruby>取り<rt>とり</rt></ruby>へて<ruby>畳<rt>たたみ</rt></ruby>んで<ruby>打<rt>だ</rt></ruby><ruby>盤<rt>ばん</rt></ruby><ruby>出し<rt>だし</rt></ruby>てちよき／＼と<ruby>打て<rt>うて</rt></ruby>。ヤそのちよき／＼で<ruby>夕飯<rt>ゆうはん</rt></ruby>の<ruby>御根葉<rt>おねば</rt></ruby><ruby>刻め<rt>きざめ</rt></ruby>。コリヤ<ruby>松<rt>まつ</rt></ruby>よ、<ruby>今日は<rt>こんにちは</rt></ruby><ruby>五日<rt>いつか</rt></ruby><ruby>宵<ruby>庚申<rt>かのえさる</rt></ruby><rt>よいごうしん</rt></ruby>、<ruby>甲子<rt>こうし</rt></ruby>が<ruby>近い<rt>ちかい</rt></ruby>。<ruby>二股<rt>ふたまた</rt></ruby><ruby>大根<rt>だいこん</rt></ruby>のけて<ruby>置け<rt>おけ</rt></ruby>。ソレさんよ<ruby>茶釜<rt>ちゃがま</rt></ruby>の<ruby>下が<rt>さが</rt></ruby><ruby>燃<rt>ねん</rt></ruby><ruby>出る<rt>でる</rt></ruby>」", "Japanese_Plain": "「取りへて畳んで打盤出してちよき／＼と打て。ヤそのちよき／＼で夕飯の御根葉（おねば）刻め。コリヤ松よ、今日は五日宵庚申、甲子が近い。二股大根のけて置け。ソレさんよ茶釜の下が燃出る」", "English": "'Take down the wash, fold it, bring out the fulling block and beat it steadily! Then use that same rhythm to chop vegetables for dinner! Matsu, today is the fifth, the eve of Kōshin—set aside the forked daikon! Look, the fire under the tea kettle is flaring up!'", "Notes": "Forked daikon (二股大根) was offered during the Kōshin vigil (宵庚申) to the deity Daikokuten."}, {"Scene_ID": "morning_yaoya", "Scene_Title": "心中宵庚申：八百屋の段 (Yaoya no Dan)", "Line_No": 6, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "と、<ruby>商売<rt>しょうばい</rt></ruby>が<ruby>八百屋<rt>やおや</rt></ruby>とて、<ruby>八百<rt>はっぴゃく</rt></ruby><ruby>色<rt>いろ</rt></ruby><ruby>程<rt>ほど</rt></ruby>いひ<ruby>付ける<rt>つける</rt></ruby>。<ruby>口<rt>くち</rt></ruby>せか／＼と<ruby>忙しき<rt>いそがしき</rt></ruby>は、<ruby>大晦日<rt>おおつごもり</rt></ruby>の<ruby>生れ<rt>うまれ</rt></ruby>かや。", "Japanese_Plain": "と、商売が八百屋とて、八百色程いひ付ける。口せか／＼と忙しきは、大晦日（おおつごもり）の生れかや。", "English": "True to their trade as greengrocers of 'eight hundred vegetables,' she barks out eight hundred orders at once! Bustling with such relentless haste, one would think she was born on New Year's Eve!", "Notes": "Chikamatsu's clever comic wordplay linking 'yaoya' (800 items/greengrocer) with endless demands."}, {"Scene_ID": "morning_yaoya", "Scene_Title": "心中宵庚申：八百屋の段 (Yaoya no Dan)", "Line_No": 7, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>伯母<rt>おば</rt></ruby>に<ruby>似<rt>じ</rt></ruby>ぬ<ruby>甥<rt>おい</rt></ruby>の<ruby>太兵衛<rt>たへえ</rt></ruby>が<ruby>市<rt>し</rt></ruby><ruby>通<rt>とおり</rt></ruby>ひ、<ruby>走り<rt>はしり</rt></ruby>の<ruby>竹の子<rt>たけのこ</rt></ruby><ruby>片<rt>へん</rt></ruby><ruby>荷<rt>か</rt></ruby>には<ruby>独活<rt>うど</rt></ruby>、<ruby>生姜<rt>しょうが</rt></ruby>、<ruby>青山<rt>あおやま</rt></ruby><ruby>椒<rt>しょう</rt></ruby>、<ruby>白<rt>しろ</rt></ruby><ruby>瓜<rt>うり</rt></ruby><ruby>二つ<rt>ふたつ</rt></ruby>。", "Japanese_Plain": "伯母に似ぬ甥の太兵衛が市通ひ、走りの竹の子片荷には独活、生姜、青山椒、白瓜二つ。", "English": "Unlike his sharp-tongued aunt, the simple-minded nephew Tahei returns from his daily errand to the vegetable market, carrying a load of early bamboo shoots, udo, fresh ginger, green sanshō pepper, and two white gourds.", "Notes": "Introducing nephew Tahei, who acts as the unwitting messenger between the lovers."}, {"Scene_ID": "morning_yaoya", "Scene_Title": "心中宵庚申：八百屋の段 (Yaoya no Dan)", "Line_No": 8, "Speaker": "太兵衛 (Tahei)", "Japanese_Ruby": "「これはさつてもはやいことでごんすよの。<ruby>俺<rt>おれ</rt></ruby>が<ruby>戻り<rt>もどり</rt></ruby>は、ても<ruby>遅い<rt>おそい</rt></ruby>ことでごんすよの」", "Japanese_Plain": "「これはさつてもはやいことでごんすよの。俺が戻りは、ても遅いことでごんすよの」", "English": "'Well now, isn't it remarkably early! Or rather, isn't my return terribly late indeed!'", "Notes": "Tahei's rustic, comic speech style."}, {"Scene_ID": "morning_yaoya", "Scene_Title": "心中宵庚申：八百屋の段 (Yaoya no Dan)", "Line_No": 9, "Speaker": "継母 (Stepmother)", "Japanese_Ruby": "「コリヤのらつぽ、<ruby>今朝<rt>けさ</rt></ruby>の<ruby>卯<rt>う</rt></ruby>の<ruby>刻<rt>こく</rt></ruby>からうちを<ruby>出て<rt>でて</rt></ruby>、<ruby>何時<rt>なんじ</rt></ruby>ぢやと<ruby>思ふ<rt>おもふ</rt></ruby>。<ruby>昼下り<rt>ひるさがり</rt></ruby>、どこで<ruby>鼻毛<rt>はなげ</rt></ruby>をよまれてゐた。<ruby>旦那<rt>だんな</rt></ruby><ruby>衆<rt>しゅう</rt></ruby>の<ruby>誂<rt>ちょう</rt></ruby>へ<ruby>物<rt>もの</rt></ruby>、<ruby>日覆<rt>ひおおい</rt></ruby>ひしてさへ<ruby>傷む<rt>いたむ</rt></ruby><ruby>時<rt>とき</rt></ruby>、<ruby>高い<rt>たかい</rt></ruby><ruby>物<rt>もの</rt></ruby>を<ruby>天道<rt>てんこ</rt></ruby><ruby>干し<rt>ほし</rt></ruby>にして！」", "Japanese_Plain": "「コリヤのらつぽ、今朝の卯の刻からうちを出て、何時ぢやと思ふ。昼下り、どこで鼻毛をよまれてゐた。旦那衆の誂へ物、日覆ひしてさへ傷む時、高い物を天道（てんこ）干しにして！」", "English": "'You lazy good-for-nothing! You left home at the hour of the Hare (6 AM)—what time do you think it is now? Past midday! Where were you loafing about having your nose hair counted? Exposing our patrons' expensive custom orders to dry out under the scorching sun!'", "Notes": "Tenko-boshi (天道干し): leaving vegetables exposed to direct blazing sunlight."}, {"Scene_ID": "morning_yaoya", "Scene_Title": "心中宵庚申：八百屋の段 (Yaoya no Dan)", "Line_No": 10, "Speaker": "半兵衛 (Hanbei)", "Japanese_Ruby": "「<ruby>母者<rt>ははじゃ</rt></ruby><ruby>人<rt>にん</rt></ruby>のがこりや<ruby>尤も<rt>もっとも</rt></ruby>。コレ<ruby>太兵衛<rt>たへえ</rt></ruby>、どこにのら／＼やつてゐた。<ruby>衽<rt>おくび</rt></ruby><ruby>町<rt>まち</rt></ruby>の<ruby>笹屋<rt>ささや</rt></ruby>から、<ruby>竹の子<rt>たけのこ</rt></ruby><ruby>取り<rt>とり</rt></ruby>に<ruby>矢<rt>や</rt></ruby>の<ruby>使<rt>し</rt></ruby>。<ruby>阿波座<rt>あわざ</rt></ruby><ruby>堀<rt>ほり</rt></ruby>の<ruby>丹波<rt>たんば</rt></ruby><ruby>屋<rt>や</rt></ruby>へ、<ruby>直ぐ<rt>すぐ</rt></ruby>に<ruby>持た<rt>もた</rt></ruby>せて<ruby>遣は<rt>つかは</rt></ruby>ねばならぬ」", "Japanese_Plain": "「母者人のがこりや尤も。コレ太兵衛、どこにのら／＼やつてゐた。衽（おくび）町の笹屋から、竹の子取りに矢の使。阿波座堀の丹波屋へ、直ぐに持たせて遣はねばならぬ」", "English": "'Mother's reprimand is entirely justified. Tahei, where have you been dawdling? Sasaya in Okubi-chō sent an urgent runner for bamboo shoots—we must dispatch them immediately to Tanbaya on Awazabori!'", "Notes": "Hanbei steps forward to defuse his mother's rage and keep the shop running smoothly."}, {"Scene_ID": "morning_yaoya", "Scene_Title": "心中宵庚申：八百屋の段 (Yaoya no Dan)", "Line_No": 11, "Speaker": "太兵衛 (Tahei)", "Japanese_Ruby": "「ハテ、わしぢやとてなんの<ruby>悪い<rt>わるい</rt></ruby><ruby>所<rt>ところ</rt></ruby>に<ruby>入つ<rt>いっつ</rt></ruby>てゐましよ。<ruby>横町<rt>よこちょう</rt></ruby>の<ruby>山城<rt>やましろ</rt></ruby><ruby>屋<rt>や</rt></ruby>から<ruby>呼<rt>こ</rt></ruby><ruby>込ま<rt>こま</rt></ruby>れ、<ruby>二つ<rt>ふたつ</rt></ruby><ruby>三つ<rt>みっつ</rt></ruby><ruby>咄<rt>はなし</rt></ruby>したばかり。それもほかのことでござらぬ、こなたに<ruby>逢<rt>ほう</rt></ruby>ひたいとて、<ruby>今朝<rt>けさ</rt></ruby>から<ruby>待つ<rt>まつ</rt></ruby>てござる」", "Japanese_Plain": "「ハテ、わしぢやとてなんの悪い所に入つてゐましよ。横町の山城屋から呼込まれ、二つ三つ咄したばかり。それもほかのことでござらぬ、こなたに逢ひたいとて、今朝から待つてござる」", "English": "'Good grief, as if I was loafing in any disreputable place! I was called inside the Yamashiroya inn at the alley corner for just a quick chat. And it was nothing else than someone longing to see you, who has been waiting there since early morning!'", "Notes": "Tahei inadvertently lets slip that someone is waiting to see Hanbei."}, {"Scene_ID": "morning_yaoya", "Scene_Title": "心中宵庚申：八百屋の段 (Yaoya no Dan)", "Line_No": 12, "Speaker": "半兵衛 (Hanbei)", "Japanese_Ruby": "「ハア<ruby>山城<rt>やましろ</rt></ruby><ruby>屋<rt>や</rt></ruby>からは<ruby>何の<rt>なんの</rt></ruby><ruby>用<rt>よう</rt></ruby>。どりや<ruby>一寸<rt>ちょっと</rt></ruby><ruby>行て<rt>いって</rt></ruby><ruby>来<rt>らい</rt></ruby>う」", "Japanese_Plain": "「ハア山城屋からは何の用。どりや一寸行て来う」", "English": "'Ah, what business could Yamashiroya have with me? Let me just step over and see.'", "Notes": "Hanbei tries to slip away calmly before his stepmother suspects anything."}, {"Scene_ID": "morning_yaoya", "Scene_Title": "心中宵庚申：八百屋の段 (Yaoya no Dan)", "Line_No": 13, "Speaker": "継母 (Stepmother)", "Japanese_Ruby": "「<ruby>息子<rt>むすこ</rt></ruby><ruby>殿<rt>どの</rt></ruby>、こりやどこへ！アノぬつけりとした<ruby>顔<rt>かお</rt></ruby>わいの。こちと<ruby>夫婦<rt>ふうふ</rt></ruby>は<ruby>何も<rt>なにも</rt></ruby><ruby>知ら<rt>しら</rt></ruby>ぬと<ruby>思ふ<rt>おもふ</rt></ruby>てか。<ruby>気に入ら<rt>きにいら</rt></ruby>いで<ruby>去<rt>い</rt></ruby>なした<ruby>嫁<rt>よめ</rt></ruby>、<ruby>親<rt>おや</rt></ruby>の<ruby>嫌ふ<rt>きらふ</rt></ruby><ruby>女房<rt>にょうぼう</rt></ruby>に、<ruby>随分<rt>ずいぶん</rt></ruby>と<ruby>孝行<rt>こうこう</rt></ruby><ruby>尽し<rt>つくし</rt></ruby>、<ruby>親<rt>おや</rt></ruby>には<ruby>不孝<rt>ふこう</rt></ruby><ruby>尽し<rt>つくし</rt></ruby>！」", "Japanese_Plain": "「息子殿、こりやどこへ！アノぬつけりとした顔わいの。こちと夫婦は何も知らぬと思ふてか。気に入らいで去（い）なした嫁、親の嫌ふ女房に、随分と孝行尽し、親には不孝尽し！」", "English": "'Son, where do you think you're going! Look at that smug face of yours! Did you think my husband and I wouldn't find out? Showering all your devotion on a cast-off bride your parents despise, while treating your own parents with total unfilial contempt!'", "Notes": "The stepmother realizes Ochiyo has returned and flies into a rage."}, {"Scene_ID": "morning_yaoya", "Scene_Title": "心中宵庚申：八百屋の段 (Yaoya no Dan)", "Line_No": 14, "Speaker": "半兵衛 (Hanbei)", "Japanese_Ruby": "「<ruby>申し<rt>もうし</rt></ruby><ruby>母者<rt>ははじゃ</rt></ruby><ruby>人<rt>にん</rt></ruby>、<ruby>武士<rt>ぶし</rt></ruby>の<ruby>釜<rt>かま</rt></ruby>の<ruby>水<rt>みず</rt></ruby>で<ruby>育ち<rt>そだち</rt></ruby>しこの<ruby>半兵衛<rt>はんべえ</rt></ruby>、<ruby>御恩<rt>ごおん</rt></ruby>の<ruby>母<rt>はは</rt></ruby>の<ruby>気に入ら<rt>きにいら</rt></ruby>ぬ<ruby>女房<rt>にょうぼう</rt></ruby>なれば、<ruby>私<rt>わたし</rt></ruby>が<ruby>離別<rt>りべつ</rt></ruby><ruby>致し<rt>いたし</rt></ruby>てこそ<ruby>孝行<rt>こうこう</rt></ruby>も<ruby>立ち<rt>たち</rt></ruby>、<ruby>真実<rt>しんじつ</rt></ruby><ruby>去る<rt>さる</rt></ruby>が<ruby>定め<rt>さだめ</rt></ruby>でござる」", "Japanese_Plain": "「申し母者人、武士の釜の水で育ちしこの半兵衛、御恩の母の気に入らぬ女房なれば、私が離別致してこそ孝行も立ち、真実去るが定めでござる」", "English": "'Mother, I beg you to hear me. Raised on the water of a samurai household, if my wife does not please the mother to whom I owe endless debt, it is my duty to divorce her to fulfill filial piety—I am truly resolved to part with her!'", "Notes": "Hanbei feigns absolute obedience to his mother to avoid public scandal and buy time."}, {"Scene_ID": "morning_yaoya", "Scene_Title": "心中宵庚申：八百屋の段 (Yaoya no Dan)", "Line_No": 15, "Speaker": "お千代 (Ochiyo)", "Japanese_Ruby": "「ハア<ruby>久し<rt>ひさし</rt></ruby>ぶりで<ruby>内<rt>ない</rt></ruby>を<ruby>見た<rt>みた</rt></ruby>。<ruby>半兵衛<rt>はんべえ</rt></ruby><ruby>様<rt>さま</rt></ruby>、かか<ruby>様<rt>さま</rt></ruby>、<ruby>お千代<rt>おちよ</rt></ruby>が<ruby>戻つ<rt>もどつ</rt></ruby>て<ruby>参り<rt>まいり</rt></ruby>ました！」と<ruby>門口<rt>かどぐち</rt></ruby>に<ruby>手<rt>て</rt></ruby>を<ruby>突い<rt>つい</rt></ruby>て<ruby>伏し<rt>ふし</rt></ruby><ruby>拝む<rt>おがむ</rt></ruby>。", "Japanese_Plain": "「ハア久しぶりで内を見た。半兵衛様、かか様、お千代が戻つて参りました！」と門口に手を突いて伏し拝む。", "English": "'Ah, what joy to see our home after so long! Master Hanbei, Mother, your Ochiyo has returned!' dropping to her knees at the doorway in humble supplication.", "Notes": "Ochiyo arrives in person, hoping against hope to reconcile with the stepmother."}, {"Scene_ID": "morning_yaoya", "Scene_Title": "心中宵庚申：八百屋の段 (Yaoya no Dan)", "Line_No": 16, "Speaker": "継母 (Stepmother)", "Japanese_Ruby": "「コレこの<ruby>母<rt>はは</rt></ruby>が<ruby>喉笛<rt>のどぶえ</rt></ruby>を<ruby>出刃包丁<rt>でばぼうちょう</rt></ruby>でちよらいぢやぞや！<ruby>母<rt>はは</rt></ruby><ruby>殺す<rt>ころす</rt></ruby>か<ruby>女房<rt>にょうぼう</rt></ruby><ruby>去る<rt>さる</rt></ruby>か！」", "Japanese_Plain": "「コレこの母が喉笛を出刃包丁でちよらいぢやぞや！母殺すか女房去るか！」", "English": "'Here, slit your own mother's throat with this kitchen cleaver right now! Will you slaughter your mother, or will you cast out your wife?!'", "Notes": "The explosive peak of maternal emotional blackmail: brandishing a deba knife."}, {"Scene_ID": "morning_yaoya", "Scene_Title": "心中宵庚申：八百屋の段 (Yaoya no Dan)", "Line_No": 17, "Speaker": "半兵衛 (Hanbei)", "Japanese_Ruby": "「<ruby>母<rt>はは</rt></ruby><ruby>様の<rt>ようの</rt></ruby>お<ruby>腹<rt>はら</rt></ruby>に<ruby>叶<rt>かのう</rt></ruby>ひ、<ruby>身の<rt>みの</rt></ruby><ruby>立つ<rt>たつ</rt></ruby><ruby>様に<rt>ように</rt></ruby><ruby>去<rt>きょ</rt></ruby>なすが<ruby>男<rt>おとこ</rt></ruby>の<ruby>道<rt>みち</rt></ruby>。<ruby>三下り半<rt>みくだりはん</rt></ruby>を<ruby>書い<rt>かい</rt></ruby>て<ruby>渡す<rt>わたす</rt></ruby>！」と<ruby>筆<rt>ふで</rt></ruby>を<ruby>取り<rt>とり</rt></ruby>、<ruby>涙<rt>なみだ</rt></ruby>を<ruby>呑ん<rt>のん</rt></ruby>で<ruby>離縁<rt>りえん</rt></ruby><ruby>状<rt>じょう</rt></ruby>を<ruby>認む<rt>みとむ</rt></ruby>。", "Japanese_Plain": "「母様のお腹に叶ひ、身の立つ様に去なすが男の道。三下り半を書いて渡す！」と筆を取り、涙を呑んで離縁状を認む。", "English": "'To satisfy mother's heart and preserve honor, casting her out is a man's true duty. I shall write the three-and-a-half lines of divorce!' taking up brush and ink, swallowing his tears as he writes the deed of divorce.", "Notes": "Mikudarihan (三下り半): traditional three-and-a-half line formal letter of divorce."}, {"Scene_ID": "morning_yaoya", "Scene_Title": "心中宵庚申：八百屋の段 (Yaoya no Dan)", "Line_No": 18, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "「コレ<ruby>持て<rt>もて</rt></ruby>、<ruby>疾く<rt>はやく</rt></ruby><ruby>立ち<rt>たち</rt></ruby><ruby>去れ<rt>され</rt></ruby>」と<ruby>表<rt>おもて</rt></ruby>へ<ruby>突出<rt>とっしゅつ</rt></ruby>す<ruby>手練<rt>てだれ</rt></ruby>の<ruby>言葉<rt>ことば</rt></ruby>、<ruby>心<rt>こころ</rt></ruby>の<ruby>内<rt>ない</rt></ruby>は<ruby>後の<rt>のちの</rt></ruby><ruby>世<rt>よ</rt></ruby>までも、<ruby>離れ<rt>はなれ</rt></ruby>ぬ<ruby>誓ひ<rt>ちかひ</rt></ruby>の<ruby>闇<rt>やみ</rt></ruby>の<ruby>夜<rt>よる</rt></ruby>。", "Japanese_Plain": "「コレ持て、疾く立ち去れ」と表へ突出す手練の言葉、心の内は後の世までも、離れぬ誓ひの闇の夜。", "English": "'Take this and be gone at once!' he shouts, thrusting her into the street with harsh-sounding words—yet within his heart lies the unspoken vow never to part, even through the eternal darkness of the next world.", "Notes": "The heartbreaking double-meaning: cruelty in public, eternal love in secret."}, {"Scene_ID": "morning_yaoya", "Scene_Title": "心中宵庚申：八百屋の段 (Yaoya no Dan)", "Line_No": 19, "Speaker": "半兵衛 (Hanbei)", "Japanese_Ruby": "<ruby>夜更け<rt>よふけ</rt></ruby>を<ruby>待ち<rt>まち</rt></ruby>、<ruby>先祖<rt>せんぞ</rt></ruby><ruby>伝来<rt>でんらい</rt></ruby>の<ruby>刀<rt>かたな</rt></ruby>を<ruby>懐<rt>ふところ</rt></ruby>にし、<ruby>忍び<rt>しのび</rt></ruby><ruby>足<rt>あし</rt></ruby>にて<ruby>門口<rt>かどぐち</rt></ruby>を<ruby>出づ<rt>いづ</rt></ruby>れば、<ruby>闇<rt>やみ</rt></ruby>に<ruby>待ち<rt>まち</rt></ruby>わびし<ruby>お千代<rt>おちよ</rt></ruby>の<ruby>手<rt>て</rt></ruby>を<ruby>取り<rt>とり</rt></ruby>、「サア、<ruby>鰐<rt>わに</rt></ruby>の<ruby>口<rt>くち</rt></ruby>を<ruby>逃れ<rt>のがれ</rt></ruby>た。おぢや！」", "Japanese_Plain": "夜更けを待ち、先祖伝来の刀を懐にし、忍び足にて門口を出づれば、闇に待ちわびしお千代の手を取り、「サア、鰐の口を逃れた。おぢや！」", "English": "Waiting until deep night, concealing his ancestral samurai blades within his garments, Hanbei slips silently out the doorway and takes Ochiyo's waiting hand: 'Now, we have escaped from the crocodile's jaws! Let us fly!'", "Notes": "Escaping from the 'crocodile's jaws' (wani no kuchi)—referring to the ferocious stepmother."}, {"Scene_ID": "morning_yaoya", "Scene_Title": "心中宵庚申：八百屋の段 (Yaoya no Dan)", "Line_No": 20, "Speaker": "お千代 (Ochiyo)", "Japanese_Ruby": "「マア<ruby>待つ<rt>まつ</rt></ruby>て<ruby>下さ<rt>くださ</rt></ruby>んせ。なまなか<ruby>一度<rt>いちど</rt></ruby><ruby>戻つ<rt>もどつ</rt></ruby>て、こな<ruby>様の<rt>ようの</rt></ruby><ruby>口<rt>くち</rt></ruby>から『<ruby>去る<rt>さる</rt></ruby>ぞ』と<ruby>言<rt>げん</rt></ruby>はれては<ruby>未来<rt>みらい</rt></ruby>までの<ruby>気<rt>き</rt></ruby><ruby>懸<rt>けん</rt></ruby>り。この<ruby>門口<rt>かどぐち</rt></ruby>でたつた<ruby>一言<rt>ひとこと</rt></ruby>、『<ruby>去ら<rt>さら</rt></ruby>ぬ』と<ruby>言<rt>げん</rt></ruby>ふて<ruby>下さ<rt>くださ</rt></ruby>んせ！」", "Japanese_Plain": "「マア待つて下さんせ。なまなか一度戻つて、こな様の口から『去るぞ』と言はれては未来までの気懸り。この門口でたつた一言、『去らぬ』と言ふて下さんせ！」", "English": "'Oh wait, please wait! Having returned home only to hear 'I cast you out' from your own lips leaves me in anguish through all eternity. Here at this doorway, please utter just one word: say 'I do not cast you out'!'", "Notes": "Ochiyo's poignant plea: she cannot bear to enter death bearing the stigma of a divorced wife."}, {"Scene_ID": "morning_yaoya", "Scene_Title": "心中宵庚申：八百屋の段 (Yaoya no Dan)", "Line_No": 21, "Speaker": "半兵衛 (Hanbei)", "Japanese_Ruby": "「ハテ<ruby>愚痴<rt>ぐち</rt></ruby>なことばかり。<ruby>今宵<rt>こよい</rt></ruby>は<ruby>五日<rt>いつか</rt></ruby><ruby>宵<ruby>庚申<rt>かのえさる</rt></ruby><rt>よいごうしん</rt></ruby>、<ruby>女<rt>おんな</rt></ruby><ruby>夫<rt>おっと</rt></ruby><ruby>連れ<rt>つれ</rt></ruby>でこの<ruby>家<rt>いえ</rt></ruby>を<ruby>去る<rt>さる</rt></ruby>、この<ruby>世<rt>よ</rt></ruby>を<ruby>去る<rt>さる</rt></ruby>と<ruby>思へ<rt>おもへ</rt></ruby>ばよいわいの！」", "Japanese_Plain": "「ハテ愚痴なことばかり。今宵は五日宵庚申、女夫連れでこの家を去る、この世を去ると思へばよいわいの！」", "English": "'Dear wife, do not fret over such foolish things. Tonight is the fifth, the eve of Kōshin—think of it as husband and wife departing this house together, casting off this fleeting mortal world together!'", "Notes": "Hanbei transforms the word 'saru' (to cast off / divorce) into 'saru' (to leave this earthly existence as eternal partners)."}, {"Scene_ID": "morning_yaoya", "Scene_Title": "心中宵庚申：八百屋の段 (Yaoya no Dan)", "Line_No": 22, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "「ヲヽヲほんにさうぢや」<ruby>手に<rt>てに</rt></ruby><ruby>手<rt>て</rt></ruby>を<ruby>取つ<rt>とつ</rt></ruby>てこの<ruby>世<rt>よ</rt></ruby>を<ruby>去る<rt>さる</rt></ruby>、<ruby>輪廻<rt>りんね</rt></ruby>を<ruby>去る<rt>さる</rt></ruby>、<ruby>迷ひ<rt>まよひ</rt></ruby>を<ruby>去る<rt>さる</rt></ruby>、<ruby>今日は<rt>こんにちは</rt></ruby><ruby>最期<rt>さいご</rt></ruby>の<ruby>羊<rt>ひつじ</rt></ruby>の<ruby>歩み<rt>あゆみ</rt></ruby>、<ruby>足<rt>あし</rt></ruby>に<ruby>任せ<rt>まかせ</rt></ruby>て<ruby>急ぎ<rt>いそぎ</rt></ruby><ruby>行く<rt>いく</rt></ruby>。", "Japanese_Plain": "「ヲヽほんにさうぢや」手に手を取つてこの世を去る、輪廻を去る、迷ひを去る、今日は最期の羊の歩み、足に任せて急ぎ行く。", "English": "'Oh, indeed it is so!' Hand in hand they leave this world, leave the wheel of transmigration, leave all earthly illusions behind. Taking their final steps toward the slaughter like sheep to the altar, they hasten away into the midnight gloom.", "Notes": "Hitsuji no ayumi (羊の歩み): Buddhist metaphor comparing human mortality to a sacrificial sheep taking its final steps toward slaughter."}, {"Scene_ID": "morning_michiyuki", "Scene_Title": "心中宵庚申：道行思ひの短夜 (Michiyuki Omoi no Mijikayo)", "Line_No": 1, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>名残<rt>なごり</rt></ruby>の<ruby>夏<rt>なつ</rt></ruby>の<ruby>薄衣<rt>うすぎぬ</rt></ruby>、<ruby>鴬<rt>うぐいす</rt></ruby>の<ruby>巣<rt>す</rt></ruby>に<ruby>育て<rt>そだて</rt></ruby>られ、<ruby>子<rt>こ</rt></ruby>で<ruby>子<rt>こ</rt></ruby>にならぬ<ruby>時鳥<rt>ほととぎす</rt></ruby>、われも<ruby>二八<rt>にはち</rt></ruby>の<ruby>年月<rt>としつき</rt></ruby>を<ruby>養ひ<rt>やしなひ</rt></ruby><ruby>親<rt>おや</rt></ruby>に<ruby>育て<rt>そだて</rt></ruby>られ、<ruby>子<rt>こ</rt></ruby>で<ruby>子<rt>こ</rt></ruby>にならず<ruby>振<rt>しん</rt></ruby><ruby>捨て<rt>すて</rt></ruby>ゝ、<ruby>死に<rt>しに</rt></ruby>ゝ<ruby>行く<rt>いく</rt></ruby><ruby>身<rt>み</rt></ruby>は<ruby>人<rt>にん</rt></ruby>ならぬ、<ruby>死出<rt>しで</rt></ruby>の<ruby>田長<rt>たおさ</rt></ruby>か<ruby>時鳥<rt>ほととぎす</rt></ruby>。", "Japanese_Plain": "名残の夏の薄衣、鴬の巣に育てられ、子で子にならぬ時鳥、われも二八の年月を養ひ親に育てられ、子で子にならず振捨てゝ、死にゝ行く身は人ならぬ、死出の田長か時鳥。", "English": "The lingering traces of summer are like thin garments. Just as the cuckoo is raised in a warbler's nest yet remains no true child of the nest, so too was I fostered sixteen years by adoptive parents, never truly their own flesh and blood, now casting all aside on the road to death—no longer a man of this world, but a cuckoo singing toward the underworld.", "Notes": "Poetic travel imagery comparing the adopted Hanbei to a cuckoo (hototogisu) raised in another bird's nest (brood parasitism)."}, {"Scene_ID": "morning_michiyuki", "Scene_Title": "心中宵庚申：道行思ひの短夜 (Michiyuki Omoi no Mijikayo)", "Line_No": 2, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>卯月<rt>うづき</rt></ruby><ruby>五日<rt>いつか</rt></ruby>の<ruby>宵<ruby>庚申<rt>かのえさる</rt></ruby><rt>よいごうしん</rt></ruby>、<ruby>死な<rt>しな</rt></ruby>ば<ruby>一所<rt>いっしょ</rt></ruby>と<ruby>契り<rt>ちぎり</rt></ruby>たる、その<ruby>一言<rt>ひとこと</rt></ruby>は<ruby>庚申<rt>かのえさる</rt></ruby>、<ruby>参り<rt>まいり</rt></ruby>の<ruby>人<rt>にん</rt></ruby>に<ruby>打<rt>だ</rt></ruby><ruby>紛れ<rt>まぎれ</rt></ruby>、<ruby>忍び<rt>しのび</rt></ruby><ruby>出づ<rt>いづ</rt></ruby>るも<ruby>哀れ<rt>あわれ</rt></ruby>なり。", "Japanese_Plain": "卯月五日の宵庚申、死なば一所と契りたる、その一言は庚申、参りの人に打紛れ、忍び出づるも哀れなり。", "English": "On this fifth night of the fourth month, the eve of the Kōshin vigil, they pledged: 'If we must die, let us die together in one place.' Clinging to that single vow, they slip silently into the crowd of temple pilgrims, a sorrowful sight beyond words.", "Notes": "The Kōshin vigil (宵庚申) required believers to stay awake all night to prevent the three death-worms (sanshi) from ascending to Heaven."}, {"Scene_ID": "morning_michiyuki", "Scene_Title": "心中宵庚申：道行思ひの短夜 (Michiyuki Omoi no Mijikayo)", "Line_No": 3, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "『われが<ruby>恋路<rt>こいじ</rt></ruby>は<ruby>糸<rt>いと</rt></ruby>なき<ruby>三味<rt>しゃみ</rt></ruby>よ。なんの<ruby>音<rt>おと</rt></ruby>もせで<ruby>待<rt>たい</rt></ruby><ruby>明か<rt>あか</rt></ruby>す。それぢや／＼。<ruby>見れ<rt>みれ</rt></ruby>ば<ruby>思ひ<rt>おもひ</rt></ruby>の<ruby>雲<rt>くも</rt></ruby>の<ruby>帯<rt>おび</rt></ruby>、さても<ruby>短夜<rt>みじかよ</rt></ruby><ruby>心<rt>こころ</rt></ruby>のせくにござんせ。<ruby>二人<rt>ふたり</rt></ruby>と<ruby>二人<rt>ふたり</rt></ruby>が<ruby>名取<rt>なとり</rt></ruby><ruby>川<rt>かわ</rt></ruby>、それぢやそれぢやえ』", "Japanese_Plain": "『われが恋路は糸なき三味よ。なんの音もせで待明かす。それぢや／＼。見れば思ひの雲の帯、さても短夜心のせくにござんせ。二人と二人が名取川、それぢやそれぢやえ』", "English": "'Our path of love is like a stringless shamisen—making no sound as we wait through till dawn. Truly so! Look at the band of clouds born of yearning; alas, the short summer night hastens our hurried hearts! Two of us together in the Natori River of love!'", "Notes": "Folk songs (hauta) sung by midnight revelers on the street, echoing the lovers' inner heartache."}, {"Scene_ID": "morning_michiyuki", "Scene_Title": "心中宵庚申：道行思ひの短夜 (Michiyuki Omoi no Mijikayo)", "Line_No": 4, "Speaker": "半兵衛 (Hanbei)", "Japanese_Ruby": "「<ruby>俺<rt>おれ</rt></ruby>とそなたが<ruby>名取<rt>なとり</rt></ruby><ruby>川<rt>かわ</rt></ruby>。<ruby>辻占<rt>つじうら</rt></ruby>がよい、こなたヘ。これでお<ruby>前<rt>まえ</rt></ruby>の<ruby>心<rt>こころ</rt></ruby>も<ruby>晴れ<rt>はれ</rt></ruby><ruby>晴れ<rt>はれ</rt></ruby>、<ruby>死出<rt>しで</rt></ruby>の<ruby>旅立ち<rt>たびだち</rt></ruby>に<ruby>迷ひ<rt>まよひ</rt></ruby>はござらぬ」", "Japanese_Plain": "「俺とそなたが名取川。辻占がよい、こなたヘ。これでお前の心も晴れ晴れ、死出の旅立ちに迷ひはござらぬ」", "English": "'You and I together in the river of love! The street divination is auspicious—come this way! With this, may your heart be clear and peaceful, with no lingering regrets on our journey to the realm of death.'", "Notes": "Tsujiura (辻占): street fortune-telling where the words of passersby are taken as divine prophecy."}, {"Scene_ID": "morning_michiyuki", "Scene_Title": "心中宵庚申：道行思ひの短夜 (Michiyuki Omoi no Mijikayo)", "Line_No": 5, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>生玉<rt>いくたま</rt></ruby>の<ruby>宮<rt>みや</rt></ruby>の<ruby>森陰<rt>もりかげ</rt></ruby>、<ruby>東大寺<rt>とうだいじ</rt></ruby><ruby>勧進所<rt>かんじんしょ</rt></ruby>の<ruby>木立<rt>こだち</rt></ruby>の<ruby>下<rt>した</rt></ruby>、<ruby>夜風<rt>よかぜ</rt></ruby><ruby>肌寒<rt>はださむ</rt></ruby>く<ruby>露<rt>つゆ</rt></ruby><ruby>落ち<rt>おち</rt></ruby>て、<ruby>二人<rt>ふたり</rt></ruby>の<ruby>歩み<rt>あゆみ</rt></ruby>もこゝを<ruby>限り<rt>かぎり</rt></ruby>の<ruby>死場<rt>しにば</rt></ruby><ruby>所<rt>ところ</rt></ruby>。", "Japanese_Plain": "生玉の宮の森陰、東大寺勧進所の木立の下、夜風肌寒く露落ちて、二人の歩みもこゝを限りの死場所。", "English": "In the shadowy woods of Ikutama Shrine, beneath the trees of the Tōdai-ji Temple reconstruction office, the night wind blows chill and heavy dew falls; here their footsteps reach the final destination chosen for their death.", "Notes": "Tōdaiji Kanjinsho (東大寺勧進所): temporary fundraising office for the rebuilding of the Great Buddha of Nara, located near Ikutama in Osaka."}, {"Scene_ID": "morning_michiyuki", "Scene_Title": "心中宵庚申：道行思ひの短夜 (Michiyuki Omoi no Mijikayo)", "Line_No": 6, "Speaker": "半兵衛 (Hanbei)", "Japanese_Ruby": "「ナウ<ruby>お千代<rt>おちよ</rt></ruby>、<ruby>心は<rt>こころは</rt></ruby><ruby>境界<rt>きょうかい</rt></ruby>に<ruby>従つ<rt>したがつ</rt></ruby>て<ruby>転じ<rt>てんじ</rt></ruby><ruby>変る<rt>かわる</rt></ruby>とや。そなたも<ruby>千代<rt>ちよ</rt></ruby>といふ<ruby>名<rt>めい</rt></ruby>を、<ruby>風<rt>かぜ</rt></ruby><ruby>覚<rt>かく</rt></ruby><ruby>良<rt>りょう</rt></ruby><ruby>訓<rt>くん</rt></ruby><ruby>信女<rt>しんにょ</rt></ruby>と<ruby>改め<rt>あらため</rt></ruby>、<ruby>我が<rt>わが</rt></ruby><ruby>八百屋<rt>やおや</rt></ruby><ruby>半兵衛<rt>はんべえ</rt></ruby>を<ruby>露<rt>つゆ</rt></ruby><ruby>秋<rt>あき</rt></ruby><ruby>禅定<rt>ぜんじょう</rt></ruby><ruby>門<rt>もん</rt></ruby>と<ruby>改め<rt>あらため</rt></ruby>、<ruby>明日<rt>あした</rt></ruby>は<ruby>西方<rt>せいほう</rt></ruby>の<ruby>極楽<rt>ごくらく</rt></ruby>にて、<ruby>蓮<rt>はす</rt></ruby>の<ruby>台<rt>だい</rt></ruby>に<ruby>契り<rt>ちぎり</rt></ruby>を<ruby>結ば<rt>むすば</rt></ruby>ん」", "Japanese_Plain": "「ナウお千代、心は境界に従つて転じ変るとや。そなたも千代といふ名を、風覚良訓信女と改め、我が八百屋半兵衛を露秋禅定門と改め、明日は西方の極楽にて、蓮の台に契りを結ばん」", "English": "'Listen, Ochiyo: it is said the soul transforms according to its spiritual realm. Cast off the worldly name of Ochiyo and take the Buddhist posthumous name of Fūkaku Ryōkun Shinnyo; while I, the greengrocer Hanbei, become Roshū Zenjōmon. Tomorrow, in the Western Pure Land, we shall plight our eternal vows upon the lotus pedestal.'", "Notes": "Bestowing posthumous Buddhist names (戒名) upon themselves before committing suicide."}, {"Scene_ID": "morning_michiyuki", "Scene_Title": "心中宵庚申：道行思ひの短夜 (Michiyuki Omoi no Mijikayo)", "Line_No": 7, "Speaker": "お千代 (Ochiyo)", "Japanese_Ruby": "「ナウ<ruby>死ぬ<rt>しぬ</rt></ruby>る<ruby>身に<rt>みに</rt></ruby>なんの<ruby>望み<rt>のぞみ</rt></ruby>。<ruby>水<rt>みず</rt></ruby>の<ruby>中火<rt>ちゅうび</rt></ruby>の<ruby>中<rt>なか</rt></ruby>でも、<ruby>先の<rt>さきの</rt></ruby><ruby>世<rt>よ</rt></ruby>までもこな<ruby>様<rt>さま</rt></ruby>と、<ruby>女<rt>おんな</rt></ruby><ruby>夫<rt>おっと</rt></ruby>になつてゐる<ruby>所<rt>ところ</rt></ruby>を<ruby>見立て<rt>みたて</rt></ruby>ゝ<ruby>死ん<rt>しん</rt></ruby>で<ruby>下さ<rt>くださ</rt></ruby>んせ」", "Japanese_Plain": "「ナウ死ぬる身になんの望み。水の中火の中でも、先の世までもこな様と、女夫になつてゐる所を見立てゝ死んで下さんせ」", "English": "'What earthly desire could I have, being about to die? Through flood or fire, through all future lifetimes, please envision us as eternal husband and wife as you take my life.'", "Notes": "Ochiyo's pure Buddhist devotion to Hanbei beyond mortal life."}, {"Scene_ID": "morning_michiyuki", "Scene_Title": "心中宵庚申：道行思ひの短夜 (Michiyuki Omoi no Mijikayo)", "Line_No": 8, "Speaker": "お千代 (Ochiyo)", "Japanese_Ruby": "「<ruby>惜しき<rt>おしき</rt></ruby>は<ruby>胎内<rt>たいない</rt></ruby>の<ruby>五月<rt>ごがつ</rt></ruby>の<ruby>男<rt>おとこ</rt></ruby>か<ruby>女<rt>おんな</rt></ruby>か、<ruby>親<rt>おや</rt></ruby>の<ruby>咎<rt>とが</rt></ruby>を<ruby>背負ひ<rt>しょひ</rt></ruby>て<ruby>露<rt>つゆ</rt></ruby>と<ruby>消ゆ<rt>きゆ</rt></ruby>る<ruby>子<rt>こ</rt></ruby>へ、<ruby>南無阿弥陀仏<rt>なむあみだぶつ</rt></ruby>の<ruby>御<rt>お</rt></ruby><ruby>回向<rt>えこう</rt></ruby>を……」と、<ruby>涙<rt>なみだ</rt></ruby>に<ruby>噎び<rt>むせび</rt></ruby>て<ruby>腹<rt>はら</rt></ruby>を<ruby>押さ<rt>おさ</rt></ruby>へぬ。", "Japanese_Plain": "「惜しきは胎内の五月の男か女か、親の咎を背負ひて露と消ゆる子へ、南無阿弥陀仏の御回向を……」と、涙に噎びて腹を押さへぬ。", "English": "'My only heartbreak is the child within my womb, due in the fifth month—boy or girl, innocent of its parents' sins, doomed to vanish like dew. Please offer a Nenbutsu prayer for our unborn baby...' weeping uncontrollably as she cradles her abdomen.", "Notes": "The tragic revelation: Ochiyo is pregnant, making their suicide a poignant sacrifice of three lives."}, {"Scene_ID": "morning_michiyuki", "Scene_Title": "心中宵庚申：道行思ひの短夜 (Michiyuki Omoi no Mijikayo)", "Line_No": 9, "Speaker": "半兵衛 (Hanbei)", "Japanese_Ruby": "「ヲヽヲ<ruby>過分<rt>かぶん</rt></ruby>な。この<ruby>書置<rt>かきおき</rt></ruby>にも<ruby>書く<rt>かく</rt></ruby>とほり、<ruby>養子<rt>ようし</rt></ruby>になつて<ruby>十六<rt>じゅうろく</rt></ruby><ruby>年<rt>ねん</rt></ruby>この<ruby>方<rt>ほう</rt></ruby>、<ruby>十方<rt>じっぽう</rt></ruby><ruby>旦那<rt>だんな</rt></ruby>の<ruby>機嫌<rt>きげん</rt></ruby>を<ruby>取り<rt>とり</rt></ruby>、<ruby>元<rt>もと</rt></ruby>は<ruby>僅か<rt>わずか</rt></ruby>の<ruby>青物<rt>あおもの</rt></ruby><ruby>売り<rt>うり</rt></ruby>を、ここまでに<ruby>立て<rt>たて</rt></ruby>たるも<ruby>親<rt>おや</rt></ruby>の<ruby>恩<rt>おん</rt></ruby>。しかし<ruby>武士<rt>ぶし</rt></ruby>の<ruby>刀<rt>かたな</rt></ruby>にかけて、<ruby>義理<rt>ぎり</rt></ruby>と<ruby>操<rt>みさお</rt></ruby>を<ruby>立て<rt>たて</rt></ruby><ruby>通す<rt>とうす</rt></ruby>！」", "Japanese_Plain": "「ヲヽ過分な。この書置にも書くとほり、養子になつて十六年この方、十方旦那の機嫌を取り、元は僅かの青物売りを、ここまでに立てたるも親の恩。しかし武士の刀にかけて、義理と操を立て通す！」", "English": "'Oh, how tragic and sublime! As written in this testament, sixteen years since being adopted, I catered to every patron's whim, building up a humble vegetable stall into a thriving business out of gratitude to my adoptive parents. Yet on my ancestral samurai blade, I shall uphold honor, righteousness, and marital fidelity to the very end!'", "Notes": "Hanbei asserts his dual identity: dutiful merchant son and noble samurai warrior."}, {"Scene_ID": "morning_michiyuki", "Scene_Title": "心中宵庚申：道行思ひの短夜 (Michiyuki Omoi no Mijikayo)", "Line_No": 10, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "これとわが、<ruby>鳩尾<rt>みぞおち</rt></ruby>と<ruby>臍<rt>へそ</rt></ruby>の<ruby>二<rt>に</rt></ruby><ruby>所<rt>ところ</rt></ruby>、うんと<ruby>締め<rt>しめ</rt></ruby>ては<ruby>引<rt>ひき</rt></ruby><ruby>括り<rt>くくり</rt></ruby>、<ruby>脇差<rt>わきざし</rt></ruby><ruby>逆手<rt>ぎゃくて</rt></ruby>に<ruby>取<rt>しゅ</rt></ruby><ruby>持つ<rt>もつ</rt></ruby>て、<ruby>二<rt>に</rt></ruby><ruby>首<rt>くび</rt></ruby>の<ruby>辞世<rt>じせい</rt></ruby>にかくばかり。", "Japanese_Plain": "これとわが、鳩尾と臍の二所、うんと締めては引括り、脇差逆手に取持つて、二首の辞世にかくばかり。", "English": "Binding their bodies together tightly at solar plexus and navel with their sashes, he grasps the short sword in reverse grip and recites his twofold death poems.", "Notes": "Traditional suicide preparation: binding sashes so their bodies remain joined even in death."}, {"Scene_ID": "morning_michiyuki", "Scene_Title": "心中宵庚申：道行思ひの短夜 (Michiyuki Omoi no Mijikayo)", "Line_No": 11, "Speaker": "半兵衛 (Hanbei)", "Japanese_Ruby": "「<ruby>古<rt>いにしえ</rt></ruby>を<ruby>捨て<rt>すて</rt></ruby>ばや<ruby>義理<rt>ぎり</rt></ruby>も<ruby>思ふ<rt>おもふ</rt></ruby>まじ<ruby>朽ち<rt>くち</rt></ruby>ても<ruby>消え<rt>きえ</rt></ruby>ぬ<ruby>名<rt>めい</rt></ruby>こそ<ruby>惜しけ<rt>おしけ</rt></ruby>れ」", "Japanese_Plain": "「古（いにしえ）を捨てばや義理も思ふまじ朽ちても消えぬ名こそ惜しけれ」", "English": "'Were I to forsake my ancestral samurai past, I need not heed this debt of honor—yet even when my flesh crumbles to dust, my unblemished name is far too precious to tarnish.'", "Notes": "Hanbei's famous jisei (death poem), choosing death over dishonor."}, {"Scene_ID": "morning_michiyuki", "Scene_Title": "心中宵庚申：道行思ひの短夜 (Michiyuki Omoi no Mijikayo)", "Line_No": 12, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>遥々<rt>はるばる</rt></ruby>と、<ruby>浜松<rt>はままつ</rt></ruby><ruby>風<rt>かぜ</rt></ruby>に<ruby>揉ま<rt>もま</rt></ruby>れ<ruby>来て<rt>きて</rt></ruby>、<ruby>涙<rt>なみだ</rt></ruby>に<ruby>沈む<rt>しずむ</rt></ruby>ざゝんざの<ruby>声<rt>こえ</rt></ruby>、<ruby>三国<rt>みくに</rt></ruby><ruby>一<rt>いち</rt></ruby>ぢや、われは<ruby>仏<rt>ほとけ</rt></ruby>になりすます。", "Japanese_Plain": "遥々と、浜松風に揉まれ来て、涙に沈むざゝんざの声、三国一ぢや、われは仏になりすます。", "English": "From afar, tossed upon the pine winds blowing from the shore, the rustling murmurs drown in tears: 'Peerless in all three realms, we now enter eternal Buddhahood!'", "Notes": "Zazanza: onomatopoeia for pine wind and rhythmic waves, symbolizing peaceful transition to the Pure Land."}, {"Scene_ID": "morning_michiyuki", "Scene_Title": "心中宵庚申：道行思ひの短夜 (Michiyuki Omoi no Mijikayo)", "Line_No": 13, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "しやんと<ruby>左手<rt>ゆんで</rt></ruby>の<ruby>腹<rt>はら</rt></ruby>に<ruby>突<rt>とつ</rt></ruby><ruby>立て<rt>たて</rt></ruby>、<ruby>右手<rt>めて</rt></ruby>へくわらりと<ruby>引廻<rt>ひきまわし</rt></ruby>し、<ruby>返す<rt>かえす</rt></ruby><ruby>刃<rt>は</rt></ruby>に<ruby>笛掻き切り<rt>ふえかききり</rt></ruby>、この<ruby>世の<rt>よの</rt></ruby><ruby>縁切<rt>えんきり</rt></ruby>る、<ruby>息<rt>いき</rt></ruby><ruby>引<rt>ひき</rt></ruby><ruby>切る<rt>きる</rt></ruby>、<ruby>哀れ<rt>あわれ</rt></ruby>なりける。", "Japanese_Plain": "しやんと左手の腹に突立て、右手へくわらりと引廻し、返す刃に笛掻き切り、この世の縁切る、息引切る、哀れなりける。", "English": "Plunging the blade firmly into the left side of his belly, drawing it clean across to the right, with the returned edge slicing his throat—severing all earthly bonds, cutting off his mortal breath, an end of heartbreaking sorrow and tragic beauty.", "Notes": "Climax of Shinjū Yoi Gōshin: Hanbei carries out the samurai ritual of seppuku after slaying Ochiyo, immortalizing their love."}, {"Scene_ID": "afternoon_sugisakaya", "Scene_Title": "妹背山婦女庭訓：杉酒屋の段 (Sugi Sakaya no Dan)", "Line_No": 1, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>日<rt>にち</rt></ruby>とともに<ruby>営む<rt>いとなむ</rt></ruby>さまも<ruby>入相<rt>いりあい</rt></ruby>の、<ruby>四方<rt>しほう</rt></ruby>の<ruby>市庫<rt>いちくら</rt></ruby><ruby>戸<rt>こ</rt></ruby>ざし<ruby>時<rt>とき</rt></ruby>。<ruby>子太郎<rt>ねたろう</rt></ruby><ruby>跡<rt>あと</rt></ruby>を<ruby>打<rt>だ</rt></ruby><ruby>見や<rt>みや</rt></ruby>り、<ruby>灯<rt>ともしび</rt></ruby>を<ruby>上げ<rt>あげ</rt></ruby><ruby>表<rt>おもて</rt></ruby>の<ruby>戸<rt>こ</rt></ruby>、<ruby>夜<rt>よる</rt></ruby>の<ruby>構<rt>こう</rt></ruby>へのそここと。", "Japanese_Plain": "日とともに営むさまも入相の、四方の市庫戸ざし時。子太郎跡を打見やり、灯を上げ表の戸、夜の構へのそここと。", "English": "As the day's labors draw to a close with the sunset bell, the surrounding market warehouses shutter their doors. Shop-boy Netarō watches the scene, raising the lanterns and barring the front entrance for the night.", "Notes": "Opening of Act IV at the Miwa sake brewery (杉酒屋) in Yamato Province."}, {"Scene_ID": "afternoon_sugisakaya", "Scene_Title": "妹背山婦女庭訓：杉酒屋の段 (Sugi Sakaya no Dan)", "Line_No": 2, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "こなたの<ruby>道<rt>みち</rt></ruby>より<ruby>歩み<rt>あゆみ</rt></ruby>よる<ruby>振り<rt>ふり</rt></ruby>の<ruby>袖<rt>そで</rt></ruby>の<ruby>香<rt>かおり</rt></ruby>やごとなき、<ruby>面<rt>めん</rt></ruby>を<ruby>隠す<rt>かくす</rt></ruby><ruby>衣かづき<rt>きぬかづき</rt></ruby><ruby>誰<rt>だれ</rt></ruby>れ<ruby>白絹<rt>しらぎぬ</rt></ruby>のやさ<ruby>姿<rt>すがた</rt></ruby>。<ruby>窺<rt>き</rt></ruby>ふうちに<ruby>隣り<rt>となり</rt></ruby>の<ruby>軒<rt>けん</rt></ruby>。<ruby>知らせ<rt>しらせ</rt></ruby>のしはぶき、<ruby>主の<rt>おもの</rt></ruby><ruby>求馬<rt>もとめ</rt></ruby>。", "Japanese_Plain": "こなたの道より歩みよる振りの袖の香やごとなき、面を隠す衣かづき誰れ白絹のやさ姿。窺ふうちに隣りの軒。知らせのしはぶき、主の求馬。", "English": "Approaching along the road, the elegant scent wafting from her swinging sleeves is unmistakably noble. Her face concealed beneath a white silk veil, she presents a graceful, delicate figure. Slipping quietly toward the neighbor's eaves, she gives a soft cough of signal to Motome.", "Notes": "Kinukazuki (衣かづき): traditional veil draped over the head by noblewomen traveling incognito. The lady is Princess Tachibana in disguise."}, {"Scene_ID": "afternoon_sugisakaya", "Scene_Title": "妹背山婦女庭訓：杉酒屋の段 (Sugi Sakaya no Dan)", "Line_No": 3, "Speaker": "求馬 (Motome)", "Japanese_Ruby": "「<ruby>今宵<rt>こよい</rt></ruby>はどうしてはやかりし。サア／＼こちへ」とその<ruby>跡<rt>あと</rt></ruby>は<ruby>云<rt>うん</rt></ruby>はず<ruby>語ら<rt>かたら</rt></ruby>ず<ruby>手<rt>て</rt></ruby>を<ruby>取っ<rt>とっ</rt></ruby>て、<ruby>戸口<rt>とぐち</rt></ruby><ruby>立寄<rt>たちより</rt></ruby>せ<ruby>入る<rt>いる</rt></ruby><ruby>跡<rt>あと</rt></ruby>に<ruby>子太郎<rt>ねたろう</rt></ruby>は<ruby>不審<rt>ふしん</rt></ruby><ruby>顔<rt>かお</rt></ruby>。", "Japanese_Plain": "「今宵はどうしてはやかりし。サア／＼こちへ」とその跡は云はず語らず手を取って、戸口立寄せ入る跡に子太郎は不審顔。", "English": "'Why are you so early tonight? Come, hurry inside!' and without another word he takes her hand and draws her in, shutting the door behind them, leaving Netarō staring with suspicion.", "Notes": "Motome (secretly Minamoto no Tankei in hiding) whisks Princess Tachibana inside."}, {"Scene_ID": "afternoon_sugisakaya", "Scene_Title": "妹背山婦女庭訓：杉酒屋の段 (Sugi Sakaya no Dan)", "Line_No": 4, "Speaker": "子太郎 (Netarō)", "Japanese_Ruby": "「なんでも<ruby>隣<rt>となり</rt></ruby>の<ruby>烏帽子<rt>えぼし</rt></ruby>めはおれとは<ruby>違う<rt>ちがう</rt></ruby>てよっぽどえらい<ruby>色事<rt>いろごと</rt></ruby><ruby>師<rt>し</rt></ruby>ぢゃわい。あいつが<ruby>見事<rt>みごと</rt></ruby>な<ruby>烏帽子<rt>えぼし</rt></ruby>でアノしろもの<ruby>占め<rt>しめ</rt></ruby>をると<ruby>聞<rt>ぶん</rt></ruby>えた。こちらのお<ruby>娘<rt>むすめ</rt></ruby>に<ruby>聞か<rt>きか</rt></ruby>せたらたいていのことぢゃあるまい」", "Japanese_Plain": "「なんでも隣の烏帽子めはおれとは違うてよっぽどえらい色事師ぢゃわい。あいつが見事な烏帽子でアノしろもの占めをると聞えた。こちらのお娘に聞かせたらたいていのことぢゃあるまい」", "English": "'Well now! That court-capped dandy next door is a far slicker ladies' man than me! To think he's bagged that exquisite creature for himself! If our young mistress hears about this, all hell will break loose!'", "Notes": "Netarō's comic eavesdropping monologue introducing the central romantic rivalry."}, {"Scene_ID": "afternoon_sugisakaya", "Scene_Title": "妹背山婦女庭訓：杉酒屋の段 (Sugi Sakaya no Dan)", "Line_No": 5, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "とつぶやくところへ、<ruby>娘<rt>むすめ</rt></ruby>の<ruby>お三輪<rt>おみわ</rt></ruby>、<ruby>寺子屋<rt>てらこや</rt></ruby><ruby>戻り<rt>もどり</rt></ruby>、<ruby>足<rt>あし</rt></ruby>はやに<ruby>門口<rt>かどぐち</rt></ruby><ruby>這<rt>しゃ</rt></ruby><ruby>入れ<rt>いれ</rt></ruby>ば。", "Japanese_Plain": "とつぶやくところへ、娘のお三輪、寺子屋戻り、足はやに門口這入れば。", "English": "As he mutters to himself, the daughter Omiwa returns home briskly from her lessons at the temple school, stepping through the doorway.", "Notes": "Entrance of Omiwa, the innocent, passionate heroine of Act IV."}, {"Scene_ID": "afternoon_sugisakaya", "Scene_Title": "妹背山婦女庭訓：杉酒屋の段 (Sugi Sakaya no Dan)", "Line_No": 6, "Speaker": "子太郎 (Netarō)", "Japanese_Ruby": "「ヤ<ruby>お三輪<rt>おみわ</rt></ruby><ruby>様<rt>さま</rt></ruby><ruby>戻ら<rt>もどら</rt></ruby>んしたか。サア／＼ことぢゃ／＼<ruby>大事<rt>だいじ</rt></ruby>ぢゃ／＼！」", "Japanese_Plain": "「ヤお三輪様戻らんしたか。サア／＼ことぢゃ／＼大事ぢゃ／＼！」", "English": "'Oh, Mistress Omiwa, you've returned? Quick, quick! Terrible news! Disaster has struck!'", "Notes": "Netarō gleefully agitates Omiwa's anxiety."}, {"Scene_ID": "afternoon_sugisakaya", "Scene_Title": "妹背山婦女庭訓：杉酒屋の段 (Sugi Sakaya no Dan)", "Line_No": 7, "Speaker": "お三輪 (Omiwa)", "Japanese_Ruby": "「オゝあの<ruby>人<rt>にん</rt></ruby>わいのなんぢゃいの。<ruby>私<rt>わたし</rt></ruby>にびっくりさしやったわいの！」", "Japanese_Plain": "「オゝあの人わいのなんぢゃいの。私にびっくりさしやったわいの！」", "English": "'Good heavens, what on earth is the matter with you? You gave me quite a fright!'", "Notes": "Omiwa's sweet, naive provincial dialect (Kansai vernacular)."}, {"Scene_ID": "afternoon_sugisakaya", "Scene_Title": "妹背山婦女庭訓：杉酒屋の段 (Sugi Sakaya no Dan)", "Line_No": 8, "Speaker": "子太郎 (Netarō)", "Japanese_Ruby": "「なんじゃさしゃったわいのどころかいの。これお<ruby>前<rt>まえ</rt></ruby>に<ruby>忠義<rt>ちゅうぎ</rt></ruby>を<ruby>云う<rt>いう</rt></ruby>て<ruby>聞か<rt>きか</rt></ruby>す、<ruby>忠義<rt>ちゅうぎ</rt></ruby>を！」", "Japanese_Plain": "「なんじゃさしゃったわいのどころかいの。これお前に忠義を云うて聞かす、忠義を！」", "English": "'A fright, you say? It's much bigger than a fright! I am about to teach you what real loyalty is—pure loyalty!'", "Notes": "Netarō misuses samurai terms like 'chūgi' (feudal loyalty) for romantic fidelity."}, {"Scene_ID": "afternoon_sugisakaya", "Scene_Title": "妹背山婦女庭訓：杉酒屋の段 (Sugi Sakaya no Dan)", "Line_No": 9, "Speaker": "お三輪 (Omiwa)", "Japanese_Ruby": "「<ruby>忠義<rt>ちゅうぎ</rt></ruby>とはなんのことぢゃいの。サその<ruby>忠臣<rt>ちゅうしん</rt></ruby>は<ruby>知って<rt>しって</rt></ruby>ゐるがの。それがどうぞしたかや」", "Japanese_Plain": "「忠義とはなんのことぢゃいの。サその忠臣は知ってゐるがの。それがどうぞしたかや」", "English": "'Loyalty? What has that got to do with anything? I know about loyal retainers, but what of it?'", "Notes": "Omiwa's innocent confusion."}, {"Scene_ID": "afternoon_sugisakaya", "Scene_Title": "妹背山婦女庭訓：杉酒屋の段 (Sugi Sakaya no Dan)", "Line_No": 10, "Speaker": "子太郎 (Netarō)", "Japanese_Ruby": "「アノ<ruby>隣り<rt>となり</rt></ruby>の<ruby>烏帽子<rt>えぼし</rt></ruby>、<ruby>求馬<rt>もとめ</rt></ruby><ruby>様の<rt>ようの</rt></ruby>ことぢゃ。<ruby>真白<rt>まっしろ</rt></ruby>な<ruby>絹<rt>きぬ</rt></ruby>をかつぎ、<ruby>幽霊<rt>ゆうれい</rt></ruby>かと<ruby>思う<rt>おもう</rt></ruby>たら<ruby>美しい<rt>うつくしい</rt></ruby><ruby>女<rt>おんな</rt></ruby>が<ruby>隣り<rt>となり</rt></ruby>の<ruby>門口<rt>かどぐち</rt></ruby>こと／＼と<ruby>叩い<rt>たたい</rt></ruby>た。そしたら<ruby>求馬<rt>もとめ</rt></ruby><ruby>様<rt>さま</rt></ruby>がつつと<ruby>出て<rt>でて</rt></ruby>、『ようはやう<ruby>来た<rt>きた</rt></ruby>ナア』と<ruby>手に<rt>てに</rt></ruby><ruby>手<rt>て</rt></ruby>を<ruby>取っ<rt>とっ</rt></ruby>てうちへはいった！」", "Japanese_Plain": "「アノ隣りの烏帽子、求馬様のことぢゃ。真白な絹をかつぎ、幽霊かと思うたら美しい女が隣りの門口こと／＼と叩いた。そしたら求馬様がつつと出て、『ようはやう来たナア』と手に手を取ってうちへはいった！」", "English": "'It's about that court-capped fellow next door—Master Motome! A woman draped in pure white silk like a ghost knocked on his door. Motome rushed out, said 'You've come early tonight!' and took her by the hand straight inside!'", "Notes": "Netarō drops the bombshell about Motome's secret visitor."}, {"Scene_ID": "afternoon_sugisakaya", "Scene_Title": "妹背山婦女庭訓：杉酒屋の段 (Sugi Sakaya no Dan)", "Line_No": 11, "Speaker": "お三輪 (Omiwa)", "Japanese_Ruby": "「そりゃマア<ruby>合点<rt>がてん</rt></ruby>のいかぬこと。<ruby>幸<rt>さち</rt></ruby>ひかか<ruby>様<rt>さま</rt></ruby>も<ruby>留守<rt>るす</rt></ruby>なれば、そなた<ruby>往<rt>おう</rt></ruby>て<ruby>求馬<rt>もとめ</rt></ruby><ruby>様<rt>さま</rt></ruby>をここへ<ruby>連れ<rt>つれ</rt></ruby>て<ruby>戻っ<rt>もどっ</rt></ruby>てたも！」", "Japanese_Plain": "「そりゃマア合点のいかぬこと。幸ひかか様も留守なれば、そなた往て求馬様をここへ連れて戻ってたも！」", "English": "'Good heavens, I cannot fathom such a thing! Fortunately Mother is away—run over this instant and bring Master Motome here to me!'", "Notes": "Omiwa's jealousy flares; she demands an immediate explanation."}, {"Scene_ID": "afternoon_sugisakaya", "Scene_Title": "妹背山婦女庭訓：杉酒屋の段 (Sugi Sakaya no Dan)", "Line_No": 12, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>子太郎<rt>ねたろう</rt></ruby><ruby>無理<rt>むり</rt></ruby>やりに<ruby>手<rt>て</rt></ruby>を<ruby>引<rt>ひき</rt></ruby><ruby>連れ<rt>つれ</rt></ruby>てわが<ruby>家<rt>いえ</rt></ruby>のうち。それと<ruby>見る<rt>みる</rt></ruby>より<ruby>娘<rt>むすめ</rt></ruby>の<ruby>お三輪<rt>おみわ</rt></ruby>、<ruby>口<rt>くち</rt></ruby>に<ruby>云<rt>うん</rt></ruby>はねど<ruby>赤<rt>あか</rt></ruby>らむ<ruby>顔<rt>かお</rt></ruby>。「<ruby>求馬<rt>もとめ</rt></ruby><ruby>様<rt>さま</rt></ruby>お<ruby>帰り<rt>かえり</rt></ruby>なされたか」", "Japanese_Plain": "子太郎無理やりに手を引連れてわが家のうち。それと見るより娘のお三輪、口に云はねど赤らむ顔。「求馬様お帰りなされたか」", "English": "Netarō drags Motome forcibly by the sleeve into their shop. The moment she sees him, though Omiwa says nothing of her jealousy, her cheeks flush crimson: 'Master Motome, have you returned?'", "Notes": "Motome is brought face-to-face with the flustered Omiwa."}, {"Scene_ID": "afternoon_sugisakaya", "Scene_Title": "妹背山婦女庭訓：杉酒屋の段 (Sugi Sakaya no Dan)", "Line_No": 13, "Speaker": "求馬 (Motome)", "Japanese_Ruby": "「ホこれは／＼<ruby>お三輪<rt>おみわ</rt></ruby><ruby>様<rt>さま</rt></ruby>。<ruby>寺<rt>てら</rt></ruby><ruby>屋<rt>や</rt></ruby>へお<ruby>出で<rt>いで</rt></ruby>なさったげな。いつものやうに<ruby>酒呑<rt>さけのみ</rt></ruby>んで、<ruby>気晴らし<rt>きばらし</rt></ruby>でもいたさうかい」", "Japanese_Plain": "「ホこれは／＼お三輪様。寺屋へお出でなさったげな。いつものやうに酒呑んで、気晴らしでもいたさうかい」", "English": "'Well, Mistress Omiwa! I hear you've been away at the temple school. Shall we drink some sake as usual to cheer our spirits?'", "Notes": "Motome tries to act nonchalant and charm Omiwa."}, {"Scene_ID": "afternoon_sugisakaya", "Scene_Title": "妹背山婦女庭訓：杉酒屋の段 (Sugi Sakaya no Dan)", "Line_No": 14, "Speaker": "お三輪 (Omiwa)", "Japanese_Ruby": "「<ruby>酒<rt>さけ</rt></ruby>どころか、<ruby>私<rt>わたし</rt></ruby>の<ruby>胸<rt>むね</rt></ruby>には<ruby>炎<rt>ほのお</rt></ruby>が<ruby>燃え<rt>もえ</rt></ruby>てゐます。<ruby>隣<rt>となり</rt></ruby>のお<ruby>部屋<rt>へや</rt></ruby>に<ruby>隠し<rt>かくし</rt></ruby>た<ruby>美しい<rt>うつくしい</rt></ruby><ruby>御方<rt>おんかた</rt></ruby>……<ruby>求馬<rt>もとめ</rt></ruby><ruby>様<rt>さま</rt></ruby>、<ruby>私<rt>わたし</rt></ruby>を<ruby>騙し<rt>だまし</rt></ruby>てゐるのではござりませぬか！」", "Japanese_Plain": "「酒どころか、私の胸には炎が燃えてゐます。隣のお部屋に隠した美しい御方……求馬様、私を騙してゐるのではござりませぬか！」", "English": "'Sake? A blazing fire is burning within my breast! That beautiful noble lady hidden in your room next door... Master Motome, have you been deceiving me all this time?!'", "Notes": "Omiwa confronts Motome directly with her anguish."}, {"Scene_ID": "afternoon_sugisakaya", "Scene_Title": "妹背山婦女庭訓：杉酒屋の段 (Sugi Sakaya no Dan)", "Line_No": 15, "Speaker": "求馬 (Motome)", "Japanese_Ruby": "「<ruby>滅相<rt>めっさう</rt></ruby>もない。<ruby>お三輪<rt>おみわ</rt></ruby><ruby>様<rt>さま</rt></ruby>、<ruby>私<rt>わたし</rt></ruby>の<ruby>心<rt>こころ</rt></ruby>がお<ruby>前<rt>まえ</rt></ruby>を<ruby>捨て<rt>すて</rt></ruby>て<ruby>他へ<rt>たへ</rt></ruby><ruby>移る<rt>うつる</rt></ruby>など、<ruby>天地<rt>てんち</rt></ruby><ruby>神明<rt>じんめい</rt></ruby>に<ruby>誓う<rt>ちかう</rt></ruby>てござらぬ！」", "Japanese_Plain": "「滅相もない。お三輪様、私の心がお前を捨てて他へ移るなど、天地神明に誓うてござらぬ！」", "English": "'Perish the thought! Mistress Omiwa, that my heart would ever abandon you for another—I swear by Heaven and Earth no such betrayal exists!'", "Notes": "Motome reassures her, yet his royal mission forces him to protect Princess Tachibana."}, {"Scene_ID": "afternoon_sugisakaya", "Scene_Title": "妹背山婦女庭訓：杉酒屋の段 (Sugi Sakaya no Dan)", "Line_No": 16, "Speaker": "太夫 (Narrator)", "Japanese_Ruby": "<ruby>折<rt>おり</rt></ruby>からいきせき<ruby>戻る<rt>もどる</rt></ruby>この<ruby>家<rt>いえ</rt></ruby>の<ruby>母<rt>はは</rt></ruby>。「ヤア<ruby>求馬<rt>もとめ</rt></ruby><ruby>殿<rt>どの</rt></ruby>。こなさんには<ruby>用<rt>よう</rt></ruby>がある。どっこへも<ruby>遣る<rt>やる</rt></ruby>ことならぬ。<ruby>動く<rt>うごく</rt></ruby>まいぞ」", "Japanese_Plain": "折からいきせき戻るこの家の母。「ヤア求馬殿。こなさんには用がある。どっこへも遣ることならぬ。動くまいぞ」", "English": "Just then, the mother of the shop returns panting: 'Hey, Master Motome! I have pressing b
